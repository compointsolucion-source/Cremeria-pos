<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instalar Compoint Punto</title>
<link rel="icon" href="emblema.png">
<style>
  :root { --verde:#5FAE46; --verde-osc:#4C9439; --texto:#1F2023; --muted:#6a6e75; --borde:#e3e6ea; --fondo:#fff; --noche:#1d2b22; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', system-ui, Arial, sans-serif; color: var(--texto); background: var(--fondo); font-size: 14px; overflow: hidden; }
  button { font-family: inherit; border: 0; border-radius: 9px; padding: 11px 20px; font-size: 14px; font-weight: 700; cursor: pointer; transition: filter .12s, transform .05s; white-space: nowrap; }
  button:hover:not(:disabled) { filter: brightness(.96); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .op, .hallado { white-space: normal; }
  .pri { background: var(--verde); color: #fff; }
  .sec { background: #e9ecef; color: #333; }
  input, select { font-family: inherit; border: 1px solid #cfd4da; border-radius: 8px; padding: 8px 10px; font-size: 13.5px; width: 100%; background: #fff; color: #222; }
  input:focus, select:focus { outline: 2px solid rgba(95,174,70,.45); border-color: var(--verde); }
  input:disabled { background: #f1f3f5; color: #6a6e75; }
  code { background: #eef0f2; border-radius: 5px; padding: 1px 6px; font-size: 12.5px; }

  .app { display: flex; height: 100vh; min-height: 540px; }
  .lado { width: 220px; flex: none; background: linear-gradient(170deg,#1d2b22,#25352b 60%,#2c4333); color: #fff; padding: 24px 18px; display: flex; flex-direction: column; gap: 22px; }
  .lado img.lg { width: 168px; display: block; margin: 0 auto; }
  .pasos { display: grid; gap: 14px; margin-top: 4px; }
  .pasos div { display: flex; align-items: center; gap: 11px; font-size: 14px; color: #a9bcae; }
  .pasos i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #587061; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 12px; font-weight: 800; flex: none; }
  .pasos .on { color: #fff; font-weight: 700; } .pasos .on i { background: var(--verde); border-color: var(--verde); }
  .pasos .hecho { color: #cfe0d3; } .pasos .hecho i { background: #3d6a49; border-color: #3d6a49; color: #fff; }
  .lado .v { margin-top: auto; font-size: 11.5px; color: #8aa292; line-height: 1.5; }

  .main { flex: 1; min-width: 0; padding: 26px 34px 0; display: flex; flex-direction: column; gap: 13px; overflow-y: auto; }
  h1 { font-size: 23px; line-height: 1.2; }
  p.s { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .pie { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: auto; padding: 12px 0 20px; border-top: 1px solid #e9ecef; flex: none; position: sticky; bottom: 0; background: #fff; }
  .pie small { color: #7A7D83; font-size: 12.5px; }
  .pie .der { display: flex; gap: 10px; }

  .aviso { background: #FFF8E1; border: 1px solid #f5d98a; color: #7a5b00; border-radius: 10px; padding: 10px 13px; font-size: 13px; line-height: 1.45; }
  .aviso.rojo { background: #FDECEA; border-color: #f2b8b5; color: #8E1B1B; }
  .aviso.azul { background: #e8f1fb; border-color: #b7d3f2; color: #0D47A1; }
  .avisos { display: grid; gap: 8px; }
  .cargando { display: flex; align-items: center; gap: 12px; color: var(--muted); padding: 18px 4px; }
  .rueda { width: 20px; height: 20px; border-radius: 50%; border: 3px solid #d9ded9; border-top-color: var(--verde); animation: gira .8s linear infinite; flex: none; }
  @keyframes gira { to { transform: rotate(360deg); } }

  .info { border: 1px solid var(--borde); border-radius: 13px; overflow: hidden; }
  .info .fila { display: flex; align-items: center; gap: 12px; padding: 10px 15px; border-bottom: 1px solid #eceef0; font-size: 13.5px; }
  .info .fila:last-child { border-bottom: 0; }
  .info .fila .ic { width: 24px; text-align: center; font-size: 16px; flex: none; }
  .info .fila .t { color: var(--muted); width: 122px; flex: none; }
  .info .fila b { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 13px; }
  .etq { font-size: 11.5px; font-weight: 800; border-radius: 12px; padding: 2px 9px; flex: none; white-space: nowrap; }
  .etq.ok { background: rgba(95,174,70,.16); color: #2E7D32; } .etq.no { background: #FFF1C9; color: #8a6200; } .etq.az { background: #e1ecfa; color: #0D47A1; }

  .opc { display: grid; gap: 12px; margin-top: 2px; }
  .op { border: 2px solid var(--borde); border-radius: 14px; padding: 16px 18px; display: flex; gap: 14px; align-items: center; cursor: pointer; background: #fff; text-align: left; width: 100%; font-weight: 400; color: inherit; }
  .op:hover:not(:disabled) { border-color: #b9dcab; filter: none; }
  .op.sel { border-color: var(--verde); background: rgba(95,174,70,.07); }
  .op .rd { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #b5bbc2; flex: none; display: flex; align-items: center; justify-content: center; }
  .op.sel .rd { border-color: var(--verde); } .op.sel .rd::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--verde); }
  .op .ic { font-size: 28px; flex: none; }
  .op h3 { font-size: 16.5px; display: flex; align-items: center; gap: 8px; }
  .op h3 em { font-style: normal; background: var(--verde); color: #fff; font-size: 10.5px; padding: 2px 8px; border-radius: 10px; }
  .op p { font-size: 13.5px; color: #5d6168; line-height: 1.45; margin-top: 3px; }
  .op.mini { padding: 13px 16px; } .op.mini .ic { font-size: 24px; } .op.mini h3 { font-size: 15.5px; } .op.mini p { font-size: 13px; }

  .tar { border: 1px solid var(--borde); border-radius: 13px; padding: 12px 15px; display: grid; gap: 8px; background: #fcfcfd; align-content: start; }
  .tar .h { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14.5px; font-weight: 700; }
  .tar .nota { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .ruta { display: flex; gap: 8px; }
  .ruta input { flex: 1; font-family: Consolas, 'Courier New', monospace; font-size: 12.5px; }
  .ruta button { padding: 8px 14px; font-size: 13px; }
  .campo-err { color: #c62828; font-size: 12.5px; line-height: 1.4; }
  .campo-err:empty { display: none; }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .chips span { font-size: 12px; background: #eef1f3; border-radius: 8px; padding: 3px 9px; color: #4b5057; }
  .chips span b { color: #222; } .chips span.usb { background: #e8f1fb; color: #0D47A1; } .chips span.t { background: none; padding: 3px 0; color: #7A7D83; }
  .chk { display: flex; align-items: center; gap: 9px; font-size: 13.5px; padding: 3px 0; cursor: pointer; user-select: none; }
  .chk input { width: 17px; height: 17px; accent-color: var(--verde); padding: 0; flex: none; }
  .chk small { color: #7A7D83; font-size: 12px; margin-left: 2px; }
  .sw { width: 40px; height: 23px; border-radius: 12px; background: #bfc4ca; position: relative; flex: none; cursor: pointer; border: 0; padding: 0; transition: background .15s; }
  .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .sw.on { background: var(--verde); } .sw.on::after { left: 20px; }
  .fila-sw { display: flex; align-items: center; gap: 10px; margin-top: 2px; font-size: 13.5px; }
  .fila-sw .g { color: #7A7D83; }
  .enlace { background: none; color: #1565C0; padding: 4px 0; font-weight: 700; font-size: 13px; text-align: left; }
  .enlace:hover { text-decoration: underline; filter: none; }

  .barra { height: 9px; border-radius: 6px; background: var(--borde); overflow: hidden; flex: none; }
  .barra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#5FAE46,#7bc45f); border-radius: 6px; transition: width .35s; }
  .lista { display: grid; gap: 9px; }
  .paso { display: flex; gap: 13px; align-items: center; padding: 12px 15px; border-radius: 12px; background: #f5f7f8; font-size: 14.5px; }
  .paso .p { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12.5px; flex: none; background: #dfe3e7; color: #888; }
  .paso small { display: block; color: #7A7D83; font-size: 12.5px; margin-top: 1px; overflow-wrap: anywhere; }
  .paso.ok { background: rgba(95,174,70,.12); } .paso.ok .p { background: var(--verde); color: #fff; }
  .paso.haciendo { background: #FFF8E1; } .paso.haciendo .p { background: #fff; padding: 0; }
  .paso.aviso { background: #FFF8E1; } .paso.aviso .p { background: #f5b82e; color: #fff; }
  .paso.error { background: #FDECEA; } .paso.error .p { background: #d9534f; color: #fff; }
  .paso.pendiente { opacity: .65; }

  .cab-listo { display: flex; gap: 14px; align-items: center; }
  .cab-listo .c { width: 52px; height: 52px; border-radius: 50%; background: var(--verde); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; flex: none; }
  .cab-listo .c.mal { background: #d9534f; }
  .dir { background: var(--noche); color: #fff; border-radius: 14px; padding: 15px 20px; display: flex; align-items: center; gap: 14px; }
  .dir .t { flex: 1; min-width: 0; }
  .dir small { display: block; color: #9fb8a6; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .dir b { font-size: 18px; overflow-wrap: anywhere; }
  .dir button { padding: 7px 14px; font-size: 12.5px; }
  .item { display: flex; gap: 13px; align-items: center; padding: 11px 15px; border-radius: 12px; background: #f5f7f8; font-size: 14px; }
  .item .ic { font-size: 21px; width: 28px; text-align: center; flex: none; }
  .item small { display: block; color: #7A7D83; font-size: 12.5px; margin-top: 1px; overflow-wrap: anywhere; }
  .item .grow { flex: 1; min-width: 0; }
  .item button { padding: 5px 12px; font-size: 12.5px; }
  .centro { margin: auto; text-align: center; display: grid; gap: 12px; justify-items: center; }
  .centro .c { width: 64px; height: 64px; border-radius: 50%; background: var(--verde); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 34px; }

  /* Selector de carpetas */
  .vel { position: fixed; inset: 0; background: rgba(20,28,24,.55); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 18px; }
  .modal { background: #fff; border-radius: 16px; width: 640px; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 18px 50px rgba(0,0,0,.4); overflow: hidden; }
  .modal .cab { padding: 16px 20px 10px; display: grid; gap: 4px; }
  .modal .cab h2 { font-size: 18px; }
  .modal .cuerpo { padding: 0 20px; display: grid; gap: 10px; min-height: 0; overflow-y: auto; }
  .modal .barra-ruta { display: flex; gap: 8px; }
  .modal .barra-ruta input { flex: 1; font-family: Consolas, 'Courier New', monospace; font-size: 12.5px; }
  .modal .barra-ruta button { padding: 8px 12px; font-size: 13px; }
  .modal .carpetas { border: 1px solid var(--borde); border-radius: 12px; height: 220px; overflow-y: auto; background: #fff; }
  .modal .carpetas button { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border-radius: 0; padding: 9px 14px; font-weight: 400; font-size: 13.5px; text-align: left; border-bottom: 1px solid #f0f2f4; color: #222; white-space: normal; overflow-wrap: anywhere; }
  .modal .carpetas button:hover { background: #f1f7ee; filter: none; }
  .modal .carpetas button .n { flex: 1; min-width: 0; }
  .modal .carpetas button small { color: #7A7D83; font-size: 12px; white-space: nowrap; }
  .modal .vacio { padding: 26px; text-align: center; color: #7A7D83; font-size: 13px; }
  .modal .estado-c { font-size: 12.5px; color: #5d6168; line-height: 1.45; min-height: 18px; }
  .modal .sera { background: #f1f7ee; border: 1px solid #cfe5c6; border-radius: 10px; padding: 8px 12px; font-size: 12.5px; color: #2e5a20; overflow-wrap: anywhere; }
  .modal .nueva { display: flex; gap: 8px; }
  .modal .nueva input { flex: 1; }
  .modal .pie-m { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 20px 16px; border-top: 1px solid #e9ecef; margin-top: 12px; }
  .modal .pie-m .der { display: flex; gap: 10px; }
  .modal .err-m { color: #c62828; font-size: 12.5px; min-height: 17px; }
</style>
</head>
<body>
<div class="app">
  <aside class="lado">
    <img class="lg" src="logo-claro.png" alt="Compoint, punto de soluciones">
    <div class="pasos" id="pasosLado"></div>
    <div class="v" id="ver">Instalador de escritorio<br>Versión __VERSION__</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="capa"></div>

<script>
const TOKEN = '__TOKEN__';
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(ruta, cuerpo) {
  let r;
  try {
    r = await fetch(ruta, { method: cuerpo ? 'POST' : 'GET', headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
  } catch (e) { throw new Error('El instalador se cerró. Ábrelo de nuevo.'); }
  let datos = {};
  try { datos = await r.json(); } catch (e) { /* sin cuerpo */ }
  if (!r.ok) { const err = new Error(datos.error || 'Algo salió mal.'); err.datos = datos; err.codigo = r.status; throw err; }
  return datos;
}

/* ---------------------------------------------------------------- utilidades de rutas y tamaños */
const SUB = { programa: 'Compoint Punto', datos: 'Compoint datos', respaldos: 'Respaldos Compoint', copiaExtra: 'Respaldos Compoint' };
const unir = (base, sub) => base.replace(/[\\/]+$/, '') + '\\' + sub;
const esRaiz = (r) => /^[A-Za-z]:[\\/]?$/.test(r) || /^\\\\[^\\]+\\[^\\]+$/.test(r);
function tam(b) {
  if (b >= 1024 * 1024 * 1024) return (b / (1024 * 1024 * 1024)).toFixed(b >= 100 * 1024 * 1024 * 1024 ? 0 : 1).replace('.0', '') + ' GB';
  if (b >= 1024 * 1024) return Math.round(b / (1024 * 1024)) + ' MB';
  return Math.round(b / 1024) + ' KB';
}
const aprox = (b) => tam(Math.round(b / (10 * 1048576)) * 10 * 1048576);
function unidadDe(ruta) {
  const m = /^([A-Za-z]):/.exec(ruta || '');
  if (!m || !S.estado) return null;
  return (S.estado.unidades || []).find((u) => u.letra.toUpperCase() === m[1].toUpperCase() + ':') || null;
}
const nombreTipo = (u) => (u.tipo === 'usb' ? 'USB' : (u.tipo === 'red' ? 'Red' : 'Disco interno'));
const instaladoAprox = () => Math.round(((S.estado && S.estado.tamanoNecesario) || 0) / 1.1);

/* ---------------------------------------------------------------- estado de la pantalla */
const S = {
  estado: null, pant: 'bienvenida', modo: 'pred', uso: 'caja', desde: 'tipo',
  op: { programa: '', datos: '', respaldos: '', copiaExtraOn: false, copiaExtra: '', escritorio: true, inicio: true, abrirConWindows: true, intermediario: true },
  val: null, secVal: 0, trabajo: null, ultimaOp: null, errorForm: '', enviando: false, abriendo: false
};

const NOMBRES_LADO = ['Bienvenida', 'Tipo', 'Carpetas', 'Instalando', 'Listo'];
const PASO_DE = { bienvenida: 1, tipo: 2, uso: 2, carpetas: 3, instalando: 4, error: 4, listo: 5 };

function pintarLado() {
  const n = PASO_DE[S.pant] || 1;
  $('#pasosLado').innerHTML = NOMBRES_LADO.map((t, i) => {
    const k = i + 1;
    const hecho = k < n || S.pant === 'listo';
    return '<div class="' + (k === n && S.pant !== 'listo' ? 'on' : (hecho ? 'hecho' : '')) + '"><i>' + (hecho ? '✓' : k) + '</i>' + t + '</div>';
  }).join('');
}

function ir(pant) { S.pant = pant; S.errorForm = ''; dibujar(); }

function dibujar() {
  pintarLado();
  ({ bienvenida, tipo, uso, carpetas, instalando, error: pantError, listo }[S.pant])();
  $('#main').scrollTop = 0;
}

function opcionesActuales() {
  const o = S.op, pred = S.modo === 'pred';
  const srv = !pred && S.uso === 'servidor';
  return {
    modo: pred ? 'pred' : 'av', uso: pred ? 'caja' : S.uso, programa: o.programa.trim(),
    datos: srv ? o.datos.trim() : '', respaldos: srv ? o.respaldos.trim() : '',
    copiaExtraOn: srv && o.copiaExtraOn, copiaExtra: srv && o.copiaExtraOn ? o.copiaExtra.trim() : '',
    escritorio: pred ? true : o.escritorio, inicio: pred ? true : o.inicio,
    abrirConWindows: pred ? true : o.abrirConWindows, intermediario: pred ? true : o.intermediario
  };
}

let temporizadorVal = null;
function validarLuego(ms, alTerminar) {
  clearTimeout(temporizadorVal);
  temporizadorVal = setTimeout(() => validarAhora().then(alTerminar), ms);
}
async function validarAhora() {
  const mi = ++S.secVal;
  try {
    const v = await api('/api/validar', opcionesActuales());
    if (mi === S.secVal) S.val = v;
  } catch (e) { if (mi === S.secVal) S.val = { errores: [e.message], avisos: [], campos: {}, necesitaAdmin: false }; }
  return mi === S.secVal;
}

async function salir() {
  try { await api('/api/cerrar', {}); } catch (e) { /* ya se cerró */ }
  $('#main').innerHTML = '<div class="centro"><h1>Instalación cancelada</h1><p class="s">Ya puedes cerrar esta ventana.</p></div>';
  try { window.close(); } catch (e) { /* nada */ }
}

/* ---------------------------------------------------------------- 1 · Bienvenida */
function bienvenida() {
  const e = S.estado;
  let cuerpo;
  if (!e) {
    cuerpo = '<div class="cargando"><div class="rueda"></div>Revisando esta computadora…</div>';
  } else {
    const c = unidadDe(e.programa);
    const filas = [];
    filas.push('<div class="fila"><span class="ic">💻</span><span class="t">Equipo</span><b>' + esc(e.equipo || '—') + '</b></div>');
    if (e.negocio && e.negocio !== 'Compoint Punto') filas.push('<div class="fila"><span class="ic">🏪</span><span class="t">Negocio</span><b>' + esc(e.negocio) + '</b></div>');
    filas.push('<div class="fila"><span class="ic">📦</span><span class="t">Versión</span><b>Compoint Punto ' + esc(e.version) + '</b></div>');
    if (c) {
      const ok = c.libre >= e.tamanoNecesario;
      filas.push('<div class="fila"><span class="ic">💽</span><span class="t">Espacio</span><b>Necesita unos ' + aprox(instaladoAprox()) + ' · libres en ' + esc(c.letra) + ' ' + tam(c.libre) + '</b><span class="etq ' + (ok ? 'ok' : 'no') + '">' + (ok ? 'Suficiente' : 'Falta espacio') + '</span></div>');
    }
    cuerpo = '<div class="info">' + filas.join('') + '</div><div class="avisos">';
    if (e.sinPaquete) cuerpo += '<div class="aviso rojo"><b>Este instalador está incompleto</b> (no trae el programa). Descárgalo otra vez o pide uno nuevo a Compoint.</div>';
    if (e.appAbierta) cuerpo += '<div class="aviso">Compoint Punto está <b>abierto</b>. Ciérralo antes de instalar: junto al reloj, clic derecho en su icono → <b>Salir por completo</b>.</div>';
    if (e.yaInstalado) cuerpo += '<div class="aviso azul">Ya tienes Compoint Punto en <b>' + esc(e.yaInstalado) + '</b>. Se va a <b>actualizar</b> ahí; tu información no se borra.</div>';
    if (e.datosExistentes) cuerpo += '<div class="aviso azul">Encontré la información de un negocio en <b>' + esc(e.datosExistentes) + '</b>. Se conserva y se vuelve a usar.</div>';
    if (e.simulado) cuerpo += '<div class="aviso">Modo de prueba: no se instala nada de verdad.</div>';
    cuerpo += '</div>';
  }
  $('#main').innerHTML =
    '<h1>Bienvenido</h1>' +
    '<p class="s">Este asistente instala <b>Compoint Punto</b> en esta computadora. Tarda un par de minutos.</p>' +
    cuerpo +
    '<div class="pie"><small>Compoint · Punto de soluciones</small><div class="der"><button class="sec" id="cancelar">Cancelar</button><button class="pri" id="sig" ' + (e && !e.sinPaquete ? '' : 'disabled') + '>Siguiente</button></div></div>';
  $('#cancelar').onclick = salir;
  $('#sig').onclick = () => ir('tipo');
}

/* ---------------------------------------------------------------- 2 · Tipo de instalación */
function tipo() {
  const e = S.estado || {}, pred = S.modo === 'pred';
  const c = unidadDe(S.op.programa);
  const ok = !c || c.libre >= (e.tamanoNecesario || 0);
  $('#main').innerHTML =
    '<h1>¿Cómo quieres instalar?</h1>' +
    '<p class="s">Compoint Punto se instala en esta computadora en un par de minutos. Con el modo Predeterminado no necesitas permisos de administrador.</p>' +
    '<div class="opc">' +
      '<button class="op ' + (pred ? 'sel' : '') + '" id="mPred"><span class="rd"></span><span class="ic">⚡</span><div><h3>Predeterminado <em>Recomendado</em></h3><p>Todo con un clic: instala el programa, crea el acceso directo en el escritorio y deja todo listo para abrir.</p></div></button>' +
      '<button class="op ' + (!pred ? 'sel' : '') + '" id="mAv"><span class="rd"></span><span class="ic">🎛️</span><div><h3>Avanzado</h3><p>Tú eliges la carpeta de instalación, si esta computadora será caja o servidor, y dónde guardar la información y los respaldos.</p></div></button>' +
    '</div>' +
    (pred
      ? '<div class="info"><div class="fila"><span class="ic">📦</span><span class="t">Se instalará en</span><b>' + esc(S.op.programa) + '</b></div>' +
        (c ? '<div class="fila"><span class="ic">💽</span><span class="t">Espacio</span><b>Libres en ' + esc(c.letra) + ' ' + tam(c.libre) + '</b><span class="etq ' + (ok ? 'ok' : 'no') + '">' + (ok ? 'Suficiente' : 'Falta espacio') + '</span></div>' : '') + '</div>'
      : '') +
    (S.errorForm ? '<div class="aviso rojo" id="errForm">' + esc(S.errorForm) + '</div>' : '') +
    '<div class="pie"><small>' + (pred ? '¿Quieres cambiar la carpeta? Elige Avanzado.' : 'Verás las carpetas en el siguiente paso.') + '</small><div class="der"><button class="sec" id="atras">Atrás</button><button class="pri" id="sig">' + (pred ? 'Instalar ahora' : 'Siguiente') + '</button></div></div>';
  $('#mPred').onclick = () => { S.modo = 'pred'; S.errorForm = ''; tipo(); };
  $('#mAv').onclick = () => { S.modo = 'av'; S.errorForm = ''; tipo(); };
  $('#atras').onclick = () => ir('bienvenida');
  $('#sig').onclick = async () => {
    if (S.modo === 'av') { ir('uso'); return; }
    $('#sig').disabled = true; $('#sig').textContent = 'Revisando…';
    await validarAhora();
    if (S.val && S.val.errores.length) { S.errorForm = S.val.errores[0] + '  Elige «Avanzado» para cambiarlo.'; tipo(); return; }
    empezar();
  };
}

/* ---------------------------------------------------------------- 2b · Avanzado: uso y accesos */
function uso() {
  const o = S.op, srv = S.uso === 'servidor';
  const chk = (k, t, extra) => '<label class="chk"><input type="checkbox" data-chk="' + k + '" ' + (o[k] ? 'checked' : '') + '>' + t + (extra ? ' <small>' + extra + '</small>' : '') + '</label>';
  $('#main').innerHTML =
    '<h1>Personaliza la instalación</h1>' +
    '<p class="s">¿Para qué se usará esta computadora?</p>' +
    '<div class="opc">' +
      '<button class="op mini ' + (!srv ? 'sel' : '') + '" data-uso="caja"><span class="rd"></span><span class="ic">🖥️</span><div><h3>Caja o equipo normal</h3><p>Se conecta al sistema del negocio (en internet o en la red del local).</p></div></button>' +
      '<button class="op mini ' + (srv ? 'sel' : '') + '" data-uso="servidor"><span class="rd"></span><span class="ic">🗄️</span><div><h3>Servidor del negocio</h3><p>Guarda toda la información, sigue vendiendo sin internet y hace respaldos. Las demás cajas se conectan a esta.</p></div></button>' +
    '</div>' +
    '<div class="tar"><div class="h">Accesos y arranque</div>' +
      chk('escritorio', 'Acceso directo en el escritorio') + chk('inicio', 'Acceso en el menú Inicio') +
      chk('abrirConWindows', 'Abrir Compoint Punto al prender Windows') + chk('intermediario', 'Intermediario de impresión por red', '(puerto 3500)') + '</div>' +
    '<div class="pie"><small>Paso 1 de 2 del modo Avanzado</small><div class="der"><button class="sec" id="atras">Atrás</button><button class="pri" id="sig">Siguiente</button></div></div>';
  document.querySelectorAll('[data-uso]').forEach((b) => { b.onclick = () => { S.uso = b.dataset.uso; S.val = null; uso(); }; });
  document.querySelectorAll('[data-chk]').forEach((c) => { c.onchange = () => { o[c.dataset.chk] = c.checked; }; });
  $('#atras').onclick = () => ir('tipo');
  $('#sig').onclick = () => { S.val = null; ir('carpetas'); };
}

/* ---------------------------------------------------------------- 3 · Carpetas */
function chipsUnidades() {
  const us = (S.estado && S.estado.unidades) || [];
  return '<div class="chips"><span class="t">Unidades detectadas:</span>' + us.map((u) =>
    '<span class="' + (u.tipo === 'usb' ? 'usb' : '') + '"><b>' + esc(u.letra) + '</b> ' + esc(u.etiqueta || nombreTipo(u)) + (u.tipo !== 'fijo' ? ' · ' + nombreTipo(u) : '') + ' · ' + tam(u.libre) + ' libres</span>').join('') + '</div>';
}

function campoRuta(clave, valor, opciones = {}) {
  const err = S.val && S.val.campos ? S.val.campos[clave] : '';
  return '<div class="ruta"><input data-ruta="' + clave + '" value="' + esc(valor) + '" spellcheck="false" ' + (opciones.bloqueado ? 'disabled' : '') + '><button class="sec" data-examinar="' + clave + '" ' + (opciones.bloqueado ? 'disabled' : '') + '>Examinar…</button></div>' +
    '<div class="campo-err" data-err="' + clave + '">' + (err ? esc(err) : '') + '</div>';
}

function carpetas() {
  const o = S.op, e = S.estado || {}, srv = S.uso === 'servidor';
  const v = S.val || { errores: [], avisos: [], campos: {}, necesitaAdmin: false };
  const bloqueado = !!e.datosExistentes;
  let html = '<h1>' + (srv ? '¿Dónde quieres guardar todo?' : '¿Dónde quieres instalar el programa?') + '</h1>' +
    '<p class="s" style="margin-top:-4px">' + (srv ? 'Puedes dejar las carpetas como vienen: ya son las recomendadas.' : 'Puedes dejar la carpeta como viene: es la recomendada.') + '</p>' +
    chipsUnidades() +
    '<div class="tar"><div class="h"><span>📦 Programa</span><span class="etq ' + (v.necesitaAdmin ? 'no' : 'ok') + '" id="etqAdmin">' + (v.necesitaAdmin ? 'Pedirá permiso de administrador' : 'Sin administrador') + '</span></div>' +
    campoRuta('programa', o.programa) +
    '<div class="nota">Necesita unos ' + aprox(instaladoAprox()) + '. Si eliges <code>Archivos de programa</code>, Windows pedirá permiso de administrador.</div></div>';
  if (srv) {
    html += '<div class="tar"><div class="h"><span>🗃️ Información del negocio</span><span class="etq az">Solo servidor</span></div>' +
      campoRuta('datos', o.datos, { bloqueado }) +
      '<div class="nota">' + (bloqueado ? 'Ya hay información de este negocio en esta computadora: se queda en esa carpeta para no perderla.' : 'Aquí vive la base de datos. Mejor en un disco interno: en una USB, si se desconecta, el sistema se detiene.') + '</div></div>' +
      '<div class="tar"><div class="h"><span>💾 Respaldos</span><span class="etq az">Solo servidor</span></div>' +
      campoRuta('respaldos', o.respaldos) +
      '<div class="fila-sw"><button type="button" class="sw ' + (o.copiaExtraOn ? 'on' : '') + '" id="swExtra" aria-label="Copia extra en otra unidad"></button><span><b>Copia extra en otra unidad</b> <span class="g">(recomendado: USB o disco distinto)</span></span></div>' +
      (o.copiaExtraOn ? campoRuta('copiaExtra', o.copiaExtra) : '') +
      (o.copiaExtraOn && !o.copiaExtra && !e.copiaExtra ? '<div class="nota">No encontré otra unidad conectada. Conecta una USB y pulsa «Examinar…», o escribe la carpeta.</div>' : '') + '</div>';
  }
  html += '<div class="avisos" id="avisos"></div>' +
    (S.errorForm ? '<div class="aviso rojo" id="errForm">' + esc(S.errorForm) + '</div>' : '') +
    '<div class="pie"><small>' + (S.modo === 'av' ? 'Paso 2 de 2 del modo Avanzado' : '') + '</small><div class="der"><button class="sec" id="atras">Atrás</button><button class="pri" id="sig">Instalar</button></div></div>';
  $('#main').innerHTML = html;

  document.querySelectorAll('input[data-ruta]').forEach((i) => {
    i.oninput = () => { o[i.dataset.ruta] = i.value; S.errorForm = ''; validarLuego(350, pintarValidacion); };
    // Al terminar de escribir se muestra la ruta ya corregida (barras, mayúsculas y la subcarpeta «Compoint Punto»).
    i.onchange = async () => {
      clearTimeout(temporizadorVal);
      await validarAhora();
      const n = S.val && S.val.opciones ? S.val.opciones[i.dataset.ruta === 'copiaExtra' ? 'copiaExtra' : i.dataset.ruta] : '';
      if (n && n !== o[i.dataset.ruta]) { o[i.dataset.ruta] = n; i.value = n; }
      pintarValidacion();
    };
  });
  document.querySelectorAll('[data-examinar]').forEach((b) => { b.onclick = () => examinar(b.dataset.examinar); });
  const sw = $('#swExtra');
  if (sw) sw.onclick = () => {
    o.copiaExtraOn = !o.copiaExtraOn;
    if (o.copiaExtraOn && !o.copiaExtra) o.copiaExtra = e.copiaExtra || '';
    S.val = null; carpetas(); validarAhora().then(pintarValidacion);
  };
  $('#atras').onclick = () => ir('uso');
  $('#sig').onclick = async () => {
    $('#sig').disabled = true; $('#sig').textContent = 'Revisando…';
    clearTimeout(temporizadorVal);
    await validarAhora();
    pintarValidacion();
    $('#sig').textContent = 'Instalar';
    if (S.val && S.val.errores.length) { $('#sig').disabled = true; return; }
    if (S.val && S.val.opciones && S.val.opciones.programa) o.programa = S.val.opciones.programa;
    empezar();
  };
  pintarValidacion();
  if (!S.val) validarAhora().then(pintarValidacion);
}

// Pone los errores bajo cada carpeta y los avisos abajo, sin volver a dibujar toda la pantalla (así no se pierde el cursor).
function pintarValidacion() {
  if (S.pant !== 'carpetas') return;
  const v = S.val;
  if (!v) return;
  document.querySelectorAll('[data-err]').forEach((el) => { el.textContent = (v.campos && v.campos[el.dataset.err]) || ''; });
  const et = $('#etqAdmin');
  if (et) { et.className = 'etq ' + (v.necesitaAdmin ? 'no' : 'ok'); et.textContent = v.necesitaAdmin ? 'Pedirá permiso de administrador' : 'Sin administrador'; }
  const av = $('#avisos');
  if (av) av.innerHTML = (v.avisos || []).map((a) => '<div class="aviso">' + esc(a) + '</div>').join('');
  const sig = $('#sig');
  if (sig && sig.textContent !== 'Revisando…') sig.disabled = v.errores.length > 0;
}

/* ---------------------------------------------------------------- Selector de carpetas */
function destinoElegido(clave, l) {
  const info = l.info || {};
  const raiz = esRaiz(l.ruta);
  // El programa siempre queda en una carpeta que se llame «Compoint Punto…» (así lo hace también el instalador de Windows).
  if (clave === 'programa') return (/compoint punto/i.test(l.ruta) || info.tienePrograma) ? l.ruta : unir(l.ruta, SUB.programa);
  if (clave === 'datos' && (raiz || (info.existe && !info.vacia && !info.tieneBD))) return unir(l.ruta, SUB.datos);
  if ((clave === 'respaldos' || clave === 'copiaExtra') && raiz) return unir(l.ruta, SUB.respaldos);
  return l.ruta;
}

const TITULOS = { programa: 'Carpeta del programa', datos: 'Carpeta de la información del negocio', respaldos: 'Carpeta de los respaldos', copiaExtra: 'Carpeta de la copia extra' };

function examinar(clave) {
  const inicio = S.op[clave] || '';
  const M = { l: null, error: '', nueva: false };
  const capa = $('#capa');

  const cerrar = () => { capa.innerHTML = ''; document.removeEventListener('keydown', teclas); };
  const teclas = (ev) => { if (ev.key === 'Escape') cerrar(); };
  document.addEventListener('keydown', teclas);

  async function cargar(ruta) {
    M.error = '';
    try { M.l = await api('/api/carpetas?ruta=' + encodeURIComponent(ruta || '')); }
    catch (e) {
      M.error = e.message;
      if (!M.l) { try { M.l = await api('/api/carpetas?ruta='); } catch (e2) { /* sigue el error */ } }
    }
    M.nueva = false; pintar();
  }

  function estadoCarpeta(l) {
    if (!l.ruta) return 'Elige una unidad.';
    const i = l.info || {};
    const partes = [];
    if (i.tieneBD) partes.push('Aquí ya hay información de un negocio de Compoint.');
    else if (i.tienePrograma) partes.push('Aquí ya está instalado Compoint Punto.');
    else if (i.vacia) partes.push('Carpeta vacía.');
    else partes.push('Esta carpeta ya tiene archivos.');
    if (i.escribible === false) partes.push('No tienes permiso para guardar aquí.');
    if (l.cortado) partes.push('Se muestran solo las primeras 500 carpetas.');
    return partes.join(' ');
  }

  function pintar() {
    const l = M.l;
    const us = (l && l.unidades) || [];
    let cuerpo;
    if (!l) cuerpo = '<div class="cargando"><div class="rueda"></div>Abriendo…</div>';
    else {
      let lista;
      if (!l.ruta) {
        lista = us.length ? us.map((u) => '<button data-ir="' + esc(u.letra + '\\') + '"><span>' + (u.tipo === 'usb' ? '🔌' : (u.tipo === 'red' ? '🌐' : '💽')) + '</span><span class="n"><b>' + esc(u.letra) + '</b> ' + esc(u.etiqueta || nombreTipo(u)) + ' · ' + nombreTipo(u) + '</span><small>' + tam(u.libre) + ' libres</small></button>').join('') : '<div class="vacio">No encontré unidades.</div>';
      } else {
        lista = l.carpetas.length ? l.carpetas.map((c) => '<button data-ir="' + esc(c.ruta) + '"><span>📁</span><span class="n">' + esc(c.nombre) + '</span></button>').join('') : '<div class="vacio">Esta carpeta no tiene otras carpetas adentro.</div>';
      }
      cuerpo =
        '<div class="chips">' + us.map((u) => '<button class="sec" style="padding:5px 11px;font-size:12.5px" data-ir="' + esc(u.letra + '\\') + '">' + (u.tipo === 'usb' ? '🔌 ' : '💽 ') + esc(u.letra) + ' ' + esc(u.etiqueta || nombreTipo(u)) + '</button>').join('') + '</div>' +
        '<div class="barra-ruta"><button class="sec" id="subir" ' + (l.ruta ? '' : 'disabled') + ' title="Subir un nivel">↑ Subir</button><input id="rutaTxt" value="' + esc(l.ruta) + '" spellcheck="false" placeholder="Escribe una ruta, por ejemplo D:\\Negocio"><button class="sec" id="irRuta">Ir</button></div>' +
        '<div class="carpetas" id="lista">' + lista + '</div>' +
        '<div class="estado-c">' + esc(estadoCarpeta(l)) + '</div>' +
        (l.ruta ? '<div class="sera">Se usará: <b>' + esc(destinoElegido(clave, l)) + '</b></div>' : '') +
        (M.nueva ? '<div class="nueva"><input id="nombreNueva" placeholder="Nombre de la carpeta nueva" maxlength="80"><button class="pri" id="crearNueva" style="padding:8px 14px">Crear</button></div>' : '');
    }
    capa.innerHTML =
      '<div class="vel" id="vel"><div class="modal" role="dialog" aria-label="Elegir carpeta">' +
      '<div class="cab"><h2>' + esc(TITULOS[clave] || 'Elegir carpeta') + '</h2></div>' +
      '<div class="cuerpo">' + cuerpo + '<div class="err-m" id="errM">' + esc(M.error) + '</div></div>' +
      '<div class="pie-m"><button class="sec" id="nuevaBtn" ' + (l && l.ruta ? '' : 'disabled') + '>📁 Nueva carpeta</button><div class="der"><button class="sec" id="cancelarM">Cancelar</button><button class="pri" id="elegirM" ' + (l && l.ruta ? '' : 'disabled') + '>Elegir esta carpeta</button></div></div>' +
      '</div></div>';
    if (!l) return;
    capa.querySelectorAll('[data-ir]').forEach((b) => { b.onclick = () => cargar(b.dataset.ir); });
    $('#cancelarM').onclick = cerrar;
    $('#vel').onmousedown = (ev) => { if (ev.target.id === 'vel') cerrar(); };
    const sub = $('#subir'); if (sub) sub.onclick = () => cargar(l.padre || '');
    const irRuta = () => cargar($('#rutaTxt').value.trim());
    $('#irRuta').onclick = irRuta;
    $('#rutaTxt').onkeydown = (ev) => { if (ev.key === 'Enter') irRuta(); };
    $('#nuevaBtn').onclick = () => { M.nueva = !M.nueva; pintar(); const n = $('#nombreNueva'); if (n) n.focus(); };
    const cn = $('#crearNueva');
    if (cn) {
      const crear = async () => {
        const nombre = $('#nombreNueva').value.trim();
        if (!nombre) return;
        try { M.l = await api('/api/carpetas/nueva', { ruta: l.ruta, nombre }); M.error = ''; M.nueva = false; }
        catch (e) { M.error = e.message; }
        pintar();
      };
      cn.onclick = crear;
      $('#nombreNueva').onkeydown = (ev) => { if (ev.key === 'Enter') crear(); };
    }
    $('#elegirM').onclick = () => {
      S.op[clave] = destinoElegido(clave, l);
      cerrar();
      S.val = null; S.errorForm = '';
      carpetas();
      validarAhora().then(pintarValidacion);
    };
  }

  pintar();
  cargar(inicio);
}

/* ---------------------------------------------------------------- 4 · Instalando */
async function empezar() {
  if (S.enviando) return;
  S.enviando = true; S.errorForm = '';
  const op = opcionesActuales();
  try {
    await api('/api/instalar', op);
    S.ultimaOp = op; S.trabajo = null; S.desde = S.modo === 'pred' ? 'tipo' : 'carpetas';
    ir('instalando');
    sondear();
  } catch (e) {
    S.errorForm = e.message;
    dibujar();
  } finally { S.enviando = false; }
}

let temporizador = null;
async function sondear() {
  clearTimeout(temporizador);
  try {
    const t = await api('/api/progreso');
    S.trabajo = t;
    if (S.pant === 'instalando') instalando();
    if (t.fase === 'terminado') { ir('listo'); return; }
    if (t.fase === 'error') { ir('error'); return; }
  } catch (e) { /* intenta otra vez */ }
  temporizador = setTimeout(sondear, 400);
}

function icono(p, i) {
  if (p.estado === 'ok') return '✓';
  if (p.estado === 'haciendo') return '<div class="rueda" style="width:22px;height:22px;border-width:3px"></div>';
  if (p.estado === 'aviso') return '!';
  if (p.estado === 'error') return '✕';
  return String(i + 1);
}

function listaPasos(pasos, pct) {
  return pasos.map((p, i) => {
    let det = p.detalle || '';
    if (p.estado === 'haciendo' && p.clave === 'copiar' && pct > 0) det = (det ? det + ' · ' : '') + pct + ' %';
    return '<div class="paso ' + esc(p.estado) + '"><span class="p">' + icono(p, i) + '</span><div>' + esc(p.titulo) + (det ? '<small>' + esc(det) + '</small>' : '') + '</div></div>';
  }).join('');
}

function instalando() {
  const t = S.trabajo || { fase: 'trabajando', pasos: [], pct: 0 };
  const pct = Math.max(t.pct || 0, 3);
  $('#main').innerHTML =
    '<h1>Instalando Compoint Punto…</h1>' +
    '<p class="s">Esto tarda uno o dos minutos. No apagues la computadora.</p>' +
    '<div class="barra"><i style="width:' + pct + '%"></i></div>' +
    (t.fase === 'esperando-permiso' ? '<div class="aviso">🔐 Windows está pidiendo <b>permiso de administrador</b>. Elige <b>Sí</b> en la ventana que apareció. Si no la ves, búscala en la barra de tareas.</div>' : '') +
    '<div class="lista">' + listaPasos(t.pasos || [], t.pct || 0) + '</div>' +
    '<div class="pie"><small>Si algo falla, el instalador te dice qué hacer.</small><div class="der"><button class="sec" disabled>Cancelar</button></div></div>';
}

/* ---------------------------------------------------------------- Error */
function pantError() {
  const t = S.trabajo || { pasos: [], error: '' };
  $('#main').innerHTML =
    '<div class="cab-listo"><div class="c mal">!</div><div><h1>No se pudo terminar</h1><p class="s">Puedes intentarlo otra vez. Tu información del negocio no se tocó.</p></div></div>' +
    '<div class="aviso rojo">' + esc(t.error || 'Ocurrió un problema.') + '</div>' +
    '<div class="lista">' + listaPasos(t.pasos || [], 0) + '</div>' +
    '<div class="aviso azul">¿Sigue igual? Mándale una foto de esta pantalla a Compoint por WhatsApp: <b style="white-space:nowrap">33 25 90 70 90</b>.<br><small>Registro para soporte: <code>%TEMP%\\CompointInstalador\\instalador-log.txt</code></small></div>' +
    (S.errorForm ? '<div class="aviso rojo">' + esc(S.errorForm) + '</div>' : '') +
    '<div class="pie"><button class="sec" id="atras">Volver</button><button class="pri" id="reint">Reintentar</button></div>';
  $('#atras').onclick = () => ir(S.desde || 'tipo');
  $('#reint').onclick = async () => {
    if (S.enviando) return;
    S.enviando = true; S.errorForm = '';
    try { await api('/api/instalar', S.ultimaOp); S.trabajo = null; ir('instalando'); sondear(); }
    catch (e) { S.errorForm = e.message; pantError(); }
    finally { S.enviando = false; }
  };
}

/* ---------------------------------------------------------------- 5 · Listo */
function listo() {
  const t = S.trabajo || {}, r = t.resumen || {}, e = S.estado || {};
  const srv = r.uso === 'servidor';
  let sig;
  if (srv) sig = '<b>Siguiente paso:</b> al abrir, el programa te pedirá los datos del negocio (nombre, dueño y contraseña) para crear el servidor.';
  else if (e.conUrl) sig = '<b>Siguiente paso:</b> al abrir, Compoint Punto entra directo al sistema' + (e.negocio && e.negocio !== 'Compoint Punto' ? ' de <b>' + esc(e.negocio) + '</b>' : '') + '.';
  else sig = '<b>Siguiente paso:</b> al abrir por primera vez, el programa te pedirá la dirección del sistema del negocio (te la da Compoint).';
  const items = [];
  if (srv) {
    items.push('<div class="item"><span class="ic">🗃️</span><div class="grow">Información del negocio<small>' + esc(r.datos) + '</small></div><button class="sec" data-abrir="datos">Abrir</button></div>');
    items.push('<div class="item"><span class="ic">💾</span><div class="grow">Respaldos<small>' + esc(r.respaldos) + (r.copiaExtra ? ' · copia extra en ' + esc(r.copiaExtra) : '') + '</small></div><button class="sec" data-abrir="respaldos">Abrir</button></div>');
  }
  $('#main').innerHTML =
    '<div class="cab-listo"><div class="c">✓</div><div><h1>¡Compoint Punto está instalado!</h1><p class="s">Ya puedes abrirlo' + (S.op.escritorio || S.modo === 'pred' ? ' desde el escritorio' : '') + '.</p></div></div>' +
    '<div class="dir"><div class="t"><small>Programa instalado en</small><b>' + esc(r.programa) + '</b></div><button class="sec" data-abrir="programa">Abrir carpeta</button></div>' +
    (items.length ? '<div class="lista">' + items.join('') + '</div>' : '') +
    ((r.avisos || []).map((a) => '<div class="aviso">' + esc(a) + '</div>').join('')) +
    '<div class="aviso azul">' + sig + '</div>' +
    (S.errorForm ? '<div class="aviso rojo">' + esc(S.errorForm) + '</div>' : '') +
    '<div class="pie"><small>Para desinstalar: Configuración de Windows → Aplicaciones</small><div class="der"><button class="sec" id="cerrar">Cerrar</button><button class="pri" id="abrir">Abrir Compoint Punto</button></div></div>';
  document.querySelectorAll('[data-abrir]').forEach((b) => { b.onclick = () => api('/api/abrir', { que: b.dataset.abrir }).catch((er) => { S.errorForm = er.message; listo(); }); });
  $('#cerrar').onclick = finalizar;
  $('#abrir').onclick = async () => {
    if (S.abriendo) return;
    S.abriendo = true; $('#abrir').disabled = true; $('#abrir').textContent = 'Abriendo…';
    try { await api('/api/abrir', { que: 'app' }); setTimeout(finalizar, 1200); }
    catch (er) { S.abriendo = false; S.errorForm = er.message; listo(); }
  };
}

async function finalizar() {
  try { await api('/api/cerrar', {}); } catch (e) { /* ya se cerró */ }
  $('#main').innerHTML = '<div class="centro"><div class="c">✓</div><h1>Listo</h1><p class="s">Ya puedes cerrar esta ventana.</p></div>';
  try { window.close(); } catch (e) { /* nada */ }
}

/* ---------------------------------------------------------------- Inicio */
document.addEventListener('keyup', (ev) => {
  if (ev.key !== 'Enter' || $('#capa').innerHTML) return;
  const t = ev.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'BUTTON')) return;
  const sig = $('#sig'); if (sig && !sig.disabled) sig.click();
});
setInterval(() => { api('/api/latido', {}).catch(() => {}); }, 3000);
api('/api/latido', {}).catch(() => {});
dibujar();
api('/api/estado').then((e) => {
  S.estado = e;
  S.op.programa = e.programa; S.op.datos = e.datos; S.op.respaldos = e.respaldos;
  S.op.copiaExtra = e.copiaExtra || ''; S.op.copiaExtraOn = !!e.copiaExtra;
  if (e.datosExistentes) S.uso = 'servidor';
  $('#ver').innerHTML = 'Instalador de escritorio<br>Versión ' + esc(e.version) + (e.simulado ? '<br>PRUEBA · no instala nada' : '');
  if (S.pant === 'bienvenida') bienvenida();
}).catch((e) => { S.estado = { equipo: '', unidades: [], aviso: e.message, sinPaquete: true, version: '' }; if (S.pant === 'bienvenida') bienvenida(); });
</script>
</body>
</html>
