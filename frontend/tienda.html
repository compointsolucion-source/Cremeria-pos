<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D6A3A">
<title>Haz tu pedido</title>
<link rel="icon" href="favicon.ico">
<style>
@font-face{font-family:"Ar";src:url(fuentes/archivo-wdth.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{--tinta:#1B1D1C;--gris:#5E6461;--gris2:#7F8582;--raya:#E4E6E3;--fondo:#F3F4F2;--tienda:#1D6A3A;--tienda-claro:#E3EFE6;--cartulina:#FFE81A;--wa:#1F8F4E;--rojo:#B3261E}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{margin:0;background:#fff;font:16px/1.4 Ar,system-ui,-apple-system,"Segoe UI",sans-serif;font-stretch:100%;color:var(--tinta);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
.envoltura{max-width:620px;margin:0 auto}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num,.precio{font-variant-numeric:tabular-nums}
.letrero{background:var(--tienda);color:#fff;padding:18px 20px 46px;padding-top:max(18px,env(safe-area-inset-top))}
.letrero .envoltura{display:flex;gap:12px;align-items:flex-start}
.letrero .logo{width:48px;height:48px;border-radius:10px;background:#fff;object-fit:cover;flex:none}
.letrero .txt{flex:1;min-width:0}
.letrero h1{margin:0;font-size:34px;line-height:1;font-weight:820;font-stretch:72%;letter-spacing:.2px;text-wrap:balance}
.letrero .giro{font-size:14.5px;opacity:.88;margin-top:5px}
.letrero .estado{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600}
.punto{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7CE29B;box-shadow:0 0 0 3px rgba(124,226,155,.25);flex:none}
.cerrado .punto{background:#FFB4AB;box-shadow:0 0 0 3px rgba(255,180,171,.25)}
.wa-redondo{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;flex:none;text-decoration:none}
.buscar{margin:-28px 16px 0;position:relative;height:54px;border-radius:14px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--gris2);box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.10)}
.buscar input{flex:1;border:0;outline:0;background:none;font-size:16px;height:100%;min-width:0;color:var(--tinta)}
.buscar input::placeholder{color:var(--gris2)}
.siempre{margin:14px 16px 0;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--fondo)}
.siempre .n{flex:1;min-width:0;font-size:14px;color:var(--gris);line-height:1.35}
.siempre .n b{display:block;color:var(--tinta);font-size:15.5px;font-weight:700}
.siempre .n em{display:block;font-style:normal;color:var(--rojo);font-size:13px;margin-top:3px}
.siempre button{background:var(--tinta);color:#fff;border-radius:10px;padding:0 12px;min-height:44px;font-weight:700;font-size:14.5px;white-space:nowrap}
.tit-s{display:flex;justify-content:space-between;align-items:baseline;margin:22px 20px 10px}
.tit-s h2{margin:0;font-size:20px;font-weight:760}
.tit-s span{font-size:13.5px;color:var(--gris)}
.tags{display:flex;gap:10px;padding:0 16px 2px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.tags::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.tag{flex:none;width:168px;scroll-snap-align:start;background:var(--cartulina);border-radius:6px;padding:12px 12px 12px 26px;position:relative;text-align:left;transition:transform .15s ease-out}
.tag:active{transform:scale(.97)}
.tag:before{content:"";position:absolute;left:9px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18)}
.tag .p{display:block;font-size:13px;line-height:1.25;font-weight:600;height:33px;overflow:hidden}
.tag .pr{display:block;font-size:38px;line-height:1;font-weight:850;font-stretch:62%;margin-top:6px;letter-spacing:-.5px}
.tag .pr small{font-size:15px;font-weight:700;font-stretch:80%;margin-left:2px;letter-spacing:0}
.tag .an{display:block;font-size:12.5px;margin-top:2px}
.tag .an s{opacity:.7}
.tag .ya{display:block;font-size:12.5px;margin-top:2px;font-weight:700}
.tabs{display:flex;gap:22px;padding:0 20px;margin-top:20px;border-bottom:1px solid var(--raya);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;background:#fff;z-index:3}
.tabs button{padding:12px 0 11px;white-space:nowrap;font-size:15.5px;font-weight:650;color:var(--gris);min-height:44px}
.tabs button[aria-pressed=true]{color:var(--tinta);box-shadow:inset 0 -3px 0 var(--tinta)}
.lista{padding-bottom:110px}
.prod{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--raya)}
.ficha{width:64px;height:64px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;overflow:hidden;position:relative;text-align:center;padding:0 4px}
.ficha b{font-size:21px;font-weight:820;font-stretch:66%;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ficha small{font-size:11px;margin-top:3px;font-weight:650;color:rgba(0,0,0,.55);font-stretch:85%;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ficha img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff;outline:1px solid rgba(0,0,0,.08);outline-offset:-1px;border-radius:10px}
.prod .n{min-width:0}
.prod .n b{display:block;font-size:15.5px;font-weight:620;line-height:1.25;text-wrap:pretty}
.prod .n span{display:block;font-size:13px;color:var(--gris);margin-top:3px}
.prod .n span.ofe{color:var(--tinta);font-weight:650}
.der{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.precio{font-size:22px;font-weight:820;font-stretch:66%;line-height:1;white-space:nowrap}
.precio small{font-size:13px;font-weight:600;font-stretch:90%;color:var(--gris)}
.precio s{font-size:13px;font-weight:600;font-stretch:90%;color:var(--gris);margin-right:4px}
.mas{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--tinta);display:grid;place-items:center;transition:transform .12s ease-out,background-color .12s ease-out}
.mas:active{transform:scale(.94);background:var(--fondo)}
.paso{display:flex;align-items:center;height:42px;border-radius:21px;background:var(--tinta);color:#fff}
.paso button{width:40px;height:42px;font-size:21px;font-weight:600;color:#fff}
.paso output{min-width:28px;text-align:center;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
.paso.chico{height:34px}
.paso.chico button{width:34px;height:34px;font-size:18px}
.paso.chico output{font-size:14px}
.vacio{text-align:center;color:var(--gris);padding:36px 24px}
.carrito{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--raya);padding:12px 16px max(16px,env(safe-area-inset-bottom));z-index:6}
.carrito .envoltura{display:flex;align-items:center;gap:14px}
.carrito .n{flex:1;font-size:13.5px;color:var(--gris)}
.carrito .n b{display:block;font-size:24px;color:var(--tinta);font-weight:820;font-stretch:66%;font-variant-numeric:tabular-nums;line-height:1.1}
.carrito .ver{background:var(--tienda);color:#fff;border-radius:14px;min-height:52px;padding:0 22px;display:flex;align-items:center;font-weight:700;font-size:16.5px}
.cabeza{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--raya);background:#fff;position:sticky;top:0;z-index:4}
.cabeza button.atras{width:44px;height:44px;display:grid;place-items:center}
.cabeza h1{font-size:21px;margin:0;font-weight:750;flex:1}
.cabeza .agregar{color:var(--tienda);font-weight:700;font-size:15px;min-height:44px;padding:0 8px}
.nota{padding:6px 20px 0}
.renglon{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--raya)}
.renglon .nom{font-size:15.5px;font-weight:600;line-height:1.3}
.renglon .nom span{display:block;color:var(--gris);font-size:13.5px;font-weight:400}
.renglon .imp{font-weight:750;font-variant-numeric:tabular-nums;text-align:right}
.renglon .acc{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.quitar{color:var(--rojo);font-weight:600;font-size:14px;min-height:40px}
.leader{display:flex;align-items:baseline;gap:6px;font-size:15px;color:var(--gris);padding:4px 0}
.leader i{flex:1;border-bottom:1.5px dotted #C3C8C5;transform:translateY(-4px);min-width:12px}
.leader b{color:var(--tinta);font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.leader.prim{padding-top:12px}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--tinta);margin-top:8px;padding-top:10px}
.total span{font-weight:700;font-size:16px}
.total b{font-size:30px;font-weight:850;font-stretch:64%;font-variant-numeric:tabular-nums}
.chiquito{font-size:13.5px;color:var(--gris);margin-top:6px;text-wrap:pretty}
.gratis{margin-top:12px;font-size:14px;color:var(--tinta)}
.barrita{height:6px;border-radius:3px;background:var(--fondo);margin-top:6px;overflow:hidden}
.barrita i{display:block;height:100%;background:var(--tienda);transition:width .25s ease-out}
.bloque{padding:16px 20px 6px;border-top:8px solid var(--fondo);margin-top:16px}
.bloque + .bloque{margin-top:0}
.bloque h2{font-size:16.5px;margin:0 0 10px;font-weight:720}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fondo);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:46px;border-radius:9px;font-size:14px;font-weight:650;color:var(--gris);line-height:1.15;padding:0 6px;transition:background-color .15s ease-out,color .15s ease-out}
.seg button[aria-checked=true]{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.direc{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.35}
.direc .ic{width:40px;height:40px;border-radius:10px;background:var(--tienda-claro);color:var(--tienda);display:grid;place-items:center;flex:none}
.direc .t{flex:1;min-width:0}
.direc b{display:block;font-weight:680}
.direc span{color:var(--gris);font-size:14px}
.direc button{color:var(--tienda);font-weight:700;font-size:14.5px;min-height:40px}
label.l,.l{display:block;font-weight:650;font-size:14.5px;margin:12px 0 6px}
input.c,select.c{width:100%;height:52px;border:1.5px solid #B9BFBB;border-radius:12px;padding:0 14px;font-size:16px;background:#fff;color:var(--tinta)}
input.c:focus,select.c:focus{border-color:var(--tinta);outline:0}
input.c::placeholder{color:var(--gris2)}
.malo{border-color:var(--rojo)!important;background:#FFF7F6!important}
.ubic{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--tienda);font-weight:700;font-size:15px;min-height:44px}
.billetes{display:flex;gap:8px}
.billetes button{flex:1;min-height:46px;border:1.5px solid #C3C8C5;border-radius:12px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.billetes button[aria-pressed=true]{border-color:var(--tinta);background:var(--tinta);color:#fff}
.error{background:#FDECEA;color:var(--rojo);border-radius:12px;padding:12px 14px;margin:14px 20px 0;font-weight:600;font-size:15px}
.pedir-btn{position:fixed;left:0;right:0;bottom:0;padding:10px 16px max(16px,env(safe-area-inset-bottom));background:linear-gradient(rgba(255,255,255,0),#fff 30%);z-index:6}
.pedir-btn button{max-width:588px;margin:0 auto;width:100%;min-height:58px;border-radius:15px;background:var(--tienda);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-weight:720;font-size:17px;transition:transform .12s ease-out}
.pedir-btn button:active{transform:scale(.98)}
.pedir-btn button[disabled]{background:#9AA19D;cursor:default;transform:none}
.pedir-btn b{font-size:24px;font-weight:850;font-stretch:66%;font-variant-numeric:tabular-nums}
.e-top{padding:22px 22px 0}
.e-top small{font-size:13.5px;color:var(--gris);font-weight:600}
.e-top h1{font-size:30px;line-height:1.05;margin:6px 0 6px;font-weight:780;letter-spacing:-.3px;text-wrap:balance}
.e-top p{margin:0;color:var(--gris);font-size:15.5px;text-wrap:pretty}
.ruta{margin:22px 22px 0;padding:0;list-style:none}
.ruta li{display:grid;grid-template-columns:26px 1fr auto;gap:12px;padding-bottom:18px;position:relative;font-size:15.5px}
.ruta li:not(:last-child):before{content:"";position:absolute;left:12px;top:24px;bottom:2px;width:2px;background:var(--raya)}
.ruta li.ok:before{background:var(--tinta)}
.bola{width:26px;height:26px;border-radius:50%;border:2px solid #C3C8C5;background:#fff;display:grid;place-items:center;position:relative;z-index:1}
.ruta li.ok .bola{background:var(--tinta);border-color:var(--tinta);color:#fff}
.ruta li.ahora .bola{border-color:var(--tienda);box-shadow:0 0 0 5px var(--tienda-claro)}
.ruta li.ahora .bola:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--tienda)}
.ruta li b{font-weight:680}
.ruta li.pend b{color:var(--gris2);font-weight:600}
.ruta .h{color:var(--gris);font-size:13.5px;font-variant-numeric:tabular-nums}
.ruta .det{display:block;color:var(--gris);font-size:13.5px;margin-top:2px}
.e-nota{margin:4px 22px 0;padding:12px 0 0;border-top:1px solid var(--raya)}
.e-nota .leader{font-size:14.5px}
.motivo{margin:18px 22px 0;padding:14px;border-radius:12px;background:var(--fondo);font-size:15px}
.e-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 16px 0}
.e-btns a{min-height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15.5px;text-decoration:none;background:var(--fondo)}
.e-btns a.wa{background:var(--wa);color:#fff}
.otra{display:block;text-align:center;margin:18px 0 30px;color:var(--tienda);font-weight:700;min-height:44px;line-height:44px;text-decoration:none}
.cargando{padding:70px 24px;text-align:center;color:var(--gris)}
.cargando h1{font-size:24px;color:var(--tinta);margin:0 0 8px}
.cargando a,.cargando button{display:inline-flex;align-items:center;justify-content:center;margin-top:18px;min-height:50px;padding:0 22px;border-radius:12px;background:var(--tinta);color:#fff;font-weight:700;text-decoration:none}
.app-bar{position:fixed;top:0;left:0;right:0;z-index:9;height:calc(46px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;display:flex;align-items:center;gap:6px;background:#fff;border-bottom:1px solid var(--raya);font-size:15px}
.app-bar button{display:flex;align-items:center;gap:2px;min-height:44px;padding:0 6px;font-weight:650}
.app-bar span{margin-left:auto;font-size:12px;color:var(--gris2);display:flex;align-items:center;gap:6px;padding-right:6px}
.app-bar span b{color:var(--tinta);font-weight:700}
.app-bar img{height:22px}
body.en-app{padding-top:calc(46px + env(safe-area-inset-top))}
body.en-app .cabeza{top:calc(46px + env(safe-area-inset-top));padding-top:8px}
body.en-app .letrero{padding-top:18px}
body.en-app .tabs{top:calc(46px + env(safe-area-inset-top))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="cargando">Abriendo la tienda…</div></div>
<script>
'use strict';
(function () {
  const API = '/api/tienda/publico';
  const q = new URLSearchParams(location.search);
  const S = q.get('s') || '';
  const C = q.get('c') || '';
  const app = document.getElementById('app');
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pesos = (n) => { const v = Math.round((Number(n) || 0) * 100) / 100; return '$' + v.toLocaleString('es-MX', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
  const kg = (n) => (Number(n) < 1 ? Math.round(Number(n) * 1000) + ' g' : (Math.round(Number(n) * 100) / 100) + ' kg');
  const norm = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const hora = (iso) => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' }).replace(/\s?([ap])\.?\s?m\.?/i, (x, a) => ' ' + a.toLowerCase() + 'm'); };
  const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* modo privado o sin espacio */ } };
  const leer = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const enlaceTienda = () => 'tienda.html' + (S || C ? '?' + [S ? 's=' + encodeURIComponent(S) : '', C ? 'c=' + encodeURIComponent(C) : ''].filter(Boolean).join('&') : '');
  const qsInfo = () => '?s=' + encodeURIComponent(S) + (C ? '&c=' + encodeURIComponent(C) : '');
  const tel10 = (t) => String(t || '').replace(/\D/g, '').slice(-10);
  const ICO = {
    atras: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
    lupa: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>',
    mas: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>',
    wa: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.8z"/><path d="M9.3 9.2c.4 2 2.4 4.1 4.4 4.6l1-1.1 1.7.8c-.3.9-1.1 1.4-2 1.3-2.9-.4-5.6-3.1-6-6-.1-.9.4-1.7 1.3-2l.8 1.7z" stroke-width="1.2"/></svg>',
    tel: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
    pin: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
    gps: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>',
    ok: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px;stroke-width:3"><path d="M5 12l4 4 10-10"/></svg>'
  };

  // ---------------------------------------------------------------- dentro de la app «Compoint Pedidos»
  const EN_APP = /CompointPedidosApp\//.test(navigator.userAgent);
  const prellenado = {};
  if (/app_[nt]=/.test(location.hash)) {          // la app manda nombre y teléfono después del # (no llegan al servidor)
    const h = new URLSearchParams(location.hash.slice(1));
    prellenado.nombre = (h.get('app_n') || '').slice(0, 150);
    prellenado.telefono = (h.get('app_t') || '').slice(0, 20);
    history.replaceState(null, '', location.pathname + location.search);
  }
  let ultimoSeguimiento = null;
  function volverALaApp() {
    const sid = (E.info && E.info.sucursal_id) || S;
    const hist = sid ? leer('tienda:' + sid + ':pedidos', []) : [];
    if (ultimoSeguimiento && !hist.some((x) => x.k === ultimoSeguimiento.k)) hist.unshift(ultimoSeguimiento);
    const d = { h: location.host, s: String(sid || ''), c: C, n: (E.info && E.info.negocio) || (ultimoSeguimiento && ultimoSeguimiento.negocio) || '', p: hist.slice(0, 10).map((x) => ({ k: x.k, n: x.n, t: x.t })) };
    location.href = 'https://localhost/index.html#volver=' + encodeURIComponent(JSON.stringify(d));
  }
  if (EN_APP) {
    document.body.classList.add('en-app');
    const barra = document.createElement('div');
    barra.className = 'app-bar';
    barra.innerHTML = '<button type="button" aria-label="Regresar a Mis tiendas">' + ICO.atras + 'Mis tiendas</button><span>Pedidos por <b>Compoint</b><img src="iconos/compoint-red.png" alt=""></span>';
    barra.querySelector('button').onclick = volverALaApp;
    document.body.insertBefore(barra, document.body.firstChild);
  }

  async function pedir(ruta, opciones) {
    let r;
    try { r = await fetch(API + ruta, opciones); } catch (e) { throw new Error('No pudimos conectar con la tienda. Revisa tu internet.'); }
    let d = null; try { d = await r.json(); } catch (e) { /* sin cuerpo */ }
    if (!r.ok) { const err = new Error((d && d.error) || 'Algo falló. Intenta de nuevo.'); err.status = r.status; throw err; }
    return d;
  }

  const E = { info: null, productos: [], porId: new Map(), depto: 'Todo', busca: '', vista: 'tienda', error: '', errorCampo: '', enviando: false, editarDir: false };
  let clave = '';
  let carrito = {};
  let datos = {};
  const guardarCarrito = () => guardar(clave + ':carrito', carrito);
  const guardarDatos = () => guardar(clave + ':datos', datos);

  const precioDe = (p, cant) => (p.promo && cant >= p.promo.desde ? p.promo.precio : p.precio);
  const lineas = () => Object.keys(carrito).map((id) => ({ p: E.porId.get(Number(id)), cant: carrito[id] })).filter((x) => x.p && x.cant > 0);
  const subtotal = () => Math.round(lineas().reduce((s, x) => s + precioDe(x.p, x.cant) * x.cant, 0) * 100) / 100;
  const zonaElegida = () => (E.info.zonas || []).find((z) => z.id === Number(datos.zona_id)) || null;
  function envio() {
    const z = zonaElegida(); if (!z) return null;
    if (z.envio_gratis_desde && subtotal() >= z.envio_gratis_desde) return 0;
    return z.costo;
  }
  function sumar(id, signo) {
    const p = E.porId.get(id); if (!p) return;
    const actual = carrito[id] || 0;
    let nueva = p.por_peso && actual === 0 && signo > 0 ? 0.5 : actual + signo * (p.por_peso ? 0.25 : 1);
    nueva = Math.round(nueva * 1000) / 1000;
    if (nueva <= 0) delete carrito[id]; else carrito[id] = Math.min(nueva, 999);
    guardarCarrito();
  }
  const cantTxt = (p, c) => (p.por_peso ? kg(c) : String(c));

  // Ficha del producto: su foto si la tienda la subió; si no, lo que importa al comprar (1 L, 40 piezas, kg…)
  const TINTES = ['#E6ECF7', '#E7F1EA', '#F4EEE2', '#F6E8EC', '#E5F2F4', '#EFEAF6', '#F2F0E3'];
  function tinte(d) { let h = 0; for (const c of String(d || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0; return TINTES[h % TINTES.length]; }
  function ficha(p) {
    let grande, chico;
    if (p.por_peso) { grande = 'kg'; chico = 'a granel'; } else {
      const m = String(p.nombre).match(/(\d+(?:[.,]\d+)?)\s*(kg|kilos?|grs?|g|lts?|litros?|l|ml|pzas?|piezas?|pz)(?![a-z])/i);
      if (m) {
        const u = m[2].toLowerCase();
        const uni = /^k/.test(u) ? 'kg' : /^(g|gr|grs)$/.test(u) ? 'g' : u === 'ml' ? 'ml' : /^l/.test(u) ? 'L' : 'pz';
        grande = uni === 'pz' ? m[1] : m[1].replace(',', '.') + ' ' + uni;
        chico = uni === 'pz' ? 'piezas' : (p.departamento || '');
      } else {
        grande = String(p.nombre).trim().split(/\s+/)[0];
        chico = p.departamento || '';
      }
    }
    return `<span class="ficha" style="background:${tinte(p.departamento)}" aria-hidden="true"><b>${esc(grande)}</b>${chico ? `<small>${esc(chico)}</small>` : ''}${p.imagen_url ? `<img src="${esc(p.imagen_url)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</span>`;
  }

  async function cargarCatalogo() {
    const [info, prods] = await Promise.all([pedir('/info' + qsInfo()), pedir('/productos?s=' + encodeURIComponent(S))]);
    E.info = info; E.productos = prods; E.porId = new Map(prods.map((p) => [p.id, p]));
  }

  async function iniciar() {
    if (q.get('p')) return seguimiento(q.get('p'));
    try {
      await cargarCatalogo();
      clave = 'tienda:' + E.info.sucursal_id;
      carrito = leer(clave + ':carrito', {});
      datos = Object.assign({ si_falta: 'parecido', pago: 'efectivo', paga_con: '' }, leer(clave + ':datos', {}));
      if (E.info.cuenta && !datos.nombre) datos.nombre = E.info.cuenta.nombre;
      if (!datos.nombre && prellenado.nombre) datos.nombre = prellenado.nombre;
      if (!datos.telefono && prellenado.telefono) datos.telefono = prellenado.telefono;
      if (!E.info.cuenta && datos.pago === 'cuenta') datos.pago = 'efectivo';
      if (!E.info.acepta_tarjeta && datos.pago === 'tarjeta') datos.pago = 'efectivo';
      Object.keys(carrito).forEach((id) => { if (!E.porId.has(Number(id))) delete carrito[id]; });
      document.title = E.info.negocio + ' · Haz tu pedido';
      window.addEventListener('popstate', () => { E.vista = location.hash === '#pedido' && lineas().length ? 'pedido' : 'tienda'; pintar(); });
      E.vista = location.hash === '#pedido' && lineas().length ? 'pedido' : 'tienda';
      pintar();
    } catch (e) {
      app.innerHTML = `<div class="cargando"><h1>No pudimos abrir la tienda</h1><p>${esc(e.message)}</p><button type="button" onclick="location.reload()">Intentar de nuevo</button></div>`;
    }
  }

  const pintar = () => (E.vista === 'pedido' ? pintarPedido() : pintarTienda());
  function ir(vista) {
    E.vista = vista; E.error = ''; E.errorCampo = '';
    if (vista === 'pedido') history.pushState(null, '', '#pedido');
    else if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    pintar(); window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------- tienda
  function control(p, chico) {
    const c = carrito[p.id] || 0;
    if (!c) return `<button type="button" class="mas" data-mas="${p.id}" aria-label="Agregar ${esc(p.nombre)}">${ICO.mas}</button>`;
    return `<span class="paso${chico ? ' chico' : ''}"><button type="button" data-menos="${p.id}" aria-label="Quitar uno de ${esc(p.nombre)}">−</button><output aria-live="polite">${esc(cantTxt(p, c))}</output><button type="button" data-mas="${p.id}" aria-label="Agregar uno de ${esc(p.nombre)}">+</button></span>`;
  }
  function fila(p) {
    const oferta = p.promo && p.promo.desde <= 1;
    const sub = p.por_peso ? '<span>Por kilo, se pesa al surtir</span>'
      : p.promo && p.promo.desde > 1 ? `<span class="ofe">Llevando ${p.promo.desde}: ${pesos(p.promo.precio)} c/u</span>`
      : (p.departamento ? `<span>${esc(p.departamento)}</span>` : '');
    const precio = oferta ? `<s>${pesos(p.precio)}</s>${pesos(p.promo.precio)}` : pesos(p.precio);
    return `<div class="prod">${ficha(p)}<span class="n"><b>${esc(p.nombre)}</b>${sub}</span>
      <span class="der"><span class="precio">${precio}${p.por_peso ? '<small> kg</small>' : ''}</span>${control(p)}</span></div>`;
  }

  function pintarLista() {
    const el = document.getElementById('lista'); if (!el) return;
    const b = norm(E.busca);
    const l = E.productos.filter((p) => (E.depto === 'Todo' || (E.depto === 'Ofertas' ? !!p.promo : p.departamento === E.depto)) && (!b || norm(p.nombre).includes(b)));
    el.innerHTML = l.length ? l.slice(0, 400).map(fila).join('')
      : `<div class="vacio">${E.busca ? `No encontramos “${esc(E.busca)}”. Prueba con otra palabra o pregúntale a la tienda por WhatsApp.` : 'Por ahora no hay productos aquí.'}</div>`;
    pintarCarrito();
  }

  function pintarCarrito() {
    const pie = document.getElementById('pie'); if (!pie) return;
    const ls = lineas();
    if (!ls.length) { pie.innerHTML = ''; return; }
    const piezas = ls.reduce((s, x) => s + (x.p.por_peso ? 1 : x.cant), 0);
    pie.innerHTML = `<div class="carrito"><div class="envoltura"><span class="n">${piezas} ${piezas === 1 ? 'producto' : 'productos'}<b>${pesos(subtotal())}</b></span><button type="button" class="ver" id="verPedido">Ver mi pedido</button></div></div>`;
    document.getElementById('verPedido').onclick = () => ir('pedido');
  }

  function bloqueSiempre() {
    const ult = leer(clave + ':ultimo', null);
    if (!ult || !Array.isArray(ult.items) || !ult.items.length) return '';
    const items = ult.items.map((i) => ({ p: E.porId.get(i.producto_id), cant: i.cantidad, antes: i.precio })).filter((x) => x.p);
    if (!items.length) return '';
    const total = items.reduce((s, x) => s + precioDe(x.p, x.cant) * x.cant, 0);
    const resumen = items.slice(0, 3).map((x) => (x.p.por_peso ? kg(x.cant) + ' de ' : x.cant > 1 ? x.cant + ' ' : '') + x.p.nombre).join(', ') + (items.length > 3 ? ` y ${items.length - 3} más` : '');
    const subieron = items.filter((x) => x.antes && precioDe(x.p, x.cant) - x.antes >= 0.5).length;
    const faltan = ult.items.length - items.length;
    const aviso = [subieron ? (subieron === 1 ? 'Un producto subió de precio' : `${subieron} productos subieron de precio`) : '', faltan ? (faltan === 1 ? 'uno ya no está' : `${faltan} ya no están`) : ''].filter(Boolean).join(', ');
    return `<section class="siempre" aria-label="Lo de siempre"><span class="n"><b>Lo de siempre</b>${esc(resumen)}${aviso ? `<em>${esc(aviso)}</em>` : ''}</span><button type="button" id="repetir" class="num">Pedir ${pesos(total)}</button></section>`;
  }

  function pintarTienda() {
    const i = E.info;
    const deptos = ['Todo'];
    if (E.productos.some((p) => p.promo)) deptos.push('Ofertas');
    [...new Set(E.productos.map((p) => p.departamento).filter(Boolean))].forEach((d) => deptos.push(d));
    const ofertas = E.productos.filter((p) => p.promo).slice(0, 10);
    const estado = esc(i.horario.texto) + (i.horario.abierto && i.tiempo_entrega ? ' · llega en ' + esc(i.tiempo_entrega) : '');
    const wa = tel10(i.telefono).length === 10 ? `https://wa.me/52${tel10(i.telefono)}?text=${encodeURIComponent('Hola, tengo una pregunta sobre un pedido a domicilio')}` : '';
    app.innerHTML = `
      <header class="letrero"><div class="envoltura">${i.logo_url ? `<img class="logo" src="${esc(i.logo_url)}" alt="">` : ''}
        <div class="txt"><h1>${esc(i.negocio)}</h1>${i.giro ? `<div class="giro">${esc(i.giro)}</div>` : ''}
        <div class="estado ${i.horario.abierto ? '' : 'cerrado'}"><span class="punto" aria-hidden="true"></span><span>${estado}</span></div></div>
        ${wa ? `<a class="wa-redondo" href="${wa}" target="_blank" rel="noopener" aria-label="Escribir a la tienda por WhatsApp">${ICO.wa}</a>` : ''}</div></header>
      <div class="envoltura">
      <label class="buscar">${ICO.lupa}<input id="busca" type="search" enterkeyhint="search" placeholder="Busca un producto" aria-label="Buscar producto" value="${esc(E.busca)}"></label>
      ${bloqueSiempre()}
      ${ofertas.length ? `<div class="tit-s"><h2>Ofertas</h2><span>Mientras haya</span></div>
        <div class="tags" role="list">${ofertas.map((p) => {
          const varios = p.promo.desde > 1;
          const enPedido = carrito[p.id] ? `<span class="ya">✓ Llevas ${esc(cantTxt(p, carrito[p.id]))}</span>` : '';
          return `<button type="button" class="tag" role="listitem" data-mas="${p.id}" aria-label="Agregar ${esc(p.nombre)} en oferta"><span class="p">${esc(p.nombre)}</span>
            <span class="pr num">${varios ? `${p.promo.desde} x ${pesos(p.promo.precio * p.promo.desde)}` : pesos(p.promo.precio)}${p.por_peso ? '<small>/kg</small>' : ''}</span>
            ${enPedido || `<span class="an">${varios ? 'solo' : 'antes'} <s>${pesos(p.precio)}</s></span>`}</button>`; }).join('')}</div>` : ''}
      ${deptos.length > 2 ? `<nav class="tabs" aria-label="Departamentos">${deptos.map((d) => `<button type="button" data-depto="${esc(d)}" aria-pressed="${d === E.depto}">${esc(d)}</button>`).join('')}</nav>` : '<div style="height:16px"></div>'}
      <section class="lista" id="lista" aria-label="Productos"></section></div><div id="pie"></div>`;
    pintarLista();
    const b = document.getElementById('busca');
    b.oninput = () => { E.busca = b.value; pintarLista(); };
    const rep = document.getElementById('repetir');
    if (rep) rep.onclick = () => {
      const ult = leer(clave + ':ultimo', { items: [] });
      carrito = {};
      ult.items.forEach((x) => { if (E.porId.has(x.producto_id)) carrito[x.producto_id] = x.cantidad; });
      guardarCarrito(); ir('pedido');
    };
  }

  app.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-mas],[data-menos],[data-depto],[data-quitar]');
    if (!t) return;
    if (t.dataset.depto) {
      E.depto = t.dataset.depto;
      document.querySelectorAll('.tabs button').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.depto === E.depto)));
      pintarLista(); return;
    }
    if (t.dataset.quitar) { delete carrito[t.dataset.quitar]; guardarCarrito(); pintarPedido(); return; }
    const id = Number(t.dataset.mas || t.dataset.menos);
    sumar(id, t.dataset.mas ? 1 : -1);
    if (E.vista === 'pedido') { pintarPedido(); return; }
    pintarLista();
    if (t.classList.contains('tag')) {
      const an = t.querySelector('.an, .ya');
      if (an) { an.className = 'ya'; an.textContent = '✓ Llevas ' + cantTxt(E.porId.get(id), carrito[id] || 0); }
    }
  });

  // ---------------------------------------------------------------- tu pedido
  const campoMalo = (id) => (E.errorCampo === id ? ' malo' : '');
  const segmento = (grupo, opciones, etiqueta) => `<div class="seg" role="radiogroup" aria-label="${esc(etiqueta)}">${opciones.map(([v, t]) => `<button type="button" role="radio" data-grupo="${grupo}" data-valor="${esc(v)}" aria-checked="${String(datos[grupo]) === String(v)}">${t}</button>`).join('')}</div>`;
  const direccionLista = () => datos.nombre && tel10(datos.telefono).length === 10 && datos.calle && (!(E.info.zonas || []).length || zonaElegida());

  function pintarPedido() {
    const i = E.info;
    const ls = lineas();
    if (!ls.length) { ir('tienda'); return; }
    const sub = subtotal();
    const env = envio();
    const z = zonaElegida();
    const total = sub + (env || 0);
    const minimo = Number(i.pedido_minimo) || 0;
    const faltaMinimo = minimo > 0 && sub < minimo;
    let gratis = '';
    if (z && z.envio_gratis_desde && z.costo > 0) {
      const falta = z.envio_gratis_desde - sub;
      gratis = falta > 0
        ? `<div class="gratis" role="progressbar" aria-valuemin="0" aria-valuemax="${z.envio_gratis_desde}" aria-valuenow="${Math.round(sub)}" aria-label="Para envío gratis">Agrega <b class="num">${pesos(falta)}</b> y el envío es gratis<div class="barrita"><i style="width:${Math.min(100, sub / z.envio_gratis_desde * 100)}%"></i></div></div>`
        : '<div class="gratis">Tu envío es <b>gratis</b></div>';
    }
    const pagos = [['efectivo', 'Efectivo']];
    if (i.acepta_tarjeta) pagos.push(['tarjeta', 'Tarjeta']);
    if (i.cuenta) pagos.push(['cuenta', 'A mi cuenta']);
    const dispo = i.cuenta ? Math.max(0, i.cuenta.limite - i.cuenta.saldo) : 0;
    const billetes = [''].concat([50, 100, 200, 500, 1000].filter((b) => b >= total)).slice(0, 3);
    const cambio = datos.paga_con ? Number(datos.paga_con) - total : 0;
    const cta = !i.horario.abierto ? 'La tienda está cerrada' : faltaMinimo ? `Mínimo ${pesos(minimo)} en productos` : E.enviando ? 'Enviando…' : 'Pedir';
    const verDir = direccionLista() && !E.editarDir && E.errorCampo === '';
    app.innerHTML = `
      <div class="cabeza"><button type="button" class="atras" id="regresar" aria-label="Regresar a la tienda">${ICO.atras}</button><h1>Tu pedido</h1><button type="button" class="agregar" id="agregarMas">Agregar más</button></div>
      <div class="envoltura">
      <div class="nota">
        ${ls.map((x) => { const pu = precioDe(x.p, x.cant); return `<div class="renglon"><span class="nom">${esc(x.p.nombre)}<span>${x.p.por_peso ? pesos(pu) + ' el kg · se pesa al surtir' : (x.p.promo && x.cant >= x.p.promo.desde ? 'oferta ' : '') + pesos(pu) + (x.cant > 1 ? ' c/u' : '')}</span></span><span class="imp">${pesos(pu * x.cant)}</span>
          <span class="acc">${control(x.p, true)}<button type="button" class="quitar" data-quitar="${x.p.id}">Quitar</button></span></div>`; }).join('')}
        <div class="leader prim"><span>Productos</span><i></i><b>${pesos(sub)}</b></div>
        <div class="leader"><span>${z ? 'Envío a ' + esc(z.nombre) : 'Envío'}</span><i></i><b>${env === null ? ((i.zonas || []).length ? 'elige tu colonia' : 'gratis') : env === 0 ? 'gratis' : pesos(env)}</b></div>
        <div class="total"><span>${datos.pago === 'cuenta' ? 'Se anota a tu cuenta' : 'Total al recibir'}</span><b>${pesos(total)}</b></div>
        ${ls.some((x) => x.p.por_peso) ? '<div class="chiquito">Lo que va por kilo puede variar un poco al pesarlo.</div>' : ''}
        ${gratis}
      </div>
      ${faltaMinimo ? `<div class="error" role="status">El pedido mínimo es de ${pesos(minimo)} en productos. Te faltan ${pesos(minimo - sub)}.</div>` : ''}
      <section class="bloque"><h2>Si algo no hay</h2>${segmento('si_falta', [['parecido', 'Algo parecido'], ['llamar', 'Llámenme'], ['quitar', 'Quítenlo']], 'Si algo no hay')}</section>
      <section class="bloque"><h2>Entrega</h2>
        ${verDir ? `<div class="direc"><span class="ic">${ICO.pin}</span><span class="t"><b>${esc(datos.calle)}</b><span>${z ? 'Col. ' + esc(z.nombre) : ''}${datos.referencias ? ' · ' + esc(datos.referencias) : ''}<br>${esc(datos.nombre)} · ${esc(datos.telefono)}</span></span><button type="button" id="cambiarDir">Cambiar</button></div>`
        : `<label class="l" for="f-nombre">Tu nombre</label><input class="c${campoMalo('f-nombre')}" id="f-nombre" data-campo="nombre" autocomplete="name" maxlength="150" value="${esc(datos.nombre || '')}">
        <label class="l" for="f-tel">Tu WhatsApp</label><input class="c${campoMalo('f-tel')}" id="f-tel" data-campo="telefono" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="10 números" value="${esc(datos.telefono || '')}">
        ${(i.zonas || []).length ? `<label class="l" for="f-zona">Colonia</label><select class="c${campoMalo('f-zona')}" id="f-zona" data-campo="zona_id"><option value="">Elige tu colonia</option>${i.zonas.map((zz) => `<option value="${zz.id}" ${Number(datos.zona_id) === zz.id ? 'selected' : ''}>${esc(zz.nombre)} · ${zz.costo > 0 ? 'envío ' + pesos(zz.costo) : 'envío gratis'}</option>`).join('')}</select>` : ''}
        <label class="l" for="f-calle">Calle y número</label><input class="c${campoMalo('f-calle')}" id="f-calle" data-campo="calle" autocomplete="street-address" maxlength="200" value="${esc(datos.calle || '')}">
        <label class="l" for="f-ref">¿Cómo encontramos tu casa?</label><input class="c" id="f-ref" data-campo="referencias" maxlength="300" placeholder="Ej. portón negro junto a la farmacia" value="${esc(datos.referencias || '')}">
        <button type="button" class="ubic" id="ubicacion">${ICO.gps}${datos.lat ? 'Ubicación guardada' : 'Mandar mi ubicación'}</button>`}
      </section>
      <section class="bloque"><h2>Pago</h2>${pagos.length > 1 ? segmento('pago', pagos, 'Forma de pago') : ''}
        ${datos.pago === 'efectivo' ? `<div class="l" id="t-billete" style="margin-top:${pagos.length > 1 ? '14px' : '0'}">¿Con cuánto pagas?</div>
          <div class="billetes" role="group" aria-labelledby="t-billete">${billetes.map((b) => `<button type="button" data-billete="${b}" aria-pressed="${String(datos.paga_con || '') === String(b)}">${b === '' ? 'Exacto' : pesos(b)}</button>`).join('')}</div>
          ${cambio > 0 ? `<div class="chiquito">Te llevamos <b class="num" style="color:var(--tinta)">${pesos(cambio)}</b> de cambio</div>` : ''}`
        : datos.pago === 'tarjeta' ? '<div class="chiquito">El repartidor lleva terminal.</div>'
        : `<div class="chiquito">Debes ${pesos(i.cuenta.saldo)} de ${pesos(i.cuenta.limite)}. Te quedan ${pesos(dispo)}.</div>`}
      </section>
      ${E.error ? `<div class="error" role="alert" id="errorPedido">${esc(E.error)}</div>` : ''}
      <div style="height:110px"></div></div>
      <div class="pedir-btn"><button type="button" id="enviar" ${!i.horario.abierto || faltaMinimo || E.enviando ? 'disabled' : ''}><span>${cta}</span><b>${pesos(total)}</b></button></div>`;

    document.getElementById('regresar').onclick = () => ir('tienda');
    document.getElementById('agregarMas').onclick = () => ir('tienda');
    const cd = document.getElementById('cambiarDir'); if (cd) cd.onclick = () => { E.editarDir = true; pintarPedido(); };
    app.querySelectorAll('[data-grupo]').forEach((b) => { b.onclick = () => { datos[b.dataset.grupo] = b.dataset.valor; guardarDatos(); pintarPedido(); }; });
    app.querySelectorAll('[data-billete]').forEach((b) => { b.onclick = () => { datos.paga_con = b.dataset.billete; guardarDatos(); pintarPedido(); }; });
    app.querySelectorAll('[data-campo]').forEach((c) => {
      c.addEventListener(c.tagName === 'SELECT' ? 'change' : 'input', () => {
        datos[c.dataset.campo] = c.value; guardarDatos(); c.classList.remove('malo');
        if (c.tagName === 'SELECT') { E.editarDir = true; pintarPedido(); }
      });
    });
    const ub = document.getElementById('ubicacion'); if (ub) ub.onclick = ubicar;
    document.getElementById('enviar').onclick = enviar;
    if (E.errorCampo) { const c = document.getElementById(E.errorCampo); if (c) { c.scrollIntoView({ block: 'center' }); c.focus({ preventScroll: true }); } }
    else if (E.error) { const er = document.getElementById('errorPedido'); if (er) er.scrollIntoView({ block: 'center' }); }
  }

  function ubicar() {
    const b = document.getElementById('ubicacion');
    if (!navigator.geolocation) { b.innerHTML = ICO.gps + 'Tu celular no permite ubicación'; return; }
    b.innerHTML = ICO.gps + 'Buscando tu ubicación…';
    navigator.geolocation.getCurrentPosition((pos) => {
      datos.lat = Math.round(pos.coords.latitude * 1e6) / 1e6; datos.lon = Math.round(pos.coords.longitude * 1e6) / 1e6; guardarDatos();
      b.innerHTML = ICO.gps + 'Ubicación guardada';
    }, () => { b.innerHTML = ICO.gps + 'No se pudo. Con tu dirección basta'; }, { enableHighAccuracy: true, timeout: 15000 });
  }

  function validar() {
    if (!datos.nombre || String(datos.nombre).trim().length < 2) return ['f-nombre', 'Escribe tu nombre'];
    if (tel10(datos.telefono).length !== 10) return ['f-tel', 'Escribe tu WhatsApp a 10 números'];
    if ((E.info.zonas || []).length && !zonaElegida()) return ['f-zona', 'Elige tu colonia'];
    if (!datos.calle || !String(datos.calle).trim()) return ['f-calle', 'Escribe tu calle y número'];
    return null;
  }

  async function enviar() {
    if (E.enviando) return;
    const mal = validar();
    if (mal) { E.errorCampo = mal[0]; E.error = mal[1]; E.editarDir = true; pintarPedido(); return; }
    E.enviando = true; E.error = ''; E.errorCampo = ''; pintarPedido();
    const ls = lineas();
    try {
      const r = await pedir('/pedido', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          s: E.info.sucursal_id, c: C || undefined, nombre: datos.nombre, telefono: datos.telefono, zona_id: datos.zona_id || null,
          calle: datos.calle, referencias: datos.referencias || null, latitud: datos.lat || null, longitud: datos.lon || null,
          si_falta: datos.si_falta, pago: datos.pago, paga_con: datos.pago === 'efectivo' && datos.paga_con ? Number(datos.paga_con) : null,
          items: ls.map((x) => ({ producto_id: x.p.id, cantidad: x.cant }))
        })
      });
      guardar(clave + ':ultimo', { items: ls.map((x) => ({ producto_id: x.p.id, cantidad: x.cant, precio: precioDe(x.p, x.cant) })) });
      const hist = leer(clave + ':pedidos', []);
      hist.unshift({ k: r.seguimiento, n: r.numero, t: Date.now() });
      guardar(clave + ':pedidos', hist.slice(0, 10));
      carrito = {}; guardarCarrito();
      location.replace('tienda.html?p=' + encodeURIComponent(r.seguimiento) + '&s=' + encodeURIComponent(E.info.sucursal_id) + (C ? '&c=' + encodeURIComponent(C) : ''));
    } catch (e) {
      E.enviando = false; E.error = e.message;
      if (e.status === 409) { try { await cargarCatalogo(); } catch (e2) { /* se queda lo que había */ } }
      pintarPedido();
    }
  }

  // ---------------------------------------------------------------- seguimiento
  let reloj = null;
  async function seguimiento(cl) {
    let d;
    try { d = await pedir('/seguimiento/' + encodeURIComponent(cl)); } catch (e) {
      if (!app.querySelector('.ruta')) app.innerHTML = `<div class="cargando"><h1>${e.status === 404 ? 'No encontramos ese pedido' : 'Sin conexión'}</h1><p>${esc(e.message)}</p><a href="${enlaceTienda()}">Ir a la tienda</a></div>`;
      clearTimeout(reloj); if (e.status !== 404) reloj = setTimeout(() => seguimiento(cl), 30000); return;
    }
    document.title = d.negocio + ' · Tu pedido';
    ultimoSeguimiento = { k: cl, n: d.numero, t: Date.now(), negocio: d.negocio };
    const rep = d.repartidor ? d.repartidor.nombre : '';
    const pagoTxt = d.pago_previsto === 'cuenta' ? `Se anota ${pesos(d.total)} a tu cuenta`
      : d.pago_previsto === 'tarjeta' ? `Pagas ${pesos(d.total)} con tarjeta`
      : `Pagas ${pesos(d.total)} en efectivo${d.cambio ? `, con ${pesos(d.paga_con)} y te llevan ${pesos(d.cambio)} de cambio` : ''}`;
    const pasos = [
      { t: 'Pedido recibido', h: hora(d.horas.recibido) },
      { t: d.horas.confirmado ? 'La tienda lo aceptó' : 'Esperando que la tienda lo acepte', h: hora(d.horas.confirmado), det: d.horas.confirmado ? '' : 'Normalmente en unos minutos' },
      { t: d.paso === 'listo' ? 'Listo para salir' : 'Surtiendo', h: '' },
      { t: 'En camino', h: hora(d.horas.salio), det: rep ? `Lo lleva ${rep}` : '' },
      { t: 'Entregado', h: hora(d.horas.entregado), det: pagoTxt }
    ];
    const pos = { recibido: 1, surtiendo: 2, listo: 2, en_camino: 3, entregado: 5 }[d.paso];
    const titulo = {
      recibido: 'Recibimos tu pedido', surtiendo: 'Están surtiendo tu pedido', listo: 'Tu pedido está listo',
      en_camino: rep ? `Va en camino con ${rep}` : 'Tu pedido va en camino', entregado: 'Entregado. ¡Gracias!', cancelado: 'Tu pedido se canceló', no_entregado: 'No se pudo entregar tu pedido'
    }[d.paso] || 'Tu pedido';
    const texto = {
      recibido: 'La tienda lo va a revisar en un momento. Esta pantalla cambia sola.', surtiendo: 'Ya están juntando tus productos. Aquí te avisamos cuando salga.',
      listo: 'Ya está empacado y sale en breve.', en_camino: 'Ten listo tu pago. ' + pagoTxt + '.', entregado: 'Que lo disfrutes.'
    }[d.paso] || '';
    const tt = tel10(d.telefono_tienda);
    const wa = tt.length === 10 ? `https://wa.me/52${tt}?text=${encodeURIComponent('Hola, les escribo por mi pedido ' + d.numero)}` : '';
    const llamaRep = d.paso === 'en_camino' && d.repartidor && d.repartidor.telefono;
    const telLlamar = llamaRep ? String(d.repartidor.telefono).replace(/[^\d+]/g, '') : tt;
    const malo = d.paso === 'cancelado' || d.paso === 'no_entregado';
    app.innerHTML = `<div class="envoltura">
      <div class="e-top"><small>Pedido ${esc(d.numero)} · ${esc(d.negocio)}</small><h1>${esc(titulo)}</h1>${texto ? `<p>${esc(texto)}</p>` : ''}</div>
      ${malo ? `<div class="motivo">${d.motivo_cancelacion ? esc(d.motivo_cancelacion) : 'Escríbele a la tienda para saber qué pasó.'}</div>`
        : `<ol class="ruta" aria-label="Avance de tu pedido" aria-live="polite">${pasos.map((p, n) => {
          const cls = n < pos ? 'ok' : n === pos ? 'ahora' : 'pend';
          const h = cls === 'pend' ? '' : (cls === 'ahora' && !p.h ? 'ahora' : p.h);
          return `<li class="${cls}" ${cls === 'ahora' ? 'aria-current="step"' : ''}><span class="bola" aria-hidden="true">${cls === 'ok' ? ICO.ok : ''}</span><span><b>${esc(p.t)}</b>${p.det && cls !== 'ok' ? `<span class="det">${esc(p.det)}</span>` : ''}</span><span class="h">${esc(h)}</span></li>`; }).join('')}</ol>`}
      <div class="e-nota">${d.items.map((x) => `<div class="leader"><span>${esc(x.cantidad)} ${esc(x.nombre)}</span><i></i><b>${pesos(x.subtotal)}</b></div>`).join('')}
        <div class="total"><span>Total</span><b>${pesos(d.total)}</b></div></div>
      <div class="e-btns">${wa ? `<a class="wa" href="${wa}" target="_blank" rel="noopener">${ICO.wa}WhatsApp</a>` : ''}${telLlamar ? `<a href="tel:${esc(telLlamar)}">${ICO.tel}${llamaRep ? 'Llamar a ' + esc(rep) : 'Llamar'}</a>` : ''}</div>
      <a class="otra" href="${enlaceTienda()}">Hacer otro pedido</a></div>`;
    clearTimeout(reloj);
    if (!['entregado', 'cancelado', 'no_entregado'].includes(d.paso)) reloj = setTimeout(() => seguimiento(cl), 30000);
  }

  iniciar();
})();
</script>
</body>
</html>
