<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mostrador - Cremería POS</title>
<link rel="stylesheet" href="css/app-theme.css">
<script src="js/tema.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  .layout { display: flex; height: calc(100vh - 60px); }
  .panel-productos { flex: 2; padding: 14px; overflow-y: auto; }
  .panel-carrito { flex: 1; min-width: 300px; padding: 14px; background: white; display: flex; flex-direction: column; }
  .categorias { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
  .categoria-tab {
    padding: 10px 16px; border-radius: 20px; background: #E0E0E0; white-space: nowrap;
    cursor: pointer; font-weight: 600; font-size: 14px;
  }
  .categoria-tab.activa { background: #2E7D32; color: white; }
  .categoria-tab.kits { background: #F9A825; color: white; }
  .grid-productos {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px;
  }
  .producto-card {
    background: white; border-radius: 14px; overflow: hidden; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08); text-align: center; user-select: none;
    transition: transform 0.1s; position: relative;
  }
  .producto-card:active { transform: scale(0.96); background: #E8F5E9; }
  .producto-card img { width: 100%; height: 90px; object-fit: cover; background: #EEE; }
  .producto-card .nombre { padding: 8px 6px 2px; font-size: 13px; font-weight: 600; }
  .producto-card .precio { padding: 0 6px 8px; font-size: 12px; color: #555; }
  .badge-tipo {
    position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 8px; color: white;
  }
  .badge-peso { background: #1565C0; }
  .badge-unidad { background: #6A1B9A; }
  .badge-kit { background: #F9A825; }
  .carrito-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #EEE; font-size: 14px; }
  .carrito-item button { background: none; border: none; color: #C62828; font-size: 18px; cursor: pointer; }
  .total-box { font-size: 22px; font-weight: 700; text-align: right; margin: 12px 0; }
  #scannerProducto { width: 100%; max-width: 320px; margin-bottom: 10px; }

  /* Modal genérico */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.abierto { display: flex; }
  .modal-caja { background: white; border-radius: 16px; padding: 20px; width: 300px; }
  .modal-caja h3 { margin-top: 0; text-align: center; }
  .display-valor {
    font-size: 36px; text-align: center; padding: 14px; background: #F4F5F6;
    border-radius: 10px; margin: 14px 0; font-weight: 700;
  }
  .teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tecla {
    background: #F4F5F6; border: none; border-radius: 10px; font-size: 22px;
    padding: 16px 0; cursor: pointer; font-weight: 600;
  }
  .tecla:active { background: #DDD; }
  .subtotal-preview { text-align: center; color: #555; margin-top: 8px; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 14px 0; }
  .stepper button {
    width: 54px; height: 54px; border-radius: 50%; border: none; background: #2E7D32;
    color: white; font-size: 28px; cursor: pointer;
  }
  .stepper .cantidad-num { font-size: 32px; font-weight: 700; min-width: 60px; text-align: center; }
</style>
</head>
<body>
  <div class="top-bar">
    <h1>🥩 Mostrador</h1>
    <a class="btn btn-secondary" href="index.html">🏠 Inicio</a>
    <button class="btn btn-secondary" onclick="cerrarSesion()">Salir</button>
  </div>

  <div style="background:#F4F5F6; padding:10px 14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; border-bottom:1px solid #DDD;">
    <button class="btn btn-secondary" onclick="generarFicha()">🎫 Generar Ficha</button>
    <button class="btn btn-primary" onclick="llamarSiguienteTurno()">▶️ Llamar Siguiente</button>
    <button class="btn btn-secondary" onclick="reimprimirUltimaFicha()">🔁 Reimprimir Última</button>
    <span id="contadorFichasPendientes" style="font-size:13px; color:#666;"></span>
  </div>

  <div id="bannerImpresora" style="display:none; background:#FFF3CD; color:#7A5B00; padding:10px 14px; text-align:center; font-size:14px;">
    🖨 Impresora no conectada en este dispositivo — <a href="#" onclick="conectarImpresoraMostrador(); return false;" style="color:#7A5B00; font-weight:700;">Conectar Bluetooth</a> · <a href="#" onclick="conectarImpresoraMostradorUSB(); return false;" style="color:#7A5B00; font-weight:700;">Conectar USB</a>
  </div>

  <div class="layout">
    <div class="panel-productos">
      <button class="btn btn-secondary" style="margin-bottom:10px;" onclick="toggleScannerProducto()">📷 Escanear código de barras</button>
      <div id="scannerProducto"></div>

      <input type="text" id="buscadorProductos" placeholder="🔍 Buscar por nombre o código de barras... (F1)" style="margin-bottom:10px;" oninput="filtrarProductosPorTexto()">

      <div class="categorias" id="categorias"></div>
      <div class="grid-productos" id="gridProductos"></div>
    </div>

    <div class="panel-carrito">
      <h3>Ticket actual</h3>
      <div id="carritoItems" style="flex:1; overflow-y:auto;"></div>
      <div class="total-box">Total: $<span id="totalTicket">0.00</span></div>
      <button class="btn btn-primary" style="width:100%" onclick="generarTicket()">🖨 Generar e Imprimir Ticket</button>
    </div>
  </div>

  <!-- Modal para capturar peso (productos a granel) -->
  <div class="modal-overlay" id="modalPeso">
    <div class="modal-caja">
      <h3 id="modalProductoNombre">Producto</h3>
      <div class="display-valor" id="displayPeso">0.000</div>
      <div class="subtotal-preview" id="subtotalPreview">Subtotal: $0.00</div>
      <div class="teclado">
        <button class="tecla" onclick="teclear('1')">1</button>
        <button class="tecla" onclick="teclear('2')">2</button>
        <button class="tecla" onclick="teclear('3')">3</button>
        <button class="tecla" onclick="teclear('4')">4</button>
        <button class="tecla" onclick="teclear('5')">5</button>
        <button class="tecla" onclick="teclear('6')">6</button>
        <button class="tecla" onclick="teclear('7')">7</button>
        <button class="tecla" onclick="teclear('8')">8</button>
        <button class="tecla" onclick="teclear('9')">9</button>
        <button class="tecla" onclick="teclear('.')">.</button>
        <button class="tecla" onclick="teclear('0')">0</button>
        <button class="tecla" onclick="borrarUltimo()">⌫</button>
      </div>
      <div style="display:flex; gap:8px; margin-top:14px;">
        <button class="btn btn-secondary" style="flex:1" onclick="cerrarModal('modalPeso')">Cancelar</button>
        <button class="btn btn-primary" style="flex:1" onclick="confirmarPeso()">Agregar</button>
      </div>
    </div>
  </div>

  <!-- Modal para capturar cantidad (productos por unidad) -->
  <div class="modal-overlay" id="modalUnidad">
    <div class="modal-caja">
      <h3 id="modalUnidadNombre">Producto</h3>
      <div class="stepper">
        <button onclick="cambiarCantidadUnidad(-1)">−</button>
        <div class="cantidad-num" id="cantidadUnidadNum">1</div>
        <button onclick="cambiarCantidadUnidad(1)">+</button>
      </div>
      <div class="subtotal-preview" id="subtotalUnidadPreview">Subtotal: $0.00</div>
      <div style="display:flex; gap:8px; margin-top:14px;">
        <button class="btn btn-secondary" style="flex:1" onclick="cerrarModal('modalUnidad')">Cancelar</button>
        <button class="btn btn-primary" style="flex:1" onclick="confirmarUnidad()">Agregar</button>
      </div>
    </div>
  </div>

<script src="js/api.js"></script>
<script src="js/estado-conexion.js"></script>
<script src="js/ui-components.js"></script>
<script src="js/lector-fisico.js"></script>
<script src="js/impresora-termica.js"></script>
<script src="js/mostrador.js"></script>
</body>
</html>
