<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial de cortes - Compoint Punto</title>
<!-- «Cortes por día» ahora vive dentro de «Historial de cortes» (cortes.html, vista Por día).
     Esta página solo redirige para que no fallen enlaces o accesos guardados. -->
<script>
  (function () {
    var f = new URLSearchParams(location.search).get('fecha');
    location.replace('cortes.html?vista=dia' + (/^\d{4}-\d{2}-\d{2}$/.test(f || '') ? '&fecha=' + f : ''));
  })();
</script>
</head>
<body></body>
</html>
