<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../favicon.ico">
<meta name="theme-color" content="#5FAE46">
<title>Reportes - Compoint Punto</title>
<link rel="stylesheet" href="../css/app-theme.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/vistas-admin.css">
<script src="../js/tema.js"></script>
<style>
  .oculto { display: none !important; }
  .filtros { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .fechas { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .fechas input[type=date] { width: 160px; }
  .fechas .a { color: var(--muted, #7A7D83); font-size: 13px; }
  .rango-texto { font-size: 12px; color: var(--muted, #7A7D83); margin: 0 4px 12px; }
  .nota { font-size: 12px; color: var(--muted, #7A7D83); margin: 12px 4px 0; line-height: 1.4; }

  .kpis { margin-bottom: 12px; }
  .kpi .ic.verde { background: rgba(95,174,70,.18); }
  .kpi .ic.azul { background: rgba(21,101,192,.14); }
  .kpi .ic.morado { background: rgba(142,36,170,.14); }
  .kpi .ic.amarillo { background: rgba(249,168,37,.2); }
  .kpi .ic.rojo { background: rgba(198,40,40,.14); }
  .kpi.destaca { background: rgba(95,174,70,.12); }
  .kpi.destaca .v { color: #2E7D32; }
  .kpi.peligro .v { color: #C62828; }
  [data-tema="oscuro"] .kpi.destaca .v { color: #8BD97A; }
  [data-tema="oscuro"] .kpi.peligro .v { color: #F28B8B; }

  .tarjeta-tit { padding: 14px 16px 4px; font-size: 16px; font-weight: 800; }
  .tarjeta-cuerpo { padding: 8px 16px 14px; }
  .caja.ancha { grid-column: 1 / -1; }
  .leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted, #7A7D83); margin: 2px 0 6px; }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  /* Barras horizontales */
  .hb { display: grid; grid-template-columns: 112px minmax(0, 1fr) 100px; gap: 10px; align-items: center; padding: 7px 0; }
  .hb .n b { display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hb .n small, .hb .v small { display: block; font-size: 11.5px; color: var(--muted, #7A7D83); font-weight: 500; }
  .hb .v { text-align: right; font-size: 13.5px; }
  .hb .v b { font-weight: 800; }
  .hb .prog { height: 12px; }

  /* Lista con número (ranking) */
  .rank { display: flex; align-items: center; gap: 11px; padding: 10px 16px; border-bottom: 1px solid var(--border, #E4E6E9); }
  .rank:last-child { border-bottom: none; }
  .rank .no { width: 28px; height: 28px; border-radius: 50%; background: #98A2AD; color: #fff; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; flex: none; }
  .rank:first-child .no { background: #F9A825; }
  .rank .info { flex: 1; min-width: 0; }
  .rank .info b { display: block; font-size: 14px; overflow-wrap: anywhere; }
  .rank .info small { color: var(--muted, #7A7D83); font-size: 12px; }
  .rank .monto { font-weight: 800; white-space: nowrap; }
  .lista-simple .linea { padding: 10px 16px; }
  .lista-simple .linea > div:first-child { min-width: 0; overflow-wrap: anywhere; }

  .grafica-svg { width: 100%; height: auto; display: block; }
  .grafica-svg text { font-size: 11px; fill: var(--muted, #7A7D83); }

  @media (max-width: 1000px) {
    .fechas { width: 100%; }
    .fechas input[type=date] { flex: 1; width: auto; min-width: 130px; }
    .fechas .btn { width: 100%; }
    .fechas.cerrada { display: none; }
  }
  @media (max-width: 600px) {
    .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
    .kpis > :last-child:nth-child(odd) { grid-column: 1 / -1; }
    .kpi { padding: 12px; gap: 10px; }
    .kpi .ic { display: none; }
    .kpi .v { font-size: 20px; }
    .hb { grid-template-columns: 84px minmax(0, 1fr) 82px; gap: 8px; }
    .tarjeta-tit { padding: 12px 12px 2px; }
    .tarjeta-cuerpo { padding: 6px 12px 12px; }
    .rank { padding: 9px 12px; gap: 9px; }
    .lista-simple .linea { padding: 9px 12px; }
    .pestanas { padding: 0 4px; }
    .pestanas button { padding: 12px 9px; font-size: 13px; }
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div style="display:flex; align-items:center; gap:4px;"><button class="btn-abrir-sidebar" onclick="abrirSidebarMovil()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1>📈 Reportes</h1></div>
    <button class="btn btn-secondary" id="btnCsv" onclick="exportarCSV()">⬇️ Exportar CSV</button>
    <a class="btn btn-secondary" href="dashboard.html">🏠 Inicio</a>
    <button class="btn btn-secondary" onclick="cerrarSesion()">Salir</button>
  </div>

  <div class="contenido">
    <div class="pestanas suelta" id="tabs">
      <button id="tabVentas" class="activa" onclick="cambiarTabReporte('ventas')">📈 Ventas</button>
      <button id="tabCompras" onclick="cambiarTabReporte('compras')">🛒 Compras</button>
      <button id="tabClientes" onclick="cambiarTabReporte('clientes')">👥 Clientes</button>
      <button id="tabPerdidas" onclick="cambiarTabReporte('perdidas')">📉 Pérdidas</button>
    </div>

    <div class="caja filtros">
      <div class="chips desliza" id="chipsRapidos"></div>
      <div class="fechas cerrada" id="fechas">
        <input type="date" id="fechaDesde" aria-label="Desde">
        <span class="a">a</span>
        <input type="date" id="fechaHasta" aria-label="Hasta">
        <button class="btn btn-primary" onclick="verRango()">Ver reporte</button>
      </div>
    </div>
    <div class="rango-texto" id="rangoTexto"></div>

    <div id="cuerpo"><div class="vacio">Cargando…</div></div>
  </div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/estado-conexion.js"></script>
<script src="../js/ui-components.js"></script>
<script>
requiereLogin();

const escapar = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dinero = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dineroCorto = (n) => '$' + Math.round(Number(n || 0)).toLocaleString('en-US');
const cant = (n) => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const MESES_CORTOS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const PALETA = ['#5FAE46', '#1565C0', '#8E24AA', '#EF6C00', '#00838F', '#C62828', '#8D6E63', '#F9A825'];
const COLOR_PAGO = { efectivo: '#5FAE46', tarjeta: '#1565C0', transferencia: '#8E24AA', credito: '#EF6C00', mixto: '#00838F', dolares: '#2E7D32', cheque: '#8D6E63', vale_despensa: '#F9A825' };
const NOMBRE_PAGO = { efectivo: 'Efectivo', tarjeta: 'Tarjeta', transferencia: 'Transferencia', mixto: 'Mixto', credito: 'Fiado', dolares: 'Dólares', cheque: 'Cheque', vale_despensa: 'Vale de despensa' };
const RAPIDOS = [['hoy', 'Hoy'], ['ayer', 'Ayer'], ['semana', '7 días'], ['mes', 'Este mes'], ['mespasado', 'Mes pasado'], ['anio', 'Este año']];

let tabReporteActual = 'ventas';
let rapido = 'hoy';          // preset activo; null = rango a mano
let pedido = 0;              // para ignorar respuestas viejas
let datosPerdidas = null;

function formatearFechaInput(fecha) {
  // Fecha LOCAL (con toISOString de noche se adelantaba un día)
  const p = (n) => String(n).padStart(2, '0');
  return fecha.getFullYear() + '-' + p(fecha.getMonth() + 1) + '-' + p(fecha.getDate());
}
function fechaLarga(iso) {
  const [a, m, d] = iso.split('-').map(Number);
  return `${d} ${MESES_CORTOS[m - 1]} ${a}`;
}

// ---------- Filtros de fecha ----------
function pintarFiltros() {
  const hayRango = rapido === null;
  document.getElementById('chipsRapidos').innerHTML = RAPIDOS
    .map(([k, t]) => `<button class="chip ${rapido === k ? 'activo' : ''}" onclick="filtroRapido('${k}')">${t}</button>`).join('')
    + `<button class="chip solo-movil ${hayRango ? 'activo' : ''}" onclick="alternarFechas()">📅 Rango</button>`;
  const desde = document.getElementById('fechaDesde').value, hasta = document.getElementById('fechaHasta').value;
  document.getElementById('rangoTexto').textContent = desde && hasta
    ? (desde === hasta ? fechaLarga(desde) : `${fechaLarga(desde)} — ${fechaLarga(hasta)}`) : '';
  // en PC las fechas siempre se ven; en celular solo si se abre "Rango"
  document.getElementById('fechas').classList.toggle('cerrada', !hayRango && !fechasAbiertas);
}
let fechasAbiertas = false;
function alternarFechas() { fechasAbiertas = !fechasAbiertas; pintarFiltros(); }

function filtroRapido(tipo) {
  const hoy = new Date();
  const a = hoy.getFullYear(), m = hoy.getMonth();
  let desde = new Date(hoy), hasta = new Date(hoy);
  if (tipo === 'ayer') { desde.setDate(hoy.getDate() - 1); hasta = new Date(desde); }
  if (tipo === 'semana') desde.setDate(hoy.getDate() - 6);
  if (tipo === 'mes') desde = new Date(a, m, 1);
  if (tipo === 'mespasado') { desde = new Date(a, m - 1, 1); hasta = new Date(a, m, 0); }
  if (tipo === 'anio') desde = new Date(a, 0, 1);
  rapido = tipo;
  fechasAbiertas = false;
  document.getElementById('fechaDesde').value = formatearFechaInput(desde);
  document.getElementById('fechaHasta').value = formatearFechaInput(hasta);
  pintarFiltros();
  cargarReporte();
}

function verRango() {
  const desde = document.getElementById('fechaDesde').value, hasta = document.getElementById('fechaHasta').value;
  if (!desde || !hasta) { mostrarToast('Elige las dos fechas', 'error'); return; }
  if (desde > hasta) { mostrarToast('La fecha inicial no puede ser después de la final', 'error'); return; }
  rapido = null;
  fechasAbiertas = true;
  pintarFiltros();
  cargarReporte();
}

function construirQueryFechas() {
  const desde = document.getElementById('fechaDesde').value;
  const hasta = document.getElementById('fechaHasta').value;
  if (!desde || !hasta) return '';
  // El backend espera "hasta" como límite exclusivo del día siguiente para incluir todo el día
  const [a, m, d] = hasta.split('-').map(Number);
  const hastaFin = new Date(a, m - 1, d + 1);
  return `?desde=${desde}&hasta=${formatearFechaInput(hastaFin)}`;
}

// ---------- Pestañas y carga ----------
function cambiarTabReporte(tab) {
  tabReporteActual = tab;
  ['Ventas', 'Compras', 'Clientes', 'Perdidas'].forEach((nombre) => {
    document.getElementById('tab' + nombre).classList.toggle('activa', nombre.toLowerCase() === tab);
  });
  document.getElementById('btnCsv').classList.toggle('oculto', tab !== 'ventas');
  document.getElementById('cuerpo').innerHTML = '<div class="vacio">Cargando…</div>';
  cargarReporte();
}

async function cargarReporte() {
  const mio = ++pedido;
  const tab = tabReporteActual;
  try {
    const data = await apiFetch(`/reportes/${tab}${construirQueryFechas()}`);
    if (mio !== pedido) return;
    if (tab === 'ventas') renderResumen(data);
    else if (tab === 'compras') renderCompras(data);
    else if (tab === 'clientes') renderClientes(data);
    else renderPerdidas(data);
  } catch (err) {
    if (mio !== pedido) return;
    mostrarToast(err.message, 'error');
    document.getElementById('cuerpo').innerHTML = '<div class="vacio">No se pudo cargar el reporte.<br><button class="btn btn-secondary" style="margin-top:10px;" onclick="cargarReporte()">Reintentar</button></div>';
  }
}

// ---------- Piezas ----------
function kpi(icono, color, valor, etiqueta, extra = '') {
  return `<div class="caja kpi ${extra}"><div class="ic ${color}">${icono}</div><div><div class="v num">${valor}</div><div class="l">${etiqueta}</div></div></div>`;
}
function tarjeta(titulo, cuerpo, { ancha = false, sinPad = false, lista = false } = {}) {
  return `<div class="caja recorta ${ancha ? 'ancha' : ''}"><div class="tarjeta-tit">${titulo}</div>${sinPad ? `<div class="${lista ? 'lista-simple' : ''}" style="padding-top:6px;">${cuerpo}</div>` : `<div class="tarjeta-cuerpo">${cuerpo}</div>`}</div>`;
}
// filas: [{nombre, sub, valor, color, texto, subTexto}]
function barrasH(filas, vacio) {
  if (!filas.length) return `<div class="vacio">${vacio}</div>`;
  const max = Math.max(...filas.map((f) => f.valor), 0) || 1;
  return filas.map((f) => `<div class="hb">
    <div class="n" title="${escapar(f.nombre)}"><b>${escapar(f.nombre)}</b>${f.sub ? `<small>${escapar(f.sub)}</small>` : ''}</div>
    <div class="prog"><i style="width:${Math.max(2, f.valor / max * 100).toFixed(1)}%;background:${f.color}"></i></div>
    <div class="v"><b>${f.texto}</b>${f.subTexto ? `<small>${f.subTexto}</small>` : ''}</div>
  </div>`).join('');
}
const pct = (parte, total) => total > 0 ? Math.round(parte / total * 100) + '%' : '';

// ---------- Ventas ----------
function renderResumen(data) {
  const g = data.ganancia_estimada;
  const total = parseFloat(data.total_general.total) || 0;
  const tickets = parseInt(data.total_general.num_tickets, 10) || 0;

  const sumaMetodos = data.por_metodo_pago.reduce((s, m) => s + parseFloat(m.total || 0), 0);
  const metodos = barrasH(data.por_metodo_pago.map((m) => ({
    nombre: NOMBRE_PAGO[m.metodo_pago] || m.metodo_pago || 'Sin especificar',
    sub: m.num_tickets + (Number(m.num_tickets) === 1 ? ' ticket' : ' tickets'),
    valor: parseFloat(m.total || 0), color: COLOR_PAGO[m.metodo_pago] || '#78909C',
    texto: dinero(m.total), subTexto: pct(parseFloat(m.total || 0), sumaMetodos)
  })), 'Sin ventas en este rango');

  const sumaEmp = data.por_empleado.reduce((s, e) => s + parseFloat(e.total || 0), 0);
  const empleados = barrasH(data.por_empleado.map((e, i) => ({
    nombre: e.empleado || 'Sin nombre',
    sub: e.num_tickets + (Number(e.num_tickets) === 1 ? ' ticket' : ' tickets'),
    valor: parseFloat(e.total || 0), color: PALETA[i % PALETA.length],
    texto: dinero(e.total), subTexto: pct(parseFloat(e.total || 0), sumaEmp)
  })), 'Sin ventas en este rango');

  const deptos = barrasH(data.por_categoria.map((c, i) => ({
    nombre: c.categoria || 'Sin departamento', valor: parseFloat(c.total || 0),
    color: PALETA[(i + 3) % PALETA.length], texto: dinero(c.total)
  })), 'Sin ventas en este rango');

  const productos = data.top_productos.length ? data.top_productos.map((p, i) => `<div class="rank">
      <div class="no">${i + 1}</div>
      <div class="info"><b>${escapar(p.nombre_producto)}</b><small>${cant(p.cantidad_total)} vendidos</small></div>
      <div class="monto num">${dinero(p.monto_total)}</div></div>`).join('')
    : '<div class="vacio">Sin ventas en este rango</div>';

  document.getElementById('cuerpo').innerHTML = `
    <div class="kpis">
      ${kpi('💰', 'verde', dinero(total), 'Total vendido')}
      ${kpi('🧾', 'azul', tickets, 'Tickets cobrados')}
      ${kpi('🎟️', 'morado', dinero(tickets ? total / tickets : 0), 'Ticket promedio')}
      ${kpi('📈', 'amarillo', dinero(g.ganancia), 'Ganancia estimada*', 'destaca')}
    </div>
    <div class="rejilla-2">
      ${tarjeta('💳 Por método de pago', metodos)}
      ${tarjeta('🧑‍💼 Por empleado', empleados)}
      ${tarjeta('🏷️ Por departamento', deptos)}
      ${tarjeta('⭐ Productos más vendidos', productos, { sinPad: true })}
    </div>
    <p class="nota">* ${escapar(g.nota)}</p>`;
}

// ---------- Compras ----------
function renderCompras(data) {
  const tg = data.total_general;
  const sumaProv = data.por_proveedor.reduce((s, p) => s + parseFloat(p.total || 0), 0);
  const proveedores = barrasH(data.por_proveedor.map((p, i) => ({
    nombre: p.proveedor || 'Sin proveedor',
    sub: p.num_compras + (Number(p.num_compras) === 1 ? ' compra' : ' compras'),
    valor: parseFloat(p.total || 0), color: PALETA[i % PALETA.length],
    texto: dinero(p.total), subTexto: pct(parseFloat(p.total || 0), sumaProv)
  })), 'Sin compras en este rango');

  const evolucion = data.evolucion_costo.length ? data.evolucion_costo.map((e) => {
    const ini = parseFloat(e.costo_inicial), rec = parseFloat(e.costo_reciente);
    const cambio = ini > 0 ? (rec - ini) / ini * 100 : 0;
    let pill;
    if (rec > ini) pill = `<span class="pill rojo">🔺 +${cambio.toFixed(1)}%</span>`;
    else if (rec < ini) pill = `<span class="pill verde">🔻 ${cambio.toFixed(1)}%</span>`;
    else pill = '<span class="pill gris">➡️ igual</span>';
    return `<div class="linea"><div><b>${escapar(e.nombre)}</b><small>${dinero(ini)} → ${dinero(rec)}</small></div>${pill}</div>`;
  }).join('') : '<div class="vacio">No hay productos con más de una compra en este rango</div>';

  document.getElementById('cuerpo').innerHTML = `
    <div class="kpis">
      ${kpi('🛒', 'azul', dinero(tg.total), 'Total comprado')}
      ${kpi('🧾', 'morado', tg.num_compras, 'Compras registradas')}
      ${kpi('🚚', 'amarillo', data.por_proveedor.length, 'Proveedores')}
    </div>
    <div class="rejilla-2">
      ${tarjeta('🚚 Gasto por proveedor', proveedores)}
      ${tarjeta('📊 Evolución de costo <small class="conteo" style="font-weight:500;display:block;">Primera vs. última compra en el rango</small>', evolucion, { sinPad: true, lista: true })}
    </div>`;
}

// ---------- Clientes ----------
function renderClientes(data) {
  const deuda = data.mayor_deuda.length ? data.mayor_deuda.map((c) => {
    const saldo = parseFloat(c.saldo_actual || 0), limite = parseFloat(c.limite_credito || 0);
    const uso = limite > 0 ? Math.min(100, saldo / limite * 100) : null;
    const clase = uso === null ? '' : (uso >= 90 ? 'roja' : (uso >= 70 ? 'amarilla' : ''));
    return `<div class="linea">
      <div style="flex:1;min-width:0;"><b>${escapar(c.nombre)}</b>
        ${uso === null ? '<small>Sin límite de crédito</small>' : `<div class="prog ${clase}" style="margin-top:6px;"><i style="width:${uso.toFixed(0)}%"></i></div>`}</div>
      <div style="text-align:right;flex:none;"><b class="num rojo-t">${dinero(saldo)}</b>${uso === null ? '' : `<small>de ${dinero(limite)} · ${uso.toFixed(0)}%</small>`}</div>
    </div>`;
  }).join('') : '<div class="vacio">Sin clientes con deuda activa</div>';

  const frecuentes = data.mas_frecuentes.length ? data.mas_frecuentes.map((c, i) => `<div class="rank">
      <div class="no">${i + 1}</div>
      <div class="info"><b>${escapar(c.nombre)}</b><small>${c.num_tickets} ${Number(c.num_tickets) === 1 ? 'ticket' : 'tickets'}</small></div>
      <div class="monto num">${dinero(c.total_comprado)}</div></div>`).join('')
    : '<div class="vacio">Sin compras a crédito en este rango</div>';

  document.getElementById('cuerpo').innerHTML = `
    <div class="kpis">
      ${kpi('💳', 'rojo', dinero(data.deuda_activa_total), 'Deuda activa total', 'peligro')}
      ${kpi('💵', 'verde', dinero(data.abonos_rango.total), 'Abonos recibidos', 'destaca')}
    </div>
    <div class="rejilla-2">
      ${tarjeta('⚠️ Clientes con mayor deuda', deuda, { sinPad: true, lista: true })}
      ${tarjeta('⭐ Clientes más frecuentes <small class="conteo" style="font-weight:500;display:block;">Compras a crédito en el rango</small>', frecuentes, { sinPad: true })}
    </div>
    <p class="nota">Nota: "más frecuentes" solo cuenta compras pagadas como Fiado — no hay forma de identificar al cliente en ventas de contado, ya que esas no piden asociar un cliente.</p>`;
}

// ---------- Exportar ----------
async function exportarCSV() {
  try {
    const token = getToken();
    const respuesta = await fetch(`${API_URL}/reportes/ventas/exportar-csv${construirQueryFechas()}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!respuesta.ok) throw new Error('No se pudo generar el archivo CSV');
    const blob = await respuesta.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ventas-${formatearFechaInput(new Date())}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    mostrarToast('CSV descargado', 'exito');
  } catch (err) {
    mostrarToast(err.message, 'error');
  }
}

// ============ Pérdidas y cancelaciones ============
function etiquetaPeriodo(clave, gran) {
  const [a, m, d] = clave.split('-');
  return gran === 'mes' ? MESES_CORTOS[parseInt(m, 10) - 1] + ' ' + a.slice(2) : parseInt(d, 10) + ' ' + MESES_CORTOS[parseInt(m, 10) - 1];
}
function fechaHora(f) {
  const d = new Date(f);
  if (!f || isNaN(d)) return escapar(f || '');
  return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }).replace('.', '') + ' · ' + d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });
}

// Gráfica de barras en SVG. series: [{valores:[...], color, nombre}] (apiladas o agrupadas)
function dibujarBarras(contenedor, etiquetas, series, formato, agrupado) {
  const el = document.getElementById(contenedor);
  const W = Math.max(300, Math.min(760, el.clientWidth || 760));
  const H = 240, mi = W < 480 ? 46 : 52, md = 8, ms = 12, mb = 30;
  const n = etiquetas.length;
  const totales = etiquetas.map((_, i) => agrupado ? Math.max(...series.map((x) => x.valores[i] || 0)) : series.reduce((s, x) => s + (x.valores[i] || 0), 0));
  const max = Math.max(...totales, 0);
  if (!n || max === 0) {
    el.innerHTML = '<div class="vacio">Sin datos en este periodo 🎉</div>';
    return;
  }
  // Eje Y con números "redondos"
  const paso0 = max / 4, mag = Math.pow(10, Math.floor(Math.log10(paso0)));
  const paso = [1, 2, 2.5, 5, 10].map((f) => f * mag).find((v) => v >= paso0);
  const tope = Math.ceil(max / paso) * paso;
  const alto = H - ms - mb, ancho = W - mi - md, bw = ancho / n;
  const y = (v) => ms + alto - (v / tope) * alto;
  let g = '';
  for (let v = 0; v <= tope + 1e-9; v += paso) {
    g += `<line x1="${mi}" x2="${W - md}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(128,128,128,.28)"/><text x="${mi - 6}" y="${y(v) + 4}" text-anchor="end">${formato(v)}</text>`;
  }
  const cadaN = Math.ceil(n / Math.max(3, Math.floor(ancho / 56)));
  etiquetas.forEach((et, i) => {
    let acum = 0;
    const base = mi + i * bw + bw * 0.15, wTot = Math.max(2, bw * 0.7);
    const wBarra = agrupado ? wTot / series.length : wTot;
    let tip = et + '\n';
    series.forEach((sr) => { tip += sr.nombre + ': ' + formato(sr.valores[i] || 0) + '\n'; });
    series.forEach((sr, k) => {
      const v = sr.valores[i] || 0;
      const x = agrupado ? base + k * wBarra : base;
      const desde0 = agrupado ? 0 : acum;
      if (v > 0) { g += `<rect x="${x}" y="${y(desde0 + v)}" width="${Math.max(1, wBarra - (agrupado ? 1 : 0))}" height="${Math.max(1, y(desde0) - y(desde0 + v))}" fill="${sr.color}" rx="2"><title>${escapar(tip)}</title></rect>`; }
      acum += v;
    });
    if (i % cadaN === 0) g += `<text x="${mi + i * bw + bw / 2}" y="${H - 10}" text-anchor="middle">${escapar(et)}</text>`;
  });
  el.innerHTML = `<svg class="grafica-svg" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

function renderPerdidas(data) {
  datosPerdidas = data;
  const r = data.resumen, gran = data.granularidad;
  const leyenda = (items) => `<div class="leyenda">${items.map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;
  const grafica = (id, titulo, ley, opts) => tarjeta(titulo, `${ley ? leyenda(ley) : ''}<div id="${id}"></div>`, opts || {});

  const sumaMotivos = data.motivos.reduce((s, m) => s + m.monto, 0);
  const motivosBarras = barrasH(data.motivos.map((m) => ({
    nombre: m.motivo || 'Sin motivo', valor: m.monto, color: '#F2A33A', texto: dinero(m.monto), subTexto: pct(m.monto, sumaMotivos)
  })), 'Sin datos en este periodo');
  const sumaEmp = data.por_usuario.reduce((s, u) => s + u.monto, 0);
  const empBarras = barrasH(data.por_usuario.map((u) => ({
    nombre: u.usuario || 'Sin nombre', valor: u.monto, color: '#D64545', texto: dinero(u.monto), subTexto: pct(u.monto, sumaEmp)
  })), 'Sin datos en este periodo');

  const filaTxt = (nom, sub, monto) => `<div class="linea"><div><b>${escapar(nom)}</b><small>${sub}</small></div><b class="num">${monto}</b></div>`;
  const tMotivos = data.motivos.length ? data.motivos.map((m) => filaTxt(m.motivo || 'Sin motivo', `${m.cancelaciones} cancelaciones · ${m.devoluciones} devoluciones`, dinero(m.monto))).join('') : '<div class="vacio">Sin datos</div>';
  const tEmp = data.por_usuario.length ? data.por_usuario.map((u) => filaTxt(u.usuario || 'Sin nombre', `${u.cancelaciones} cancelaciones · ${u.devoluciones} devoluciones`, dinero(u.monto))).join('') : '<div class="vacio">Sin datos</div>';
  const tProd = data.top_productos.length ? data.top_productos.map((p) => filaTxt(p.nombre_producto, `${cant(p.cantidad)} piezas`, dinero(p.monto))).join('') : '<div class="vacio">Sin datos</div>';
  const tCanc = data.ultimas_cancelaciones.length ? data.ultimas_cancelaciones.map((c) => filaTxt(c.folio, `${fechaHora(c.fecha)} · ${escapar(c.usuario || '—')} · ${escapar(c.motivo || '—')}`, dinero(c.total))).join('') : '<div class="vacio">Sin cancelaciones 🎉</div>';
  const lista = (t) => `<div class="lista-simple">${t}</div>`;

  document.getElementById('cuerpo').innerHTML = `
    <div class="kpis">
      ${kpi('💸', 'rojo', dinero(r.total_perdido), 'Total perdido (cancelado + devuelto)', 'peligro')}
      ${kpi('🚫', 'rojo', r.cancelaciones, 'Tickets cancelados · ' + dinero(r.monto_cancelado))}
      ${kpi('↩️', 'amarillo', r.devoluciones, 'Devoluciones · ' + dinero(r.monto_devuelto))}
      ${kpi('🎟️', 'azul', r.fichas_canceladas, 'Fichas canceladas (clientes no atendidos)')}
      ${kpi('📉', 'morado', r.porcentaje_sobre_ventas.toFixed(1) + '%', 'Pérdida sobre lo que se movió (vendido + perdido)')}
    </div>
    <div class="rejilla-2">
      ${grafica('graficaVentasVsPerdidas', 'Ventas cobradas vs. dinero perdido', [['#5FAE46', 'Ventas cobradas'], ['#D64545', 'Perdido (cancelado + devuelto)']], { ancha: true })}
      ${grafica('graficaDinero', 'Dinero perdido por periodo', [['#D64545', 'Tickets cancelados'], ['#F2A33A', 'Devoluciones']])}
      ${grafica('graficaFichas', 'Fichas: atendidas vs. canceladas', [['#5FAE46', 'Atendidas'], ['#4A7FD6', 'Canceladas (no atendidas)']])}
      ${grafica('graficaHoras', '¿A qué hora se cancela más?', [['#D64545', 'Tickets cancelados por hora del día']])}
      ${tarjeta('Motivos que más dinero cuestan', motivosBarras)}
      ${tarjeta('Dinero perdido por empleado', empBarras)}
      ${tarjeta('Motivos más frecuentes', lista(tMotivos), { sinPad: true })}
      ${tarjeta('Por empleado', lista(tEmp), { sinPad: true })}
      ${tarjeta('Productos de tickets cancelados', lista(tProd), { sinPad: true })}
      ${tarjeta('Últimas cancelaciones', lista(tCanc), { sinPad: true })}
    </div>`;

  const et = data.serie.map((f) => etiquetaPeriodo(f.clave, gran));
  dibujarBarras('graficaDinero', et, [
    { nombre: 'Cancelados', color: '#D64545', valores: data.serie.map((f) => f.monto_cancelado) },
    { nombre: 'Devoluciones', color: '#F2A33A', valores: data.serie.map((f) => f.monto_devuelto) }
  ], dineroCorto);
  dibujarBarras('graficaVentasVsPerdidas', et, [
    { nombre: 'Ventas cobradas', color: '#5FAE46', valores: data.serie.map((f) => f.ventas) },
    { nombre: 'Perdido', color: '#D64545', valores: data.serie.map((f) => f.monto_cancelado + f.monto_devuelto) }
  ], dineroCorto, true);
  dibujarBarras('graficaFichas', et, [
    { nombre: 'Atendidas', color: '#5FAE46', valores: data.serie.map((f) => f.fichas_atendidas) },
    { nombre: 'Canceladas', color: '#4A7FD6', valores: data.serie.map((f) => f.fichas) }
  ], (v) => String(Math.round(v)));
  dibujarBarras('graficaHoras', data.por_hora.map((h) => h.hora + 'h'), [
    { nombre: 'Cancelaciones', color: '#D64545', valores: data.por_hora.map((h) => h.cancelaciones) }
  ], (v) => String(Math.round(v)));
}

// Al girar el celular o cambiar el tamaño, las gráficas se vuelven a dibujar al ancho nuevo
let anchoAnterior = window.innerWidth, temporizador;
window.addEventListener('resize', () => {
  clearTimeout(temporizador);
  temporizador = setTimeout(() => {
    if (window.innerWidth !== anchoAnterior && tabReporteActual === 'perdidas' && datosPerdidas) renderPerdidas(datosPerdidas);
    anchoAnterior = window.innerWidth;
  }, 250);
});

filtroRapido('hoy');
</script>
