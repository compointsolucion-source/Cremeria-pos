<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos - Cremería POS</title>
<link rel="stylesheet" href="../css/app-theme.css">
<script src="../js/tema.js"></script>
<style>
  .contenido { max-width: 800px; margin: 20px auto; padding: 0 14px; }
  .tabla-productos { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
  .tabla-productos th, .tabla-productos td { padding: 10px; text-align: left; border-bottom: 1px solid #EEE; font-size: 14px; }
  .tabla-productos img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }
  .form-producto { display: grid; gap: 10px; margin-bottom: 20px; }
  .preview-img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; background: #EEE; }
  .fila-doble { display: flex; gap: 10px; }
  .fila-doble > * { flex: 1; }
  .fila-triple { display: flex; gap: 10px; }
  .fila-triple > * { flex: 1; }
  .tipo-tag { font-size: 11px; padding: 2px 8px; border-radius: 8px; color: white; }
  .tag-peso { background: #1565C0; }
  .tag-unidad { background: #6A1B9A; }
  .seccion-titulo { font-weight: 700; font-size: 14px; margin-top: 10px; color: #555; }
  .buscando-externo { font-size: 12px; color: #888; }
  .btn-cargar-mas { margin-top: 10px; }
  .btn-mas-opciones {
    background: none; border: none; color: var(--primary, #2E7D32); font-weight: 600;
    font-size: 14px; text-align: left; padding: 6px 0; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <h1>🖼️ Productos</h1>
    <a class="btn btn-secondary" href="dashboard.html">🏠 Inicio</a>
    <button class="btn btn-secondary" onclick="cerrarSesion()">Salir</button>
  </div>

  <div class="contenido">
    <div class="card form-producto">
      <h3 id="tituloFormulario">Nuevo producto</h3>

      <input type="text" id="codigoBarras" placeholder="Código de barras (escanéalo o escríbelo)" onblur="buscarCodigoExterno()">
      <div id="estadoBusquedaExterna" class="buscando-externo"></div>

      <input type="text" id="nombre" placeholder="Descripción / Nombre del producto">

      <div class="fila-triple">
        <select id="tipoVenta">
          <option value="peso">A granel (usa decimales, por kg)</option>
          <option value="unidad">Por unidad / pieza</option>
        </select>
        <select id="categoriaId"><option value="">Sin departamento</option></select>
      </div>

      <input type="number" id="precio" placeholder="Precio de venta *" step="0.01">

      <div style="display:flex; align-items:center; gap:12px;">
        <img id="previewImg" class="preview-img" src="">
        <input type="file" id="imagenInput" accept="image/*">
      </div>

      <button type="button" class="btn-mas-opciones" onclick="toggleMasOpciones()">
        <span id="flechaMasOpciones">▸</span> Más opciones (costo, ganancia %, mayoreo, inventario, favorito)
      </button>

      <div id="masOpcionesProducto" style="display:none; gap:10px; flex-direction:column;">
        <div class="seccion-titulo">Precios</div>
        <div class="fila-triple">
          <input type="number" id="precioCosto" placeholder="Precio costo" step="0.01" oninput="calcularPrecioVenta()">
          <input type="number" id="gananciaPorcentaje" placeholder="Ganancia %" step="0.01" oninput="calcularPrecioVenta()">
        </div>
        <input type="number" id="precioMayoreo" placeholder="Precio mayoreo (opcional)" step="0.01">

        <div class="seccion-titulo">Inventario</div>
        <label><input type="checkbox" id="usaInventario" checked onchange="toggleCamposInventario()"> Este producto SÍ utiliza inventario</label>
        <div class="fila-triple" id="camposInventario">
          <input type="number" id="existenciaInicial" placeholder="Hay (existencia inicial)" step="0.01">
          <input type="number" id="stockMinimo" placeholder="Mínimo" step="0.01">
          <input type="number" id="stockMaximo" placeholder="Máximo" step="0.01">
        </div>

        <label><input type="checkbox" id="favorito"> Marcar como favorito (aparece primero en Mostrador)</label>
      </div>

      <button class="btn btn-primary" id="btnGuardarProducto" onclick="guardarProducto()">Guardar Producto</button>
      <button class="btn btn-secondary" id="btnCancelarEdicion" style="display:none;" onclick="cancelarEdicion()">Cancelar Edición</button>
    </div>

    <h3>Catálogo actual</h3>
    <input type="text" id="buscadorCatalogo" placeholder="🔍 Buscar producto por nombre o código para editar..." style="margin-bottom:10px;" oninput="filtrarTablaCatalogo()">
    <table class="tabla-productos">
      <thead><tr><th>Imagen</th><th>Nombre</th><th>Tipo</th><th>Precio</th><th>Código</th><th>Acciones</th></tr></thead>
      <tbody id="tablaBody"></tbody>
    </table>
  </div>

  <div class="modal-overlay" id="modalPromociones" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:100;">
    <div class="card" style="width:90%; max-width:420px;">
      <h3 id="nombreProductoPromo"></h3>
      <p style="font-size:13px; color:#666;">Precio normal: $<span id="precioNormalPromo"></span> — Costo: $<span id="costoPromo">N/D</span></p>

      <div id="listaEscalones" style="margin-bottom:14px;"></div>

      <div class="fila-doble" style="display:flex; gap:8px; margin-bottom:8px;">
        <input type="number" id="cantidadMinimaNueva" placeholder="A partir de (ej. 6)" step="0.01">
        <input type="number" id="precioPromoNuevo" placeholder="Precio promo" step="0.01">
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="agregarEscalon()">Agregar escalón</button>
      <button class="btn btn-secondary" style="width:100%; margin-top:8px;" onclick="cerrarModalPromociones()">Cerrar</button>
    </div>
  </div>

<script src="../js/api.js"></script>
<script src="../js/estado-conexion.js"></script>
<script src="../js/ui-components.js"></script>
<script src="../js/imagen-utils.js"></script>
<script>
requiereLogin();
let imagenBase64 = '';
let productoEditandoId = null;

function abrirEdicion(p) {
  productoEditandoId = p.id;
  document.getElementById('tituloFormulario').textContent = `Editando: ${p.nombre}`;
  document.getElementById('btnGuardarProducto').textContent = 'Guardar Cambios';
  document.getElementById('btnCancelarEdicion').style.display = 'inline-block';

  document.getElementById('codigoBarras').value = p.codigo_barras || '';
  document.getElementById('nombre').value = p.nombre || '';
  document.getElementById('tipoVenta').value = p.tipo_venta || 'peso';
  document.getElementById('categoriaId').value = p.categoria_id || '';
  document.getElementById('precioCosto').value = p.precio_costo || '';
  document.getElementById('gananciaPorcentaje').value = p.ganancia_porcentaje || '';
  document.getElementById('precio').value = p.precio || '';
  document.getElementById('precioMayoreo').value = p.precio_mayoreo || '';
  document.getElementById('usaInventario').checked = p.usa_inventario !== false;
  toggleCamposInventario();
  document.getElementById('favorito').checked = !!p.favorito;
  imagenBase64 = p.imagen_url || '';
  document.getElementById('previewImg').src = p.imagen_url || '';
  document.getElementById('estadoBusquedaExterna').textContent = '';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelarEdicion() {
  productoEditandoId = null;
  document.getElementById('tituloFormulario').textContent = 'Nuevo producto';
  document.getElementById('btnGuardarProducto').textContent = 'Guardar Producto';
  document.getElementById('btnCancelarEdicion').style.display = 'none';
  limpiarFormulario();
}

function limpiarFormulario() {
  document.getElementById('nombre').value = '';
  document.getElementById('precio').value = '';
  document.getElementById('precioCosto').value = '';
  document.getElementById('gananciaPorcentaje').value = '';
  document.getElementById('precioMayoreo').value = '';
  document.getElementById('codigoBarras').value = '';
  document.getElementById('categoriaId').value = '';
  document.getElementById('existenciaInicial').value = '';
  document.getElementById('stockMinimo').value = '';
  document.getElementById('stockMaximo').value = '';
  document.getElementById('favorito').checked = false;
  document.getElementById('usaInventario').checked = true;
  toggleCamposInventario();
  document.getElementById('estadoBusquedaExterna').textContent = '';
  document.getElementById('previewImg').src = '';
  imagenBase64 = '';
}

function toggleMasOpciones() {
  const panel = document.getElementById('masOpcionesProducto');
  const abierto = panel.style.display === 'flex';
  panel.style.display = abierto ? 'none' : 'flex';
  document.getElementById('flechaMasOpciones').textContent = abierto ? '▸' : '▾';
}

let catalogoCompleto = [];

function filtrarTablaCatalogo() {
  const texto = document.getElementById('buscadorCatalogo').value.trim().toLowerCase();
  const filas = document.querySelectorAll('#tablaBody tr');
  filas.forEach(fila => {
    const coincide = fila.dataset.nombre.includes(texto) || (fila.dataset.codigo && fila.dataset.codigo.includes(texto));
    fila.style.display = coincide ? '' : 'none';
  });
}

function toggleCamposInventario() {
  document.getElementById('camposInventario').style.display = document.getElementById('usaInventario').checked ? 'flex' : 'none';
}

function calcularPrecioVenta() {
  const costo = parseFloat(document.getElementById('precioCosto').value || 0);
  const ganancia = parseFloat(document.getElementById('gananciaPorcentaje').value || 0);
  if (costo > 0 && ganancia > 0) {
    const precioCalculado = costo * (1 + ganancia / 100);
    document.getElementById('precio').value = precioCalculado.toFixed(2);
  }
}

// Al salir del campo de código de barras, busca en TU catálogo primero (por si
// ya existe) y si no, en Open Food Facts (productos comerciales conocidos).
async function buscarCodigoExterno() {
  const codigo = document.getElementById('codigoBarras').value.trim();
  const estado = document.getElementById('estadoBusquedaExterna');
  if (!codigo || codigo.length < 6) { estado.textContent = ''; return; }

  estado.textContent = 'Buscando...';
  try {
    const productoPropio = await apiFetch(`/productos/codigo/${codigo}`);
    estado.textContent = `⚠️ Ya tienes este código dado de alta: "${productoPropio.nombre}"`;
    return;
  } catch (err) {
    // No está en tu catálogo — sigue buscando en la base pública, es normal.
  }

  try {
    const externo = await apiFetch(`/productos/buscar-externo/${codigo}`);
    if (externo.nombre) document.getElementById('nombre').value = externo.nombre;
    if (externo.imagen_url) {
      imagenBase64 = externo.imagen_url;
      document.getElementById('previewImg').src = externo.imagen_url;
    }
    estado.textContent = '✅ Autocompletado desde base de datos pública (Open Food Facts)';
  } catch (err) {
    estado.textContent = 'No se encontró en la base de datos pública — captura los datos a mano';
  }
}

document.getElementById('imagenInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const comprimida = await comprimirImagen(file);
    document.getElementById('previewImg').src = comprimida; // vista previa inmediata
    mostrarToast('Subiendo imagen...', 'info');
    imagenBase64 = await subirImagenACloudinary(comprimida, 'productos');
  } catch (err) {
    mostrarToast('No se pudo procesar la imagen: ' + err.message, 'error');
  }
});

async function cargarCategorias() {
  const cats = await apiFetch('/departamentos');
  const select = document.getElementById('categoriaId');
  select.innerHTML = '<option value="">Sin departamento</option>' + cats.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
}

let productosOffsetActual = 0;
const PRODUCTOS_POR_PAGINA = 30;

async function cargarProductos(reiniciar = true) {
  if (reiniciar) {
    productosOffsetActual = 0;
    document.getElementById('tablaBody').innerHTML = '';
  }

  const data = await apiFetch(`/productos?limit=${PRODUCTOS_POR_PAGINA}&offset=${productosOffsetActual}`);
  const tbody = document.getElementById('tablaBody');

  data.productos.forEach(p => {
    const tag = p.tipo_venta === 'unidad'
      ? '<span class="tipo-tag tag-unidad">Pieza</span>'
      : '<span class="tipo-tag tag-peso">Kg</span>';
    const precioLabel = p.tipo_venta === 'unidad' ? `$${parseFloat(p.precio).toFixed(2)}/pza` : `$${parseFloat(p.precio).toFixed(2)}/kg`;
    const tr = document.createElement('tr');
    tr.dataset.nombre = p.nombre.toLowerCase();
    tr.dataset.codigo = (p.codigo_barras || '').toLowerCase();
    tr.innerHTML = `
      <td><img src="${p.imagen_url || ''}"></td>
      <td>${p.nombre}</td>
      <td>${tag}</td>
      <td>${precioLabel}</td>
      <td>${p.codigo_barras || '—'}</td>
      <td>
        <button class="btn btn-secondary" onclick='abrirEdicion(${JSON.stringify(p).replace(/'/g, "&#39;")})'>✏️ Editar</button>
        <button class="btn btn-secondary" onclick="abrirPromociones(${p.id}, '${p.nombre.replace(/'/g, "\\'")}', ${p.precio}, ${p.precio_costo || 'null'})">🏷️ Promos</button>
        <button class="btn btn-secondary" onclick="eliminarProducto(${p.id})">Eliminar</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  productosOffsetActual += data.productos.length;

  let botonCargarMas = document.getElementById('btnCargarMasProductos');
  if (productosOffsetActual < data.total) {
    if (!botonCargarMas) {
      botonCargarMas = document.createElement('button');
      botonCargarMas.id = 'btnCargarMasProductos';
      botonCargarMas.className = 'btn btn-secondary btn-cargar-mas';
      botonCargarMas.textContent = 'Cargar más productos';
      botonCargarMas.onclick = () => cargarProductos(false);
      tbody.parentElement.after(botonCargarMas);
    }
  } else if (botonCargarMas) {
    botonCargarMas.remove();
  }
}

async function guardarProducto() {
  const nombre = document.getElementById('nombre').value.trim();
  const precio = parseFloat(document.getElementById('precio').value || 0);
  const categoria_id = document.getElementById('categoriaId').value || null;
  const favorito = document.getElementById('favorito').checked;
  const tipo_venta = document.getElementById('tipoVenta').value;
  const codigo_barras = document.getElementById('codigoBarras').value.trim() || null;
  const precio_costo = parseFloat(document.getElementById('precioCosto').value || 0) || null;
  const ganancia_porcentaje = parseFloat(document.getElementById('gananciaPorcentaje').value || 0) || null;
  const precio_mayoreo = parseFloat(document.getElementById('precioMayoreo').value || 0) || null;
  const usa_inventario = document.getElementById('usaInventario').checked;

  if (!nombre || precio <= 0) { mostrarToast('Descripción y precio de venta son obligatorios', 'error'); return; }

  try {
    if (productoEditandoId) {
      await apiFetch(`/productos/${productoEditandoId}`, {
        method: 'PUT',
        body: JSON.stringify({
          nombre, precio, categoria_id, imagen_url: imagenBase64 || null, favorito, tipo_venta, codigo_barras,
          precio_costo, ganancia_porcentaje, precio_mayoreo, usa_inventario
        })
      });
      mostrarToast('Producto actualizado', 'exito');
      cancelarEdicion();
    } else {
      const existencia_inicial = parseFloat(document.getElementById('existenciaInicial').value || 0) || 0;
      const stock_minimo = parseFloat(document.getElementById('stockMinimo').value || 0) || 0;
      const stock_maximo = parseFloat(document.getElementById('stockMaximo').value || 0) || null;

      await apiFetch('/productos', {
        method: 'POST',
        body: JSON.stringify({
          nombre, precio, categoria_id, imagen_url: imagenBase64, favorito, tipo_venta, codigo_barras,
          precio_costo, ganancia_porcentaje, precio_mayoreo, usa_inventario,
          existencia_inicial, stock_minimo, stock_maximo
        })
      });
      mostrarToast('Producto guardado', 'exito');
      limpiarFormulario();
    }
    cargarProductos();
  } catch (err) {
    mostrarToast(err.message, 'error');
  }
}

async function eliminarProducto(id) {
  const confirmado = await confirmarAccion('¿Eliminar este producto?');
  if (!confirmado) return;
  try {
    await apiFetch(`/productos/${id}`, { method: 'DELETE' });
    cargarProductos();
  } catch (err) {
    mostrarToast(err.message, 'error');
  }
}

let productoPromoActual = null;

async function abrirPromociones(id, nombre, precio, costo) {
  productoPromoActual = { id, nombre, precio, costo };
  document.getElementById('nombreProductoPromo').textContent = `Promociones: ${nombre}`;
  document.getElementById('precioNormalPromo').textContent = parseFloat(precio).toFixed(2);
  document.getElementById('costoPromo').textContent = costo ? parseFloat(costo).toFixed(2) : 'N/D';
  document.getElementById('modalPromociones').style.display = 'flex';
  await cargarEscalones();
}

function cerrarModalPromociones() {
  document.getElementById('modalPromociones').style.display = 'none';
  cargarProductos();
}

async function cargarEscalones() {
  try {
    const escalones = await apiFetch(`/promociones/${productoPromoActual.id}`);
    document.getElementById('listaEscalones').innerHTML = escalones.map(e => {
      const margen = productoPromoActual.costo ? (parseFloat(e.precio_promocional) - parseFloat(productoPromoActual.costo)).toFixed(2) : 'N/D';
      return `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #EEE; font-size:14px;">
          <span>${e.cantidad_minima}+ unidades → $${parseFloat(e.precio_promocional).toFixed(2)} <small style="color:#888;">(margen: $${margen})</small></span>
          <button onclick="eliminarEscalon(${e.id})" style="background:none; border:none; color:#C62828; font-size:16px;">✕</button>
        </div>
      `;
    }).join('') || '<p style="color:#888; font-size:13px;">Sin escalones configurados todavía</p>';
  } catch (err) {
    mostrarToast(err.message, 'error');
  }
}

async function agregarEscalon() {
  const cantidad_minima = parseFloat(document.getElementById('cantidadMinimaNueva').value || 0);
  const precio_promocional = parseFloat(document.getElementById('precioPromoNuevo').value || 0);

  if (cantidad_minima <= 0 || precio_promocional <= 0) { mostrarToast('Completa ambos campos con valores mayores a 0', 'error'); return; }

  try {
    await apiFetch(`/promociones/${productoPromoActual.id}`, {
      method: 'POST',
      body: JSON.stringify({ cantidad_minima, precio_promocional })
    });
    document.getElementById('cantidadMinimaNueva').value = '';
    document.getElementById('precioPromoNuevo').value = '';
    mostrarToast('Escalón agregado', 'exito');
    cargarEscalones();
  } catch (err) {
    mostrarToast(err.message, 'error');
  }
}

async function eliminarEscalon(id) {
  const confirmado = await confirmarAccion('¿Eliminar este escalón de precio?');
  if (!confirmado) return;
  try {
    await apiFetch(`/promociones/escalon/${id}`, { method: 'DELETE' });
    cargarEscalones();
  } catch (err) {
    mostrarToast(err.message, 'error');
  }
}

cargarCategorias();
cargarProductos();
</script>
</body>
</html>
