<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambiar Contraseña - Cremería POS</title>
<link rel="stylesheet" href="../css/app-theme.css">
<script src="../js/tema.js"></script>
<style>
  .contenido { max-width: 420px; margin: 40px auto; padding: 0 14px; }
  .form-pass { display: grid; gap: 10px; }
  #mensaje { font-size: 14px; min-height: 18px; }
  #mensaje.error { color: #C62828; }
  #mensaje.exito { color: #2E7D32; }
</style>
</head>
<body>
  <div class="top-bar">
    <h1>🔒 Cambiar Contraseña</h1>
    <button class="btn btn-secondary" onclick="cerrarSesion()">Salir</button>
  </div>

  <div class="contenido card form-pass">
    <input type="password" id="passwordActual" placeholder="Contraseña actual" autocomplete="current-password">
    <input type="password" id="passwordNueva" placeholder="Nueva contraseña (mínimo 6 caracteres)" autocomplete="new-password">
    <input type="password" id="passwordConfirmar" placeholder="Confirmar nueva contraseña" autocomplete="new-password">
    <div id="mensaje"></div>
    <button class="btn btn-primary" onclick="cambiarPassword()">Guardar Nueva Contraseña</button>
  </div>

<script src="../js/api.js"></script>
<script src="../js/estado-conexion.js"></script>
<script>
requiereLogin();

async function cambiarPassword() {
  const actual = document.getElementById('passwordActual').value;
  const nueva = document.getElementById('passwordNueva').value;
  const confirmar = document.getElementById('passwordConfirmar').value;
  const mensajeDiv = document.getElementById('mensaje');
  mensajeDiv.className = '';
  mensajeDiv.textContent = '';

  if (!actual || !nueva || !confirmar) {
    mensajeDiv.className = 'error';
    mensajeDiv.textContent = 'Completa los tres campos';
    return;
  }
  if (nueva !== confirmar) {
    mensajeDiv.className = 'error';
    mensajeDiv.textContent = 'La nueva contraseña y su confirmación no coinciden';
    return;
  }

  try {
    await apiFetch('/auth/cambiar-password', {
      method: 'PUT',
      body: JSON.stringify({ password_actual: actual, password_nueva: nueva })
    });
    mensajeDiv.className = 'exito';
    mensajeDiv.textContent = 'Contraseña actualizada correctamente';
    document.getElementById('passwordActual').value = '';
    document.getElementById('passwordNueva').value = '';
    document.getElementById('passwordConfirmar').value = '';
  } catch (err) {
    mensajeDiv.className = 'error';
    mensajeDiv.textContent = err.message;
  }
}
</script>
</body>
</html>
