<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#2E7D32">
<title>Panel de Administración - Cremería POS</title>
<link rel="stylesheet" href="../css/app-theme.css">
<link rel="stylesheet" href="../css/sidebar.css">
<script src="../js/tema.js"></script>
<style>
  body { background: #F5F6F8; }

  .contenido { max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ---------- Encabezados de sección: consistentes en todo el panel ---------- */
  .titulo-seccion {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: #8A8D93; margin: 0 0 10px; padding-left: 2px;
  }

  /* ---------- Tarjetas de métricas (KPIs) ---------- */
  .tarjetas-metricas { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .tarjeta-metrica {
    background: white; border-radius: 12px; padding: 16px 18px; border: 1px solid #EBECEF;
  }
  .tarjeta-metrica .valor { font-size: 22px; font-weight: 700; line-height: 1.2; color: #1F2023; }
  .tarjeta-metrica .etiqueta { font-size: 12.5px; color: #7A7D83; margin-top: 4px; font-weight: 500; }
  .tarjeta-utilidad .valor { color: #2E7D32; }
  .tarjeta-fiado .valor { color: #C77700; }
  .tarjeta-alerta { background: #FDF3F3; border-color: #F6D9D9; }
  .tarjeta-alerta .valor { color: #C62828; }

  .seccion-dashboard { margin-bottom: 22px; }

  /* ---------- Contenedor blanco genérico (ventas por hora, alertas, actividad) ---------- */
  .lista-alerta { background: white; border-radius: 12px; padding: 6px 16px; border: 1px solid #EBECEF; }

  .barra-hora { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 13px; }
  .barra-hora .etiqueta-hora { width: 42px; color: #8A8D93; font-weight: 500; }
  .barra-hora .barra-fondo { flex: 1; background: #F0F1F3; border-radius: 6px; height: 16px; overflow: hidden; }
  .barra-hora .barra-relleno { background: #2E7D32; height: 100%; border-radius: 6px; }
  .barra-hora .monto-hora { width: 74px; text-align: right; font-weight: 600; color: #1F2023; }

  .fila-alerta { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #F2F3F5; font-size: 13.5px; }
  .fila-alerta:last-child { border-bottom: none; }

  .fila-actividad { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #F2F3F5; font-size: 13.5px; gap: 10px; }
  .fila-actividad:last-child { border-bottom: none; }
  .fila-actividad > span:first-child { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fila-actividad > span:last-child { color: #8A8D93; font-size: 12.5px; flex-shrink: 0; }
  .tag-actividad { font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 5px; color: white; flex-shrink: 0; }
  .tag-venta { background: #2E7D32; }
  .tag-compra { background: #1565C0; }
  .tag-abono { background: #C77700; }
  .tag-merma, .tag-ajuste_manual { background: #C62828; }

  .sin-datos { color: #ABAEB3; font-size: 13px; text-align: center; padding: 16px 0; }

</style>
</head>
<body>
  <div class="top-bar">
    <div style="display:flex; align-items:center;">
      <button class="btn-abrir-sidebar" onclick="abrirSidebarMovil()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1>⚙️ Administración</h1>
    </div>
    <button class="btn btn-secondary" onclick="cerrarSesion()">Salir</button>
  </div>

  <div class="contenido">
    <div class="tarjetas-metricas" id="tarjetasMetricas"></div>

    <div class="seccion-dashboard">
      <p class="titulo-seccion">Ventas de hoy por hora</p>
      <div id="ventasPorHora" class="lista-alerta"></div>
    </div>

    <div class="seccion-dashboard" id="seccionAlertas" style="display:none;">
      <p class="titulo-seccion">⚠️ Alertas</p>
      <div id="listaAlertas" class="lista-alerta"></div>
    </div>

    <div class="seccion-dashboard">
      <p class="titulo-seccion">Actividad reciente</p>
      <div id="listaActividad" class="lista-alerta"></div>
    </div>

  </div>

<script src="../js/api.js"></script>
<script src="../js/estado-conexion.js"></script>
<script>
requiereLogin();

const nombresTipoActividad = { venta: 'Venta', compra: 'Compra', abono: 'Abono', merma: 'Merma', ajuste_manual: 'Ajuste' };

async function cargarDashboard() {
  try {
    const data = await apiFetch('/dashboard/resumen');
    renderTarjetas(data);
    renderVentasPorHora(data.ventas_por_hora);
    renderAlertas(data);
    renderActividad(data.actividad_reciente);
  } catch (err) {
    console.error(err);
  }
}

function renderTarjetas(data) {
  const cont = document.getElementById('tarjetasMetricas');
  cont.innerHTML = `
    <div class="tarjeta-metrica">
      <div class="valor">$${parseFloat(data.ventas_hoy.total).toFixed(2)}</div>
      <div class="etiqueta">Ventas de Hoy</div>
    </div>
    <div class="tarjeta-metrica">
      <div class="valor">${data.ventas_hoy.num_tickets}</div>
      <div class="etiqueta">Tickets Hoy</div>
    </div>
    <div class="tarjeta-metrica tarjeta-utilidad">
      <div class="valor">$${data.utilidad_hoy.ganancia.toFixed(2)}</div>
      <div class="etiqueta">Utilidad Estimada*</div>
    </div>
    <div class="tarjeta-metrica tarjeta-fiado">
      <div class="valor">$${data.fiado_total.toFixed(2)}</div>
      <div class="etiqueta">Fiado Pendiente</div>
    </div>
    <div class="tarjeta-metrica ${data.stock_bajo.length > 0 ? 'tarjeta-alerta' : ''}">
      <div class="valor">${data.stock_bajo.length}</div>
      <div class="etiqueta">Stock Bajo</div>
    </div>
    <div class="tarjeta-metrica ${data.agotados.length > 0 ? 'tarjeta-alerta' : ''}">
      <div class="valor">${data.agotados.length}</div>
      <div class="etiqueta">Agotados</div>
    </div>
  `;
}

function renderVentasPorHora(porHora) {
  const cont = document.getElementById('ventasPorHora');
  if (!porHora || porHora.length === 0) {
    cont.innerHTML = '<div class="sin-datos">Sin ventas registradas hoy todavía</div>';
    return;
  }
  const maxTotal = Math.max(...porHora.map(h => parseFloat(h.total)));
  cont.innerHTML = porHora.map(h => {
    const porcentaje = maxTotal > 0 ? (parseFloat(h.total) / maxTotal) * 100 : 0;
    const horaTexto = `${String(h.hora).padStart(2, '0')}:00`;
    return `
      <div class="barra-hora">
        <span class="etiqueta-hora">${horaTexto}</span>
        <div class="barra-fondo"><div class="barra-relleno" style="width:${porcentaje}%"></div></div>
        <span class="monto-hora">$${parseFloat(h.total).toFixed(2)}</span>
      </div>
    `;
  }).join('');
}

const LIMITE_ALERTAS_INICIAL = 5;

function filaAlertaHTML(a) {
  if (a.tipo === 'agotado') return `<div class="fila-alerta"><span>🔴 ${a.nombre}</span><span>Agotado</span></div>`;
  if (a.tipo === 'stock_bajo') return `<div class="fila-alerta"><span>🟡 ${a.nombre}</span><span>${parseFloat(a.existencia_actual).toFixed(2)} / mín. ${parseFloat(a.stock_minimo).toFixed(2)}</span></div>`;
  return `<div class="fila-alerta"><span>💳 ${a.nombre}</span><span>$${parseFloat(a.saldo_actual).toFixed(2)} / $${parseFloat(a.limite_credito).toFixed(2)}</span></div>`;
}

function renderAlertas(data) {
  const todas = [
    ...data.agotados.map(p => ({ tipo: 'agotado', ...p })),
    ...data.stock_bajo.map(p => ({ tipo: 'stock_bajo', ...p })),
    ...data.creditos_cerca_limite.map(c => ({ tipo: 'credito', ...c }))
  ];

  document.getElementById('seccionAlertas').style.display = todas.length > 0 ? 'block' : 'none';
  if (todas.length === 0) return;

  const visibles = todas.slice(0, LIMITE_ALERTAS_INICIAL);
  const ocultas = todas.slice(LIMITE_ALERTAS_INICIAL);

  let html = visibles.map(filaAlertaHTML).join('');

  if (ocultas.length > 0) {
    html += `
      <div id="filasAlertasOcultas" style="display:none;">${ocultas.map(filaAlertaHTML).join('')}</div>
      <div style="padding:10px 0; text-align:center;">
        <a href="#" onclick="event.preventDefault(); mostrarMasAlertas(this);" style="font-size:13px; color:var(--primary); font-weight:600; text-decoration:none;">
          Ver ${ocultas.length} más
        </a>
      </div>
    `;
  }

  document.getElementById('listaAlertas').innerHTML = html;
}

function mostrarMasAlertas(enlace) {
  document.getElementById('filasAlertasOcultas').style.display = 'block';
  enlace.parentElement.remove();
}

const LIMITE_ACTIVIDAD_INICIAL = 6;

function filaActividadHTML(a) {
  return `
    <div class="fila-actividad">
      <span><span class="tag-actividad tag-${a.tipo}">${nombresTipoActividad[a.tipo] || a.tipo}</span>${a.referencia}</span>
      <span>${new Date(a.fecha).toLocaleString()}</span>
    </div>
  `;
}

function renderActividad(actividad) {
  const cont = document.getElementById('listaActividad');
  if (!actividad || actividad.length === 0) {
    cont.innerHTML = '<div class="sin-datos">Sin actividad reciente</div>';
    return;
  }

  const visibles = actividad.slice(0, LIMITE_ACTIVIDAD_INICIAL);
  const ocultos = actividad.slice(LIMITE_ACTIVIDAD_INICIAL);

  cont.innerHTML = visibles.map(filaActividadHTML).join('');

  if (ocultos.length > 0) {
    cont.innerHTML += `
      <div id="filasActividadOcultas" style="display:none;">${ocultos.map(filaActividadHTML).join('')}</div>
      <div style="padding:10px 0; text-align:center;">
        <a href="#" onclick="event.preventDefault(); mostrarMasActividad(this);" style="font-size:13px; color:var(--primary); font-weight:600; text-decoration:none;">
          Ver ${ocultos.length} más
        </a>
      </div>
    `;
  }
}

function mostrarMasActividad(enlace) {
  document.getElementById('filasActividadOcultas').style.display = 'block';
  enlace.parentElement.remove();
}

cargarDashboard();
</script>
<script src="../js/sidebar-nav.js"></script>
</body>
</html>
