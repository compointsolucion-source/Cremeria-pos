<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../favicon.ico">
<meta name="theme-color" content="#5FAE46">
<title>Solicitudes de Factura - Compoint Punto</title>
<link rel="stylesheet" href="../css/app-theme.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/vistas-admin.css">
<script src="../js/tema.js"></script>
<style>
  .columnas { --ancho-panel: 480px; }
  .franja { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .franja .acciones { display: flex; gap: 6px; flex-wrap: wrap; }
  .franja code { font-family: Consolas, monospace; font-size: 12.5px; }
  .ajustes { margin-bottom: 12px; padding: 14px; display: none; gap: 10px; }
  .ajustes.abierto { display: grid; }
  .ajustes .enlace { display: flex; gap: 8px; }
  .ajustes .enlace input { flex: 1; min-width: 0; }
  .ajustes .opcion-check { padding: 6px 2px; }
  .fila .info small.rfc { font-family: Consolas, monospace; }
  .fila .der b { display: block; font-size: 16px; }
  .fila .der .pill { margin-top: 3px; }
  .dato .cod { font-weight: 700; }
  .items-ticket { font-size: 13px; color: var(--muted, #7A7D83); padding-top: 6px; }
  .items-ticket div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .seg button.est-pendiente.activo { color: #8A5A00; }
  .seg button.est-facturada.activo { color: #2E7D32; }
  .seg button.est-rechazada.activo { color: #B71C1C; }
  textarea { resize: vertical; }
</style>
</head>
<body>
  <div class="top-bar">
    <div style="display:flex; align-items:center; gap:4px;"><button class="btn-abrir-sidebar" onclick="abrirSidebarMovil()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1>🧾 Solicitudes de Factura</h1></div>
    <button class="btn btn-secondary" onclick="exportarCsv()">⬇️&nbsp;<span class="solo-pc">Exportar&nbsp;</span>CSV</button>
    <a class="btn btn-secondary" href="dashboard.html">🏠 Inicio</a>
    <button class="btn btn-secondary" onclick="cerrarSesion()">Salir</button>
  </div>

  <div class="contenido">
    <div class="caja franja" id="franja" style="padding:10px 14px;"></div>

    <div class="caja ajustes" id="ajustes">
      <div>
        <div style="font-size:13px; color:var(--muted); margin-bottom:4px;">Enlace de la página donde tus clientes piden su factura:</div>
        <div class="enlace">
          <input type="text" id="enlacePublico" readonly>
          <button class="btn btn-secondary" onclick="copiarTexto(document.getElementById('enlacePublico').value, 'Enlace copiado')">Copiar</button>
        </div>
      </div>
      <label class="opcion-check"><span>Recibir solicitudes de factura en línea</span><input type="checkbox" class="interruptor" id="ajActiva"></label>
      <label class="opcion-check"><span>Días permitidos para facturar un ticket (0 = sin límite)</span><input type="number" id="ajDias" min="0" max="365" style="width:90px;"></label>
      <label class="opcion-check"><span>Imprimir en el ticket final: “Solicita tu factura en…” con un QR</span><input type="checkbox" class="interruptor" id="ajLeyenda"></label>
      <button class="btn btn-primary" onclick="guardarAjustes()">Guardar ajustes</button>
    </div>

    <div class="columnas">

      <!-- ================= Lista ================= -->
      <div class="caja recorta">
        <div class="pestanas" id="tabs"></div>
        <div class="barra">
          <div class="buscar"><input type="text" id="buscar" placeholder="Buscar por folio, RFC, nombre o correo…" oninput="buscarConRetraso()"></div>
          <button class="btn btn-secondary btn-chico" onclick="cargar()">🔄 Actualizar</button>
        </div>
        <div id="lista"></div>
      </div>

      <!-- ================= Detalle (en celular sale desde abajo) ================= -->
      <div class="caja panel-form" id="panelForm">
        <div class="panel-cab">
          <h3 id="panelTitulo">📄 Detalle de la solicitud</h3>
          <button class="btn btn-secondary btn-chico cerrar-hoja" onclick="cerrarHoja()">✕</button>
        </div>
        <div class="panel-cuerpo" id="panelCuerpo"></div>
        <div class="panel-pie" id="panelPie" style="display:none;">
          <button class="btn btn-primary btn-grande" onclick="guardarSolicitud()">💾 Guardar</button>
        </div>
      </div>
    </div>
  </div>
  <div class="fondo-hoja" id="fondoHoja" onclick="cerrarHoja()"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/estado-conexion.js"></script>
<script src="../js/ui-components.js"></script>
<script src="../js/sidebar-nav.js"></script>
<script>
requiereLogin();

let filtroEstado = 'pendiente';
let solicitudes = [];
let resumen = { pendiente: 0, facturada: 0, rechazada: 0 };
let catalogos = { regimenes: {}, usos: {} };
let temporizadorBusqueda = null;
let abierta = null;            // solicitud abierta en el panel
let estadoElegido = 'pendiente';
let ajustes = { activa: true, dias: 30 };
const esAngosto = window.matchMedia('(max-width: 1000px)');
const ETIQUETA = { pendiente: 'Pendiente', facturada: 'Facturada', rechazada: 'Rechazada' };
const COLOR = { pendiente: 'amarillo', facturada: 'verde', rechazada: 'rojo' };

const escapar = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dinero = (n) => '$' + Number(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fechaCorta = (f) => f ? new Date(f).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' }) : '—';

function copiarTexto(texto, mensaje) {
  const listo = () => mostrarToast(mensaje || 'Copiado', 'exito', 1500);
  if (navigator.clipboard) navigator.clipboard.writeText(texto).then(listo, () => mostrarToast('No se pudo copiar', 'error'));
  else { const t = document.createElement('textarea'); t.value = texto; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); listo(); }
}
// Botones "📋": llevan el texto a copiar en data-copiar (así no hay problemas con comillas).
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-copiar]');
  if (b) copiarTexto(b.dataset.copiar, b.dataset.msg);
});

// ---------- Hoja (celular) ----------
function abrirHoja() {
  document.getElementById('panelForm').classList.add('abierto');
  document.getElementById('fondoHoja').classList.add('abierto');
  document.body.classList.add('hoja-abierta');
}
function cerrarHoja() {
  document.getElementById('panelForm').classList.remove('abierto');
  document.getElementById('fondoHoja').classList.remove('abierto');
  document.body.classList.remove('hoja-abierta');
}

// ---------- Lista ----------
function pintarTabs() {
  const defs = [['pendiente', 'Pendientes'], ['facturada', 'Facturadas'], ['rechazada', 'Rechazadas'], ['', 'Todas']];
  const total = resumen.pendiente + resumen.facturada + resumen.rechazada;
  document.getElementById('tabs').innerHTML = defs.map(([k, t]) =>
    `<button class="${filtroEstado === k ? 'activa' : ''}" onclick="filtroEstado='${k}'; cargar()">${t}<i>${k ? resumen[k] : total}</i></button>`).join('');
}

function pintarLista() {
  const cont = document.getElementById('lista');
  if (!solicitudes.length) {
    cont.innerHTML = `<div class="vacio">${filtroEstado === 'pendiente' ? '🎉 No hay solicitudes pendientes.' : 'No hay solicitudes para mostrar.'}</div>`;
    return;
  }
  cont.innerHTML = solicitudes.map(s => `
    <div class="fila ${abierta && abierta.id === s.id ? 'sel' : ''}" onclick="abrirDetalle(${s.id})">
      <div class="info">
        <b>${escapar(s.razon_social)}</b>
        <small class="rfc">${escapar(s.rfc)}</small>
        <small>Folio ${escapar(s.folio)} · ${fechaCorta(s.creado_en)}${s.tiene_constancia ? ' · 📎' : ''}</small>
      </div>
      <div class="der"><b class="num">${dinero(s.total)}</b><span class="pill ${COLOR[s.estado]}">${ETIQUETA[s.estado]}</span></div>
    </div>`).join('');
}

async function cargar() {
  try {
    const q = document.getElementById('buscar').value.trim();
    const params = new URLSearchParams();
    if (filtroEstado) params.set('estado', filtroEstado);
    if (q) params.set('q', q);
    const r = await apiFetch('/facturacion?' + params.toString());
    solicitudes = r.solicitudes; resumen = r.resumen;
    pintarTabs(); pintarLista();
  } catch (err) { mostrarToast(err.message, 'error'); }
}

function buscarConRetraso() { clearTimeout(temporizadorBusqueda); temporizadorBusqueda = setTimeout(cargar, 300); }

// ---------- Detalle ----------
function filaDato(etiqueta, valor, copia) {
  const v = valor === null || valor === undefined || valor === '' ? '—' : String(valor);
  const aCopiar = copia === undefined ? v : copia;   // copia: lo que se copia (si no es el mismo texto) o false
  const boton = aCopiar !== false && v !== '—'
    ? `<button class="mini" title="Copiar" data-copiar="${escapar(aCopiar)}" data-msg="${escapar(etiqueta)} copiado">📋</button>` : '';
  return `<div class="linea dato"><div><small>${escapar(etiqueta)}</small><span style="font-weight:600; word-break:break-word;">${escapar(v)}</span></div>${boton}</div>`;
}

function pintarVacioPanel() {
  abierta = null;
  document.getElementById('panelTitulo').textContent = '📄 Detalle de la solicitud';
  document.getElementById('panelCuerpo').innerHTML = '<div class="vacio-panel"><div class="gran">🧾</div>Elige una solicitud de la lista para ver los datos fiscales de tu cliente y marcarla como facturada.</div>';
  document.getElementById('panelPie').style.display = 'none';
}

async function abrirDetalle(id) {
  try {
    const s = await apiFetch('/facturacion/' + id);
    abierta = s;
    estadoElegido = s.estado;
    const t = s.ticket || {};
    document.getElementById('panelTitulo').textContent = `📄 Solicitud #${s.id}`;
    document.getElementById('panelCuerpo').innerHTML = `
      <div class="entre" style="align-items:flex-start;">
        <div style="min-width:0;">
          <div style="font-weight:800; font-size:16px; word-break:break-word;">${escapar(s.razon_social)}</div>
          <div class="conteo">Ticket <b>${escapar(s.folio)}</b> · ${dinero(s.total)} · ${fechaCorta(s.creado_en)}</div>
        </div>
        <span class="pill ${COLOR[s.estado]}">${ETIQUETA[s.estado]}</span>
      </div>

      <div class="bloque blanco" style="gap:0; padding-top:4px; padding-bottom:4px;">
        <h5 style="padding-top:8px;">Datos fiscales</h5>
        ${filaDato('RFC', s.rfc)}
        ${filaDato('Nombre o razón social', s.razon_social)}
        ${filaDato('Código postal fiscal', s.codigo_postal)}
        ${filaDato('Régimen fiscal', s.regimen_fiscal + ' — ' + (catalogos.regimenes[s.regimen_fiscal] || ''), s.regimen_fiscal)}
        ${filaDato('Uso de la factura', s.uso_cfdi + ' — ' + (catalogos.usos[s.uso_cfdi] || ''), s.uso_cfdi)}
        ${filaDato('Correo', s.correo)}
        ${filaDato('Teléfono', s.telefono)}
      </div>

      <div class="bloque blanco" style="gap:0; padding-top:4px; padding-bottom:10px;">
        <h5 style="padding-top:8px;">Ticket</h5>
        ${filaDato('Folio', s.folio)}
        ${filaDato('Total', dinero(s.total), false)}
        ${filaDato('Pagado el', fechaCorta(t.fecha_pago), false)}
        ${filaDato('Forma de pago', t.metodo_pago, false)}
        <div class="items-ticket">${(s.items || []).map(i => `<div><span>${Number(i.cantidad)} × ${escapar(i.nombre_producto)}</span><span>${dinero(i.subtotal)}</span></div>`).join('')}</div>
      </div>

      <div class="bloque">
        <div class="entre"><span>📎 <b>Constancia de situación fiscal</b></span>
          ${s.tiene_constancia ? `<button class="btn btn-secondary btn-chico" onclick="verConstancia(${s.id})">Ver</button>` : ''}</div>
        ${s.tiene_constancia ? `<span class="ayuda conteo">${escapar(s.constancia_nombre || 'constancia')}</span>` : '<span class="conteo">El cliente no adjuntó constancia.</span>'}
      </div>

      <div class="campo"><label>Estado de la solicitud</label>
        <div class="seg" id="segEstado">
          ${['pendiente', 'facturada', 'rechazada'].map(k => `<button type="button" class="est-${k} ${estadoElegido === k ? 'activo' : ''}" onclick="ponerEstado('${k}')">${{ pendiente: '⏳ Pendiente', facturada: '✅ Facturada', rechazada: '⛔ Rechazada' }[k]}</button>`).join('')}
        </div>
      </div>
      <div class="campo"><label for="mUuid">Folio fiscal (UUID) de la factura — opcional</label><input type="text" id="mUuid" maxlength="60" value="${escapar(s.uuid_factura || '')}" placeholder="Ej. 6F2B…"></div>
      <div class="campo"><label for="mNota">Nota para el cliente <span id="notaAyuda" style="font-weight:500;"></span></label><textarea id="mNota" rows="2" maxlength="500" placeholder="Ej. El código postal no coincide con la constancia">${escapar(s.nota_admin || '')}</textarea></div>
      <div class="conteo">Recibida ${fechaCorta(s.creado_en)} · Última actualización ${fechaCorta(s.actualizado_en)}</div>`;
    ponerEstado(estadoElegido);
    document.getElementById('panelPie').style.display = '';
    pintarLista();
    if (esAngosto.matches) abrirHoja();
  } catch (err) { mostrarToast(err.message, 'error'); }
}

function ponerEstado(k) {
  estadoElegido = k;
  document.querySelectorAll('#segEstado button').forEach(b => b.classList.toggle('activo', b.classList.contains('est-' + k)));
  const ayuda = document.getElementById('notaAyuda');
  if (ayuda) ayuda.textContent = k === 'rechazada' ? '(obligatoria: el cliente verá este motivo)' : '(si rechazas, el cliente verá este motivo)';
}

async function verConstancia(id) {
  try {
    const r = await fetch(`${API_URL}/facturacion/${id}/constancia`, {
      headers: { Authorization: 'Bearer ' + getToken(), 'X-Sucursal-Id': sucursalSeleccionada() }
    });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'No se pudo abrir la constancia');
    const url = URL.createObjectURL(await r.blob());
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (err) { mostrarToast(err.message, 'error'); }
}

async function guardarSolicitud() {
  if (!abierta) return;
  const estado = estadoElegido;
  const nota = document.getElementById('mNota').value.trim();
  if (estado === 'rechazada' && !nota) { mostrarToast('Escribe el motivo del rechazo para que el cliente sepa qué corregir', 'error'); return; }
  try {
    await apiFetch('/facturacion/' + abierta.id, {
      method: 'PUT',
      body: JSON.stringify({ estado, nota_admin: nota, uuid_factura: document.getElementById('mUuid').value.trim() })
    });
    mostrarToast({ facturada: 'Marcada como facturada', rechazada: 'Solicitud rechazada', pendiente: 'Regresada a pendientes' }[estado], 'exito');
    const id = abierta.id;
    await cargar();
    if (esAngosto.matches) { cerrarHoja(); pintarVacioPanel(); }
    else await abrirDetalle(id);
  } catch (err) { mostrarToast(err.message, 'error'); }
}

function exportarCsv() {
  if (!solicitudes.length) { mostrarToast('No hay solicitudes para exportar', 'error'); return; }
  const cols = ['Fecha', 'Estado', 'Folio', 'Total', 'RFC', 'Razon social', 'Regimen', 'CP', 'Uso CFDI', 'Correo', 'Telefono', 'UUID'];
  const celda = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const filas = solicitudes.map(s => [fechaCorta(s.creado_en), s.estado, s.folio, s.total, s.rfc, s.razon_social, s.regimen_fiscal, s.codigo_postal, s.uso_cfdi, s.correo, s.telefono, s.uuid_factura].map(celda).join(','));
  const blob = new Blob(['﻿' + [cols.join(','), ...filas].join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `solicitudes-factura-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

// ---------- Ajustes ----------
function pintarFranja() {
  const enlace = location.origin + '/facturar.html';
  const dias = ajustes.dias > 0 ? `tus clientes tienen <b>${ajustes.dias} ${ajustes.dias === 1 ? 'día' : 'días'}</b> para pedir su factura` : 'sin límite de días para pedir la factura';
  const f = document.getElementById('franja');
  f.className = 'caja aviso franja ' + (ajustes.activa ? 'verde' : 'amarillo');
  f.innerHTML = `
    <span>${ajustes.activa ? `🟢 <b>Facturación activa</b> · ${dias} · <code>/facturar.html</code>` : '⏸️ <b>Facturación apagada</b> — tus clientes no pueden pedir factura en línea.'}</span>
    <span class="acciones">
      <button class="btn btn-secondary btn-chico" onclick="copiarTexto('${enlace}', 'Enlace copiado')">📋 Copiar enlace</button>
      <button class="btn btn-secondary btn-chico" onclick="document.getElementById('ajustes').classList.toggle('abierto')">⚙️ Ajustes</button>
    </span>`;
}

async function cargarAjustes() {
  document.getElementById('enlacePublico').value = location.origin + '/facturar.html';
  try {
    const c = await apiFetch('/configuracion');
    document.getElementById('ajActiva').checked = c.facturacion_activa !== false;
    document.getElementById('ajDias').value = c.facturacion_dias_limite === undefined || c.facturacion_dias_limite === null ? 30 : c.facturacion_dias_limite;
    document.getElementById('ajLeyenda').checked = !!c.facturacion_leyenda_ticket;
  } catch (err) { /* los ajustes quedan con sus valores por defecto */ }
  leerAjustes();
}

function leerAjustes() {
  ajustes = { activa: document.getElementById('ajActiva').checked, dias: parseInt(document.getElementById('ajDias').value || 0, 10) || 0 };
  pintarFranja();
}

async function guardarAjustes() {
  try {
    await apiFetch('/configuracion', {
      method: 'PUT',
      body: JSON.stringify({
        facturacion_activa: document.getElementById('ajActiva').checked,
        facturacion_dias_limite: parseInt(document.getElementById('ajDias').value || 0, 10),
        facturacion_leyenda_ticket: document.getElementById('ajLeyenda').checked
      })
    });
    leerAjustes();
    document.getElementById('ajustes').classList.remove('abierto');
    mostrarToast('Ajustes guardados', 'exito');
  } catch (err) { mostrarToast(err.message, 'error'); }
}

async function iniciar() {
  try { catalogos = await (await fetch(`${API_URL}/facturacion/publico/catalogos`)).json(); } catch (e) { /* se muestran solo las claves */ }
  pintarVacioPanel();
  pintarFranja();
  cargarAjustes();
  cargar();
  // La lista se refresca sola cada minuto (el detalle abierto no se toca).
  setInterval(() => { if (document.visibilityState === 'visible') cargar(); }, 60000);
}
iniciar();
</script>
</body>
</html>
