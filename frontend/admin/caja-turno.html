<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../favicon.ico">
<meta name="theme-color" content="#5FAE46">
<title>Corte de Caja - Compoint Punto</title>
<link rel="stylesheet" href="../css/app-theme.css">
<link rel="stylesheet" href="../css/sidebar.css">
<script src="../js/tema.js"></script>
<style>
  .contenido { max-width: 500px; margin: 20px auto; padding: 0 14px; }
  .saldo-actual { background: #2A2B2E; color: white; border-radius: 14px; padding: 20px; text-align: center; margin-bottom: 16px; }
  .saldo-actual .monto { font-size: 32px; font-weight: 700; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { flex: 1; }
  .tabs button.activo { background: #5FAE46; color: white; }
  .movimiento-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #EEE; font-size: 14px; }
  .ingreso { color: #5FAE46; }
  .egreso { color: #C62828; }
</style>
</head>
<body>
  <div class="top-bar">
    <div style="display:flex; align-items:center; gap:4px;"><button class="btn-abrir-sidebar" onclick="abrirSidebarMovil()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1>📊 Corte de Caja</h1></div>
    <button class="btn btn-secondary" onclick="abrirBuscadorCortes()">🔍 Buscar corte</button>
    <a class="btn btn-secondary" href="dashboard.html">🏠 Inicio</a>
    <button class="btn btn-secondary" onclick="cerrarSesion()">Salir</button>
  </div>

  <div class="contenido">
    <div id="sinTurno" style="display:none;">
      <div class="card">
        <h3>No hay turno abierto</h3>
        <p style="font-size:13px; color:#777; margin:6px 0 10px;">Al abrir el turno declaras el efectivo que hay en caja.</p>
        <button class="btn btn-primary" style="width:100%;" onclick="abrirTurno()">🔓 Abrir Turno</button>
      </div>
    </div>

    <div id="conTurno" style="display:none;">
      <div class="saldo-actual">
        <div>Turno abierto desde <span id="fechaApertura"></span></div>
        <div class="monto">Fondo inicial: $<span id="fondoInicialLbl"></span></div>
      </div>

      <div class="tabs">
        <button class="btn btn-secondary activo" id="tabIngreso" onclick="cambiarTab('ingreso')">➕ Ingreso</button>
        <button class="btn btn-secondary" id="tabEgreso" onclick="cambiarTab('egreso')">➖ Egreso</button>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <input type="number" id="montoMovimiento" placeholder="Monto" style="margin-bottom:8px;">
        <input type="text" id="conceptoMovimiento" placeholder="Concepto (ej. compra de bolsas)" style="margin-bottom:8px;">
        <button class="btn btn-primary" style="width:100%;" onclick="registrarMovimiento()">Registrar</button>
      </div>

      <h4>Movimientos de hoy</h4>
      <div id="listaMovimientos"></div>

      <button class="btn btn-secondary" style="width:100%; margin-top:14px;" onclick="imprimirCorteActual()">🖨️ Imprimir corte parcial (X)</button>
      <button class="btn btn-danger" style="width:100%; margin-top:10px;" onclick="realizarCorte()">🔒 Realizar Corte de Turno</button>
    </div>

    <h4 style="margin-top:26px;" id="tituloCortes">Cortes anteriores</h4>
    <div id="listaCortes" style="font-size:14px;"></div>
  </div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/estado-conexion.js"></script>
<script src="../js/ui-components.js"></script>
<script src="../js/impresora-termica.js"></script>
<script src="../js/turno-caja.js"></script>
<script>
requiereLogin();
let turnoActual = null;
let tipoMovimiento = 'ingreso';

async function cargarTurno() {
  try {
    turnoActual = await apiFetch('/turnos/actual');
    if (!turnoActual) {
      document.getElementById('sinTurno').style.display = 'block';
      document.getElementById('conTurno').style.display = 'none';
    } else {
      document.getElementById('sinTurno').style.display = 'none';
      document.getElementById('conTurno').style.display = 'block';
      document.getElementById('fechaApertura').textContent = new Date(turnoActual.fecha_apertura).toLocaleString();
      document.getElementById('fondoInicialLbl').textContent = parseFloat(turnoActual.fondo_inicial).toFixed(2);
      cargarMovimientos();
    }
  } catch (err) {
    mostrarToast(err.message, 'error');
  }
}

async function abrirTurno() {
  const turno = await abrirTurnoConDeclaracion();
  if (turno) cargarTurno();
}

function cambiarTab(tipo) {
  tipoMovimiento = tipo;
  document.getElementById('tabIngreso').classList.toggle('activo', tipo === 'ingreso');
  document.getElementById('tabEgreso').classList.toggle('activo', tipo === 'egreso');
}

async function registrarMovimiento() {
  const monto = parseFloat(document.getElementById('montoMovimiento').value || 0);
  const concepto = document.getElementById('conceptoMovimiento').value.trim();
  if (monto <= 0) { mostrarToast('Ingresa un monto válido', 'error'); return; }

  try {
    await apiFetch('/movimientos', {
      method: 'POST',
      body: JSON.stringify({ turno_id: turnoActual.id, tipo: tipoMovimiento, monto, concepto })
    });
    document.getElementById('montoMovimiento').value = '';
    document.getElementById('conceptoMovimiento').value = '';
    cargarMovimientos();
  } catch (err) {
    mostrarToast(err.message, 'error');
  }
}

async function cargarMovimientos() {
  try {
    const movs = await apiFetch(`/movimientos/turno/${turnoActual.id}`);
    const cont = document.getElementById('listaMovimientos');
    cont.innerHTML = '';
    movs.forEach(m => {
      const div = document.createElement('div');
      div.className = 'movimiento-row';
      div.innerHTML = `
        <span>${m.concepto || '(sin concepto)'}</span>
        <span class="${m.tipo}">${m.tipo === 'ingreso' ? '+' : '-'}$${parseFloat(m.monto).toFixed(2)}</span>
      `;
      cont.appendChild(div);
    });
  } catch (err) {
    console.error(err);
  }
}

async function imprimirCorteActual() {
  try {
    await imprimirCorteTurno(turnoActual.id);
  } catch (err) {
    mostrarToast(err.message, 'error');
  }
}

async function realizarCorte() {
  const declarado = await declararImportes({
    titulo: '🔒 Corte de turno — declaración de caja',
    subtitulo: 'Cuenta lo que hay en caja y captura el importe de cada forma de pago.'
  });
  if (!declarado) return;
  if (!(await confirmarAccion('¿Confirmas el cierre de turno con estos importes? Esta acción no se puede deshacer.'))) return;

  const { dolares_usd, ...resto } = declarado;
  const declaracion = { ...resto };
  if (dolares_usd !== undefined) declaracion.dolares_usd = dolares_usd;

  try {
    const resultado = await apiFetch(`/turnos/${turnoActual.id}/cerrar`, {
      method: 'POST',
      body: JSON.stringify({ declaracion })
    });
    const dif = resultado.corte.declaracion.diferencia;
    const texto = Math.abs(dif) < 0.005 ? 'Caja cuadrada ✅' : (dif > 0 ? `Sobrante: $${dif.toFixed(2)}` : `Faltante: $${Math.abs(dif).toFixed(2)}`);
    mostrarToast(`Corte realizado. ${texto}`, Math.abs(dif) < 0.005 ? 'exito' : 'info', 7000);
    try {
      await imprimirCorteTurno(resultado.id);
    } catch (err) {
      mostrarToast('El corte se guardó, pero no se pudo imprimir: ' + err.message + ' — puedes reimprimirlo abajo en "Cortes anteriores".', 'error', 8000);
    }
    cargarTurno();
    cargarCortes();
  } catch (err) {
    mostrarToast(err.message, 'error');
  }
}

async function cargarCortes() {
  try {
    if (!esSupervisorUI()) document.getElementById('tituloCortes').textContent = 'Mis cortes anteriores';
    const turnos = (await apiFetch('/turnos/historial')).filter(t => t.estado === 'cerrado').slice(0, 5);
    const cont = document.getElementById('listaCortes');
    if (turnos.length === 0) { cont.innerHTML = '<p style="color:#888;">Aún no hay cortes.</p>'; return; }
    cont.innerHTML = turnos.map(t => {
      const dif = t.declaracion ? t.declaracion.diferencia : (t.saldo_contado - t.saldo_teorico);
      const txt = Math.abs(dif) < 0.005 ? 'cuadrada' : (dif > 0 ? `sobrante $${dif.toFixed(2)}` : `faltante $${Math.abs(dif).toFixed(2)}`);
      return `<div class="movimiento-row">
        <span>Turno ${t.id} · ${new Date(t.fecha_cierre).toLocaleString()}<br><small style="color:#888;">${t.usuario_nombre} · ${txt}</small></span>
        <button class="btn btn-secondary" onclick="reimprimirCorte(${t.id})">🖨️</button>
      </div>`;
    }).join('');
  } catch (err) {
    console.error(err);
  }
}

async function reimprimirCorte(id) {
  try { await imprimirCorteTurno(id); } catch (err) { mostrarToast(err.message, 'error'); }
}

// ===== Buscador de cortes (estilo Soft Restaurant) =====
function esSupervisorUI() {
  const u = getUsuario();
  return !!u && ['jefe_general', 'dueno', 'gerente'].includes(u.rol);
}

function abrirBuscadorCortes() {
  const hoy = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const colsGuardadas = localStorage.getItem('corte_columnas') || '40';
  const ov = document.createElement('div');
  ov.id = 'ovBuscarCorte';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:12px;';
  ov.innerHTML = `<div style="background:#fff;border-radius:12px;padding:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto;">
    <h3 style="margin:0 0 12px;">Corte de Caja — Buscar</h3>
    <label>Fecha desde</label><input type="date" id="bcDesde" value="${hoy}" style="margin-bottom:8px;">
    <label>Fecha hasta</label><input type="date" id="bcHasta" value="${hoy}" style="margin-bottom:8px;">
    ${esSupervisorUI() ? '<label>Cajero</label><select id="bcCajero" style="margin-bottom:8px;"><option value="">Todos</option></select>' : '<select id="bcCajero" style="display:none;"><option value=""></option></select>'}
    <label>Turno</label><select id="bcTurno" style="margin-bottom:8px;"><option value="">— Busca primero —</option></select>
    <button class="btn btn-secondary" style="width:100%;margin-bottom:10px;" onclick="buscarTurnosCorte()">🔍 Buscar turnos</button>
    <label>Destino</label>
    <select id="bcDestino" style="margin-bottom:8px;">
      <option value="impresora">Impresora</option><option value="pantalla">Pantalla</option><option value="excel">Excel (CSV)</option>
    </select>
    <label>Ancho de ticket</label>
    <select id="bcCols" style="margin-bottom:14px;">
      ${[32, 40, 48].map(n => `<option value="${n}" ${String(n) === colsGuardadas ? 'selected' : ''}>${n} columnas</option>`).join('')}
    </select>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary" style="flex:1;" onclick="ejecutarBusquedaCorte()">Ejecutar</button>
      <button class="btn btn-secondary" style="flex:1;" onclick="document.getElementById('ovBuscarCorte').remove()">Cerrar</button>
    </div></div>`;
  document.body.appendChild(ov);
  buscarTurnosCorte();
}

async function buscarTurnosCorte() {
  const d = document.getElementById('bcDesde').value, h = document.getElementById('bcHasta').value;
  const cajero = document.getElementById('bcCajero');
  const sel = document.getElementById('bcTurno');
  try {
    const q = new URLSearchParams({ limite: 200 });
    if (d) q.set('desde', d);
    if (h) q.set('hasta', h);
    if (cajero.value) q.set('usuario_id', cajero.value);
    const turnos = await apiFetch('/turnos/historial?' + q.toString());
    if (cajero.options.length === 1) {
      const vistos = {};
      turnos.forEach(t => { vistos[t.usuario_id] = t.usuario_nombre; });
      Object.entries(vistos).forEach(([id, n]) => cajero.add(new Option(n, id)));
    }
    window._turnosBusqueda = turnos;
    sel.innerHTML = turnos.length
      ? turnos.map(t => `<option value="${t.id}">Turno ${t.id} · ${new Date(t.fecha_apertura).toLocaleString()} · ${t.usuario_nombre}${t.estado === 'abierto' ? ' (abierto)' : ''}</option>`).join('')
      : '<option value="">Sin turnos en ese rango</option>';
  } catch (err) { mostrarToast(err.message, 'error'); }
}

async function ejecutarBusquedaCorte() {
  const id = document.getElementById('bcTurno').value;
  if (!id) { mostrarToast('Elige un turno primero', 'error'); return; }
  const destino = document.getElementById('bcDestino').value;
  const columnas = parseInt(document.getElementById('bcCols').value, 10);
  localStorage.setItem('corte_columnas', String(columnas));
  try {
    if (destino === 'impresora') {
      await imprimirCorteTurno(id, { columnas });
    } else if (destino === 'pantalla') {
      const [corte, cfg] = await Promise.all([apiFetch(`/turnos/${id}/resumen`), configNegocioTurno()]);
      const lineas = lineasCorteCaja(corte, { columnas, negocio: cfg.nombre_negocio || '' })
        .map(l => typeof l === 'string' ? l : l.t).join('\n');
      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10000;display:flex;align-items:center;justify-content:center;padding:12px;';
      const pre = document.createElement('pre');
      pre.style.cssText = 'font:13px/1.35 monospace;white-space:pre;margin:0 0 12px;overflow:auto;';
      pre.textContent = lineas;
      const caja = document.createElement('div');
      caja.style.cssText = 'background:#fff;border-radius:12px;padding:16px;max-width:96vw;max-height:92vh;overflow:auto;';
      const cerrar = document.createElement('button');
      cerrar.className = 'btn btn-secondary'; cerrar.style.width = '100%'; cerrar.textContent = 'Cerrar';
      cerrar.onclick = () => ov.remove();
      caja.append(pre, cerrar); ov.appendChild(caja); document.body.appendChild(ov);
    } else {
      const corte = await apiFetch(`/turnos/${id}/resumen`);
      descargarCorteCSV(corte);
    }
  } catch (err) { mostrarToast(err.message, 'error'); }
}

function descargarCorteCSV(c) {
  const f = (v) => '"' + String(v === null || v === undefined ? '' : v).replace(/"/g, '""') + '"';
  const filas = [['Concepto', 'Importe']];
  filas.push(['Turno', c.turno.id], ['Estado', c.turno.estado], ['Cajero', c.turno.cajero],
    ['Apertura', c.turno.fecha_apertura], ['Cierre', c.turno.fecha_cierre || '']);
  filas.push(['', ''], ['CAJA', '']);
  Object.entries(c.caja).forEach(([k, v]) => filas.push([k, v]));
  filas.push(['', ''], ['FORMAS DE PAGO', '']);
  Object.entries(c.formas).forEach(([k, v]) => filas.push([k, v]));
  filas.push(['Total formas', c.total_formas], ['', ''], ['VENTAS', '']);
  filas.push(['Subtotal', c.ventas.subtotal], ['Descuentos', c.ventas.descuentos], ['Venta neta', c.ventas.venta_neta]);
  (c.ventas.por_departamento || []).forEach(d => filas.push(['Depto: ' + (d.nombre || ''), d.monto]));
  if (c.declaracion) {
    filas.push(['', ''], ['DECLARACION', '']);
    Object.entries(c.declaracion.importes || {}).forEach(([k, v]) => filas.push(['Declarado ' + k, v]));
    filas.push(['Total declarado', c.declaracion.total_declarado], ['Total esperado', c.declaracion.total_esperado], ['Diferencia', c.declaracion.diferencia]);
  }
  const csv = '\ufeff' + filas.map(r => r.map(f).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `corte-turno-${c.turno.id}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

cargarCortes();
cargarTurno();
</script>
<script src="../js/sidebar-nav.js"></script>
</body>
</html>
