<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../favicon.ico">
<meta name="theme-color" content="#5FAE46">
<title>Equipo - Compoint Punto</title>
<link rel="stylesheet" href="../css/app-theme.css">
<link rel="stylesheet" href="../css/sidebar.css">
<link rel="stylesheet" href="../css/vistas-admin.css">
<script src="../js/tema.js"></script>
<style>
  .columnas { --ancho-panel: 450px; }
  .rol-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 9px; background: #78909C; color: #fff; vertical-align: 1px; margin-left: 4px; }
  .rol-dueno, .rol-jefe_general { background: #F9A825; color: #3B2A00; }
  .rol-gerente { background: #1565C0; }
  .rol-cajero { background: #5FAE46; }
  .rol-mostrador { background: #6A1B9A; }
  .rol-repartidor { background: #EF6C00; }
  .fila .info b { overflow-wrap: anywhere; }
  .perfil { display: flex; align-items: center; gap: 12px; }
  .perfil b { display: block; font-size: 17px; }
  .perfil small { color: var(--muted, #7A7D83); font-size: 12.5px; }
  .interruptor-fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .interruptor-fila b { display: block; font-size: 14px; }
  .interruptor-fila small { display: block; color: var(--muted, #7A7D83); font-size: 12px; }
  .titulo-permisos { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .titulo-permisos b { font-size: 14px; }
  .grupo { padding: 0; gap: 0; }
  .grupo-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; background: none; border: none; padding: 11px 12px; cursor: pointer; font-family: inherit; font-size: 14px; color: var(--text, #1F2023); text-align: left; }
  .grupo-cab small { color: var(--muted, #7A7D83); font-weight: 600; margin-left: 4px; }
  .grupo-cab .flecha { font-size: 12px; color: var(--muted, #7A7D83); transition: transform .15s; }
  .grupo.abierto .grupo-cab .flecha { transform: rotate(180deg); }
  .grupo-cuerpo { display: none; padding: 0 12px 6px; }
  .grupo.abierto .grupo-cuerpo { display: block; }
  .perm { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--border, #E4E6E9); font-size: 13.5px; cursor: pointer; }
  .perm span { min-width: 0; }
  .solo-lectura { text-align: center; padding: 26px 14px; color: var(--muted, #7A7D83); font-size: 14px; display: grid; gap: 8px; justify-items: center; }
  .btn-nuevo-pc { display: inline-block; }
  @media (max-width: 1000px) { .btn-nuevo-pc { display: none; } }
</style>
</head>
<body>
  <div class="top-bar">
    <div style="display:flex; align-items:center; gap:4px;"><button class="btn-abrir-sidebar" onclick="abrirSidebarMovil()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1>👥 Equipo</h1></div>
    <button class="btn btn-primary btn-nuevo-pc" onclick="nuevoEmpleado()">＋ Nuevo empleado</button>
  </div>

  <div class="contenido">
    <div class="columnas">
      <div class="caja recorta">
        <div class="barra">
          <div class="buscar"><input type="text" id="buscador" placeholder="Buscar empleado…" autocomplete="off" oninput="pintarLista()"></div>
          <span class="conteo" id="conteo"></span>
        </div>
        <div id="listaEquipo"><div class="vacio">Cargando…</div></div>
      </div>

      <!-- Panel (en celular sale desde abajo) -->
      <div class="caja panel-form" id="panelForm">
        <div class="panel-cab">
          <h3 id="panelTitulo">Equipo</h3>
          <button class="btn btn-secondary btn-chico cerrar-hoja" onclick="cerrarHoja()">✕</button>
        </div>
        <div class="panel-cuerpo" id="panelCuerpo"></div>
        <div class="panel-pie" id="panelPie" style="display:none;"></div>
      </div>
    </div>
  </div>

  <button class="boton-flotante" onclick="nuevoEmpleado()">＋ Nuevo</button>
  <div class="fondo-hoja" id="fondoHoja" onclick="cerrarHoja()"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/estado-conexion.js"></script>
<script src="../js/ui-components.js"></script>
<script>
requiereLogin();

const rolNombres = { jefe_general: 'Jefe general', dueno: 'Dueño', gerente: 'Gerente', cajero: 'Cajero', mostrador: 'Mostrador', repartidor: 'Repartidor' };
const ROLES_EDITABLES = ['mostrador', 'cajero', 'gerente', 'repartidor'];
const esDueno = (u) => u.rol === 'dueno' || u.rol === 'jefe_general';

// Agrupados por tema, solo para que se vean ordenados en pantalla — el
// backend es quien realmente los exige, esto es nada más presentación.
const GRUPOS_PERMISOS = {
  'Ventas': ['VENTAS_CREAR', 'VENTAS_CANCELAR', 'VENTAS_DEVOLVER', 'DESCUENTO_APLICAR'],
  'Inventario': ['INVENTARIO_VER', 'INVENTARIO_AJUSTAR', 'INVENTARIO_MERMA'],
  'Caja': ['CAJA_ABRIR', 'CAJA_CERRAR', 'CAJA_MOVIMIENTO'],
  'Reportes': ['REPORTES_VER'],
  'Productos': ['PRODUCTOS_CREAR', 'PRODUCTOS_EDITAR', 'PRODUCTOS_PRECIO'],
  'Clientes': ['CLIENTES_CREAR', 'CREDITO_ABONO'],
  'Recargas y servicios': ['RECARGAS_VENDER']
};
const ETIQUETAS_PERMISOS = {
  VENTAS_CREAR: 'Generar tickets de venta', VENTAS_CANCELAR: 'Cancelar tickets', VENTAS_DEVOLVER: 'Procesar devoluciones',
  DESCUENTO_APLICAR: 'Aplicar descuentos (>15% pide autorización aparte)',
  INVENTARIO_VER: 'Ver inventario', INVENTARIO_AJUSTAR: 'Hacer ajustes manuales', INVENTARIO_MERMA: 'Registrar mermas',
  CAJA_ABRIR: 'Abrir turno de caja', CAJA_CERRAR: 'Cerrar turno de caja', CAJA_MOVIMIENTO: 'Registrar entradas/salidas de efectivo',
  REPORTES_VER: 'Ver reportes',
  PRODUCTOS_CREAR: 'Dar de alta productos', PRODUCTOS_EDITAR: 'Editar productos existentes', PRODUCTOS_PRECIO: 'Cambiar precios',
  CLIENTES_CREAR: 'Dar de alta clientes', CREDITO_ABONO: 'Registrar abonos a crédito',
  RECARGAS_VENDER: 'Vender recargas y cobrar servicios (luz, agua, teléfono)'
};
const COLORES = ['#1565C0', '#C62828', '#2E7D32', '#8E24AA', '#EF6C00', '#00838F', '#6D4C41', '#AD1457'];

let equipo = [];
let modo = null;             // null | 'nuevo' | 'editar'
let selId = null;
let rolNuevo = 'mostrador';
const gruposAbiertos = new Set(['Ventas']);
const esAngosto = window.matchMedia('(max-width: 1000px)');

const escapar = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sinAcentos = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const iniciales = (n) => String(n || '?').trim().split(/\s+/).slice(0, 2).map((p) => p[0] || '').join('').toUpperCase() || '?';
const colorDe = (n) => COLORES[[...String(n || '')].reduce((s, c) => s + c.charCodeAt(0), 0) % COLORES.length];
const buscar = (id) => equipo.find((u) => u.id === id);

// ---------- Hoja (celular) ----------
function abrirHoja() {
  document.getElementById('panelForm').classList.add('abierto');
  document.getElementById('fondoHoja').classList.add('abierto');
  document.body.classList.add('hoja-abierta');
}
function cerrarHoja() {
  document.getElementById('panelForm').classList.remove('abierto');
  document.getElementById('fondoHoja').classList.remove('abierto');
  document.body.classList.remove('hoja-abierta');
  if (esAngosto.matches && modo) { modo = null; selId = null; pintarLista(); pintarPanel(); }
}

// ---------- Lista ----------
// Paquete contratado: cuántos usuarios incluye (lo pone Compoint). Sin paquete = sin límite.
let paqueteEquipo = null;
async function cargarPaqueteEquipo() {
  try { paqueteEquipo = (await apiFetch('/licencia')).paquete || null; } catch (e) { paqueteEquipo = null; }
}

async function cargarEquipo() {
  try {
    [equipo] = await Promise.all([apiFetch('/usuarios'), cargarPaqueteEquipo()]);
    pintarLista();
    pintarPanel();
  } catch (err) {
    mostrarToast(err.message, 'error');
    document.getElementById('listaEquipo').innerHTML = '<div class="vacio">No se pudo cargar el equipo.</div>';
  }
}

function pintarLista() {
  const q = sinAcentos(document.getElementById('buscador').value.trim());
  const visibles = equipo.filter((u) => !q || sinAcentos([u.nombre, u.usuario, u.nombre_mostrador, rolNombres[u.rol]].join(' ')).includes(q));
  const activos = equipo.filter((u) => u.activo).length;
  let textoConteo = `${equipo.length} ${equipo.length === 1 ? 'persona' : 'personas'} · ${activos} ${activos === 1 ? 'activa' : 'activas'}`;
  if (paqueteEquipo && paqueteEquipo.paquete && paqueteEquipo.max_usuarios) {
    textoConteo += ` · paquete ${paqueteEquipo.nombre}: ${paqueteEquipo.usuarios_activos != null ? paqueteEquipo.usuarios_activos : activos} de ${paqueteEquipo.max_usuarios} usuarios`;
  }
  document.getElementById('conteo').textContent = textoConteo;
  const cont = document.getElementById('listaEquipo');
  if (!visibles.length) { cont.innerHTML = `<div class="vacio">${equipo.length ? 'Nadie coincide con la búsqueda.' : 'Todavía no hay empleados.'}</div>`; return; }
  cont.innerHTML = visibles.map((u) => {
    const partes = ['@' + escapar(u.usuario)];
    if (u.nombre_mostrador) partes.push('mostrador: <strong>' + escapar(u.nombre_mostrador) + '</strong>');
    if (u.rol === 'repartidor' && u.telefono) partes.push('📞 ' + escapar(u.telefono));
    if (!u.activo) partes.push('desactivado');
    return `<div class="fila ${modo === 'editar' && selId === u.id ? 'sel' : ''} ${u.activo ? '' : 'apagada'}" onclick="seleccionar(${u.id})">
      <div class="avatar" style="background:${colorDe(u.nombre)}">${escapar(iniciales(u.nombre))}</div>
      <div class="info"><b>${escapar(u.nombre)} <span class="rol-tag rol-${escapar(u.rol)}">${escapar(rolNombres[u.rol] || u.rol)}</span></b><small>${partes.join(' · ')}</small></div>
      ${esDueno(u) ? '<span class="pill amarillo">Acceso total</span>'
        : `<input type="checkbox" class="interruptor" ${u.activo ? 'checked' : ''} title="${u.activo ? 'Desactivar' : 'Activar'}" onclick="event.stopPropagation()" onchange="alternarActivo(${u.id}, this.checked)">`}
    </div>`;
  }).join('');
}

function seleccionar(id) {
  modo = 'editar';
  selId = id;
  pintarLista();
  pintarPanel();
  if (esAngosto.matches) abrirHoja();
}

// ---------- Panel ----------
function pintarPanel() {
  const cab = document.getElementById('panelTitulo');
  const cuerpo = document.getElementById('panelCuerpo');
  const pie = document.getElementById('panelPie');
  if (modo === 'nuevo') return pintarNuevo(cab, cuerpo, pie);
  const u = modo === 'editar' ? buscar(selId) : null;
  if (!u) {
    cab.textContent = '👥 Equipo';
    pie.style.display = 'none';
    cuerpo.innerHTML = '<div class="vacio-panel"><div class="gran">👈</div>Elige a alguien de la lista para editarlo,<br>o crea un empleado nuevo.</div>';
    return;
  }
  cab.textContent = '✏️ Editando empleado';
  const perfil = `<div class="perfil"><div class="avatar grande" id="perfilAvatar" style="background:${colorDe(u.nombre)}">${escapar(iniciales(u.nombre))}</div>
    <div><b id="perfilNombre">${escapar(u.nombre)}</b><small>@<span id="perfilUsuario">${escapar(u.usuario)}</span> · usuario para entrar</small></div></div>`;
  if (esDueno(u)) {
    pie.style.display = 'none';
    cuerpo.innerHTML = perfil + `<div class="solo-lectura"><span class="rol-tag rol-${escapar(u.rol)}" style="font-size:13px;">${escapar(rolNombres[u.rol])}</span>
      Esta cuenta tiene acceso total al sistema y no se modifica desde aquí.</div>`;
    return;
  }
  const efectivos = u.permisos_efectivos || [];
  const esRepartidor = u.rol === 'repartidor';
  const enlaceRepartidor = new URL('../repartidor.html', location.href).href;
  const bloqueRepartidor = `
    <div class="campo"><label for="telefonoRepartidor">Teléfono del repartidor</label>
      <input type="tel" id="telefonoRepartidor" value="${escapar(u.telefono || '')}" placeholder="Ej. 33 1234 5678" maxlength="20" inputmode="tel" onkeydown="if (event.key === 'Enter') this.blur()" onchange="guardarTelefono(${u.id}, this)">
      <div class="ayuda">Sirve para que la tienda le mande el pedido por WhatsApp y para saber a quién llamar.</div></div>
    <div class="aviso azul">🛵 <b>Este usuario solo ve su pantalla de entregas</b> (sus pedidos, Waze / Google Maps, cobro y su corte). No puede entrar al resto del sistema, por eso no tiene permisos que ajustar.
      <br>Dirección para abrir en su celular:
      <div style="display:flex; gap:6px; margin-top:6px; align-items:center;"><input type="text" readonly value="${escapar(enlaceRepartidor)}" style="min-height:36px; font-size:13px;" onclick="this.select()">
        <button class="btn btn-secondary" style="min-height:36px; padding:4px 12px;" onclick="copiarEnlaceRepartidor()">Copiar</button></div>
      <div class="ayuda" style="margin-top:6px;">Necesita internet en su celular. Recomiéndale abrirla y elegir «Agregar a pantalla de inicio».</div></div>`;
  const bloqueDatos = `
    <div class="campo"><label for="datoNombre">Nombre</label>
      <input type="text" id="datoNombre" value="${escapar(u.nombre)}" maxlength="100" autocomplete="off" onkeydown="if (event.key === 'Enter') this.blur()" onchange="guardarDato(${u.id}, 'nombre', this)"></div>
    <div class="campo"><label for="datoUsuario">Usuario para iniciar sesión</label>
      <input type="text" id="datoUsuario" value="${escapar(u.usuario)}" maxlength="30" autocomplete="off" autocapitalize="none" onkeydown="if (event.key === 'Enter') this.blur()" onchange="guardarDato(${u.id}, 'usuario', this)">
      <div class="ayuda">Si lo cambias, esa persona debe entrar con el usuario nuevo (su contraseña sigue igual).</div></div>`;
  cuerpo.innerHTML = perfil + bloqueDatos + `
    <div class="bloque blanco"><div class="interruptor-fila">
      <div><b>Cuenta activa</b><small>Si la apagas, ya no podrá entrar</small></div>
      <input type="checkbox" class="interruptor" id="chkActivo" ${u.activo ? 'checked' : ''} onchange="alternarActivo(${u.id}, this.checked)">
    </div></div>
    <div class="campo"><label>Rol</label>
      <div class="seg">${ROLES_EDITABLES.map((r) => `<button class="${u.rol === r ? 'activo' : ''}" onclick="elegirRol(${u.id}, '${r}')">${rolNombres[r]}</button>`).join('')}</div></div>
    ${esRepartidor ? bloqueRepartidor : `
    <div class="campo"><label for="mostradorNombre">Nombre que aparece en el mostrador</label>
      <input type="text" id="mostradorNombre" value="${escapar(u.nombre_mostrador || '')}" placeholder="Ej. Mostrador 1" maxlength="40" onkeydown="if (event.key === 'Enter') this.blur()" onchange="guardarMostrador(${u.id}, this)">
      <div class="ayuda">Cuando esta persona inicie sesión en cualquier computadora, el sistema ya sabe cuál mostrador es. Déjalo vacío para quitarlo.</div></div>
    <div class="titulo-permisos"><b>Permisos</b><span class="ayuda">Se guardan al instante</span></div>
    ${Object.entries(GRUPOS_PERMISOS).map(([grupo, claves]) => {
      const on = claves.filter((c) => efectivos.includes(c)).length;
      return `<div class="bloque blanco grupo ${gruposAbiertos.has(grupo) ? 'abierto' : ''}" id="grupo-${escapar(grupo)}">
        <button class="grupo-cab" onclick="alternarGrupo('${grupo}')"><span><b>${grupo}</b><small id="cnt-${escapar(grupo)}">${on} de ${claves.length}</small></span><span class="flecha">▼</span></button>
        <div class="grupo-cuerpo">${claves.map((c) => `<label class="perm"><span>${escapar(ETIQUETAS_PERMISOS[c])}</span>
          <input type="checkbox" class="interruptor" ${efectivos.includes(c) ? 'checked' : ''} onchange="alternarPermiso(${u.id}, '${c}', this.checked, this)"></label>`).join('')}</div>
      </div>`;
    }).join('')}`}`;
  pie.style.display = '';
  pie.innerHTML = `<button class="btn btn-secondary btn-grande" onclick="restablecerPassword(${u.id})">🔑 Restablecer contraseña</button>
    <button class="btn btn-secondary btn-grande btn-peligro" onclick="eliminarEmpleado(${u.id})">🗑️ Eliminar empleado</button>`;
}

function alternarGrupo(grupo) {
  const el = document.getElementById('grupo-' + grupo);
  if (!el) return;
  const abierto = el.classList.toggle('abierto');
  if (abierto) gruposAbiertos.add(grupo); else gruposAbiertos.delete(grupo);
}

function nuevoEmpleado() {
  modo = 'nuevo';
  selId = null;
  rolNuevo = 'mostrador';
  pintarLista();
  pintarPanel();
  if (esAngosto.matches) abrirHoja();
  setTimeout(() => document.getElementById('nombreEmpleado')?.focus(), 80);
}

function pintarNuevo(cab, cuerpo, pie) {
  cab.textContent = '➕ Nuevo empleado';
  cuerpo.innerHTML = `
    <div class="campo"><label for="nombreEmpleado">Nombre completo</label><input type="text" id="nombreEmpleado" placeholder="Ej. Carlos Mendoza" autocomplete="off"></div>
    <div class="campo"><label for="usuarioEmpleado">Usuario para iniciar sesión</label><input type="text" id="usuarioEmpleado" placeholder="Ej. carlos" autocomplete="off" autocapitalize="none"></div>
    <div class="campo"><label for="passwordEmpleado">Contraseña</label><input type="password" id="passwordEmpleado" placeholder="Mínimo 6 caracteres" autocomplete="new-password" onkeydown="if (event.key === 'Enter') crearEmpleado()"></div>
    <div class="campo"><label>Rol</label>
      <div class="seg">${ROLES_EDITABLES.map((r) => `<button class="${rolNuevo === r ? 'activo' : ''}" onclick="elegirRolNuevo('${r}', this)">${rolNombres[r]}</button>`).join('')}</div></div>
    <div class="campo" id="campoTelefonoNuevo" style="display:${rolNuevo === 'repartidor' ? '' : 'none'}"><label for="telefonoEmpleado">Teléfono del repartidor</label>
      <input type="tel" id="telefonoEmpleado" placeholder="Ej. 33 1234 5678" maxlength="20" inputmode="tel" autocomplete="off"></div>
    <div class="aviso azul" id="avisoNuevo">${rolNuevo === 'repartidor' ? textoAvisoRepartidor : textoAvisoNuevo}</div>`;
  pie.style.display = '';
  pie.innerHTML = '<button class="btn btn-primary btn-grande" id="btnCrear" onclick="crearEmpleado()">Guardar empleado</button>';
}
const textoAvisoNuevo = 'Después de guardarlo podrás ajustar sus permisos y su mostrador.';
const textoAvisoRepartidor = '🛵 El repartidor entra con su usuario y contraseña desde su celular y solo ve sus entregas. Después de guardarlo te damos la dirección para su celular.';
function elegirRolNuevo(rol, boton) {
  rolNuevo = rol;
  boton.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('activo', b === boton));
  document.getElementById('campoTelefonoNuevo').style.display = rol === 'repartidor' ? '' : 'none';
  document.getElementById('avisoNuevo').textContent = rol === 'repartidor' ? textoAvisoRepartidor : textoAvisoNuevo;
}

async function guardarTelefono(id, campo) {
  const u = buscar(id);
  const nuevo = campo.value.trim();
  if (u && (u.telefono || '') === nuevo) return;
  try {
    await apiFetch(`/usuarios/${id}`, { method: 'PUT', body: JSON.stringify({ telefono: nuevo }) });
    if (u) u.telefono = nuevo;
    mostrarToast(nuevo ? 'Teléfono guardado' : 'Teléfono quitado', 'exito');
    pintarLista();
  } catch (err) {
    mostrarToast(err.message, 'error');
    campo.value = (u && u.telefono) || '';
  }
}

// Cambiar el nombre o el usuario con el que entra. Se guarda al salir del campo.
async function guardarDato(id, campo, input) {
  const u = buscar(id);
  if (!u) return;
  const nuevo = input.value.trim();
  if (nuevo === u[campo]) { input.value = nuevo; return; }
  const etiqueta = campo === 'nombre' ? 'nombre' : 'usuario';
  if (!nuevo) { mostrarToast(`El ${etiqueta} no puede quedar vacío`, 'error'); input.value = u[campo]; return; }
  if (campo === 'usuario' && /\s/.test(nuevo)) { mostrarToast('El usuario no puede llevar espacios', 'error'); input.value = u[campo]; return; }
  if (campo === 'usuario' && !(await confirmarAccion(`¿Cambiar el usuario de ${u.nombre} a «${nuevo}»? Desde ahora tendrá que entrar con ese usuario.`))) { input.value = u[campo]; return; }
  try {
    const r = await apiFetch(`/usuarios/${id}`, { method: 'PUT', body: JSON.stringify({ [campo]: nuevo }) });
    u[campo] = (r && r[campo]) || nuevo;
    input.value = u[campo];
    const pn = document.getElementById('perfilNombre'), pu = document.getElementById('perfilUsuario'), pa = document.getElementById('perfilAvatar');
    if (pn) pn.textContent = u.nombre;
    if (pu) pu.textContent = u.usuario;
    if (pa) { pa.textContent = iniciales(u.nombre); pa.style.background = colorDe(u.nombre); }
    mostrarToast(campo === 'nombre' ? 'Nombre guardado' : 'Usuario guardado', 'exito');
    pintarLista();
  } catch (err) {
    mostrarToast(err.message, 'error');
    input.value = u[campo];
  }
}

async function eliminarEmpleado(id) {
  const u = buscar(id);
  if (!u) return;
  if (!(await confirmarAccion(`¿Eliminar a ${u.nombre}? Ya no podrá entrar y desaparecerá de Equipo. Sus ventas y su historial se conservan en los reportes.`))) return;
  try {
    await apiFetch(`/usuarios/${id}`, { method: 'DELETE' });
    mostrarToast(`${u.nombre} eliminado`, 'exito');
    modo = null; selId = null;
    if (esAngosto.matches) cerrarHoja();
    await cargarEquipo();
  } catch (err) {
    mostrarToast(err.message, 'error');
  }
}

async function copiarEnlaceRepartidor() {
  const enlace = new URL('../repartidor.html', location.href).href;
  try { await navigator.clipboard.writeText(enlace); mostrarToast('Dirección copiada', 'exito'); }
  catch (e) { mostrarToast('Mantén presionada la dirección para copiarla', 'info'); }
}

// ---------- Acciones ----------
async function crearEmpleado() {
  const nombre = document.getElementById('nombreEmpleado').value.trim();
  const usuario = document.getElementById('usuarioEmpleado').value.trim();
  const password = document.getElementById('passwordEmpleado').value;
  if (!nombre || !usuario || !password) { mostrarToast('Completa todos los campos', 'error'); return; }
  if (password.length < 6) { mostrarToast('La contraseña debe tener al menos 6 caracteres', 'error'); return; }
  const btn = document.getElementById('btnCrear');
  btn.disabled = true;
  try {
    const cuerpoNuevo = { nombre, usuario, password, rol: rolNuevo };
    if (rolNuevo === 'repartidor') cuerpoNuevo.telefono = (document.getElementById('telefonoEmpleado').value || '').trim();
    const creado = await apiFetch('/usuarios', { method: 'POST', body: JSON.stringify(cuerpoNuevo) });
    mostrarToast('Empleado guardado', 'exito');
    equipo = await apiFetch('/usuarios');
    const nuevo = (creado && creado.id && buscar(creado.id)) || equipo.find((u) => u.usuario === usuario);
    if (nuevo) { modo = 'editar'; selId = nuevo.id; } else { modo = null; }
    pintarLista();
    pintarPanel();
    if (esAngosto.matches && !nuevo) cerrarHoja();
  } catch (err) {
    mostrarToast(err.message, 'error');
    btn.disabled = false;
  }
}

async function alternarActivo(id, activo) {
  try {
    await apiFetch(`/usuarios/${id}`, { method: 'PUT', body: JSON.stringify({ activo }) });
    const u = buscar(id);
    if (u) u.activo = activo;
    mostrarToast(activo ? 'Cuenta activada' : 'Cuenta desactivada', 'exito');
  } catch (err) {
    mostrarToast(err.message, 'error');
  }
  cargarEquipo();
}

async function elegirRol(id, rol) {
  const u = buscar(id);
  if (!u || u.rol === rol) return;
  if (!(await confirmarAccion(`¿Cambiar el rol de ${u.nombre} a ${rolNombres[rol]}? Sus permisos se ajustarán al nuevo rol.`))) return;
  try {
    await apiFetch(`/usuarios/${id}`, { method: 'PUT', body: JSON.stringify({ rol }) });
    mostrarToast(`Ahora es ${rolNombres[rol]}`, 'exito');
  } catch (err) {
    mostrarToast(err.message, 'error');
  }
  cargarEquipo();
}

// Al asignarle un mostrador a un empleado, cuando esa persona inicie
// sesión en cualquier computadora, el sistema ya sabe automáticamente
// cuál mostrador es — sin tener que configurarlo a mano por dispositivo.
async function guardarMostrador(id, campo) {
  const u = buscar(id);
  const nuevo = campo.value.trim();
  if (u && (u.nombre_mostrador || '') === nuevo) return;
  try {
    await apiFetch(`/usuarios/${id}`, { method: 'PUT', body: JSON.stringify({ nombre_mostrador: nuevo }) });
    if (u) u.nombre_mostrador = nuevo;
    mostrarToast(nuevo ? `Asignado a ${nuevo}` : 'Asignación de mostrador quitada', 'exito');
    pintarLista();
  } catch (err) {
    mostrarToast(err.message, 'error');
    campo.value = (u && u.nombre_mostrador) || '';
  }
}

async function alternarPermiso(id, clave, activado, input) {
  const u = buscar(id);
  try {
    await apiFetch(`/usuarios/${id}`, { method: 'PUT', body: JSON.stringify({ permisos: { [clave]: activado } }) });
    if (u) {
      const set = new Set(u.permisos_efectivos || []);
      if (activado) set.add(clave); else set.delete(clave);
      u.permisos_efectivos = [...set];
      const grupo = Object.keys(GRUPOS_PERMISOS).find((g) => GRUPOS_PERMISOS[g].includes(clave));
      const cnt = document.getElementById('cnt-' + grupo);
      if (cnt) cnt.textContent = `${GRUPOS_PERMISOS[grupo].filter((c) => set.has(c)).length} de ${GRUPOS_PERMISOS[grupo].length}`;
    }
    mostrarToast(`${ETIQUETAS_PERMISOS[clave]}: ${activado ? 'activado' : 'desactivado'}`, 'exito');
  } catch (err) {
    input.checked = !activado;
    mostrarToast(err.message, 'error');
  }
}

async function restablecerPassword(id) {
  const nueva = await solicitarTexto('Nueva contraseña para este empleado (mínimo 6 caracteres):');
  if (!nueva) return;
  if (nueva.length < 6) { mostrarToast('La contraseña debe tener al menos 6 caracteres', 'error'); return; }
  try {
    await apiFetch(`/usuarios/${id}/restablecer-password`, { method: 'PUT', body: JSON.stringify({ password_nueva: nueva }) });
    mostrarToast('Contraseña restablecida', 'exito');
  } catch (err) {
    mostrarToast(err.message, 'error');
  }
}

pintarPanel();
cargarEquipo();
