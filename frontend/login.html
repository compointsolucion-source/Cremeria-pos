<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico">
<meta name="theme-color" content="#5FAE46">
<title>Iniciar sesión - Compoint Punto</title>
<link rel="stylesheet" href="css/app-theme.css">
<script src="js/tema.js"></script>
<style>
  body { display: flex; align-items: center; justify-content: center; height: 100vh; }
  .login-box { width: 320px; }
  .login-marca { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 24px; }
  .login-marca-wordmark { display: flex; align-items: baseline; gap: 6px; }
  .login-marca-compoint { font-size: 20px; font-weight: 800; letter-spacing: 1px; color: var(--text); }
  .login-marca-punto { font-size: 20px; font-weight: 800; letter-spacing: 1.5px; color: #5FAE46; }
  .login-box input { margin-bottom: 12px; }
  #error { color: #C62828; text-align: center; font-size: 14px; min-height: 18px; }
</style>
</head>
<body>
  <div class="card login-box">
    <div class="login-marca">
      <svg width="46" height="46" viewBox="0 0 200 200" fill="none">
        <g stroke="#1A1A1A" stroke-width="4.5" opacity="0.9">
          <path d="M100 15 150 31 181 74 181 126 150 169 100 185 50 169 19 126 19 74 50 31 100 15" fill="none"/>
          <path d="M100 15 90 105 M181 74 90 105 M150 169 90 105 M50 169 90 105 M19 74 90 105"/>
          <path d="M100 15 181 126 M150 31 150 169 M100 185 19 74 M50 169 50 31 M181 74 19 126"/>
        </g>
        <g fill="#1A1A1A">
          <circle cx="100" cy="15" r="7"/><circle cx="150" cy="31" r="7"/><circle cx="181" cy="74" r="7"/>
          <circle cx="181" cy="126" r="7"/><circle cx="150" cy="169" r="7"/><circle cx="100" cy="185" r="7"/>
          <circle cx="50" cy="169" r="7"/><circle cx="19" cy="126" r="7"/><circle cx="19" cy="74" r="7"/><circle cx="50" cy="31" r="7"/>
        </g>
        <circle cx="90" cy="105" r="13" fill="#5FAE46"/>
      </svg>
      <div class="login-marca-wordmark">
        <span class="login-marca-compoint">COMPOINT</span><span class="login-marca-punto">PUNTO</span>
      </div>
    </div>
    <input type="text" id="usuario" placeholder="Usuario" autocomplete="username">
    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
    <div id="error"></div>
    <button class="btn btn-primary" style="width:100%" onclick="login()">Entrar</button>
  </div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/estado-conexion.js"></script>
<script>
async function login() {
  const usuario = document.getElementById('usuario').value.trim();
  const password = document.getElementById('password').value;
  const errorDiv = document.getElementById('error');
  errorDiv.textContent = '';

  if (!usuario || !password) {
    errorDiv.textContent = 'Ingresa usuario y contraseña';
    return;
  }

  try {
    const data = await apiFetch('/auth/login', {
      method: 'POST',
      body: JSON.stringify({ usuario, password })
    });
    localStorage.setItem('token', data.token);
    localStorage.setItem('usuario', JSON.stringify(data.usuario));

    // Redirigir según rol. jefe_general no tiene una sola sucursal fija —
    // entra primero a elegir con cuál va a trabajar (o ver el resumen de
    // todas), antes que a cualquier pantalla que ya asuma una sucursal.
    if (data.usuario.rol === 'jefe_general') window.location.href = 'admin/sucursales.html';
    else if (data.usuario.rol === 'mostrador') window.location.href = 'mostrador.html';
    else if (data.usuario.rol === 'cajero') window.location.href = 'caja.html';
    else window.location.href = 'admin/dashboard.html';
  } catch (err) {
    errorDiv.textContent = err.message;
  }
}

document.getElementById('password').addEventListener('keyup', (e) => {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
