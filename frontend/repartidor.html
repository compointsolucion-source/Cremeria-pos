<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico">
<meta name="theme-color" content="#1F2023">
<title>Mis entregas - Compoint Punto</title>
<link rel="stylesheet" href="css/app-theme.css">
<script src="js/tema.js"></script>
<script src="js/vendor/socket.io.min.js"></script>
<style>
  /* Pantalla del repartidor: pensada para el celular, con botones grandes y una sola mano. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; max-width: 560px; margin-inline: auto; background: var(--background); }
  .rp-cab { background: #1F2023; color: #fff; padding: calc(env(safe-area-inset-top, 0px) + 12px) 18px 14px; flex: 0 0 auto; }
  .rp-cab .rp-hola { font-size: 22px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .rp-cab .rp-sub { color: #b9d9b0; font-size: 15px; margin-top: 2px; }
  .rp-prog { height: 9px; background: #3a3d44; border-radius: 9px; margin-top: 11px; overflow: hidden; }
  .rp-prog i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .4s ease; }
  .rp-refrescar { background: transparent; border: 1px solid #50545c; color: #fff; border-radius: 10px; min-height: 38px; min-width: 42px; font-size: 18px; cursor: pointer; }
  .rp-aviso { padding: 8px 14px; font-size: 14px; font-weight: 600; text-align: center; background: #FFF3D6; color: #7a4a00; border-bottom: 1px solid #F0D79A; display: none; }
  .rp-aviso.ver { display: block; }
  .rp-cuerpo { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 20px; }
  .rp-sec { font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .05em; margin: 12px 2px 7px; text-transform: uppercase; }
  .rp-sec:first-child { margin-top: 2px; }
  .rp-vacio { text-align: center; color: var(--muted); padding: 34px 10px; font-size: 16px; line-height: 1.5; }
  .rp-vacio b { display: block; font-size: 40px; margin-bottom: 6px; }

  .rp-ent { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
  .rp-ent.sig { border: 2px solid var(--primary); box-shadow: 0 0 0 4px rgba(95,174,70,.14); }
  .rp-ent.apagada { opacity: .72; cursor: default; }
  .rp-fl { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rp-h { font-weight: 800; font-size: 16px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .rp-n { font-size: 19px; font-weight: 800; margin-top: 3px; word-break: break-word; }
  .rp-d { color: var(--muted); font-size: 15px; line-height: 1.3; margin-top: 1px; word-break: break-word; }
  .rp-m { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; gap: 8px; }
  .rp-num { width: 27px; height: 27px; border-radius: 50%; background: #1F2023; color: #fff; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .rp-badge { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
  .rp-b-cobrar { background: #FFF3D6; color: #7a4a00; border: 1px solid #F0D79A; }
  .rp-b-pagado { background: #E4F3DE; color: #2f6b1f; }
  .rp-b-credito { background: #E5ECFA; color: #1c4a9a; }
  .rp-b-rojo { background: #FDE4E4; color: #B71C1C; }
  .rp-b-gris { background: #ECEDEF; color: #55585f; }
  .rp-b-camino { background: #DDEEFF; color: #0b4a8f; }
  [data-tema="oscuro"] .rp-b-cobrar { background: #4a3a14; color: #ffd98a; border-color: #6b5420; }
  [data-tema="oscuro"] .rp-b-pagado { background: #1f3a19; color: #a8dd96; }
  [data-tema="oscuro"] .rp-b-credito { background: #1f2d4d; color: #a8c1f2; }
  [data-tema="oscuro"] .rp-b-rojo { background: #4d1f1f; color: #ffb3b3; }
  [data-tema="oscuro"] .rp-b-gris { background: #3a3c41; color: #cfd1d6; }
  [data-tema="oscuro"] .rp-b-camino { background: #16334f; color: #a9d4ff; }

  .rp-btn { width: 100%; min-height: 52px; font-size: 17.5px; border-radius: 12px; margin-top: 8px; border: 1px solid transparent; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none; font-family: inherit; box-sizing: border-box; }
  .rp-btn:disabled { opacity: .55; }
  .rp-pri { background: var(--primary); color: #fff; }
  .rp-sec-btn { background: var(--surface); color: var(--text); border-color: var(--border); min-height: 46px; font-size: 16px; }
  .rp-peligro { background: var(--surface); color: var(--danger); border-color: var(--border); min-height: 46px; font-size: 16px; }
  .rp-waze { background: #33CCFF; border-color: #33CCFF; color: #06324a; }
  .rp-gmap { background: var(--surface); border: 2px solid #1565C0; color: #1565C0; }
  [data-tema="oscuro"] .rp-gmap { color: #8ab8f5; border-color: #4a86d8; }
  .rp-fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rp-fila2 .rp-btn { margin-top: 8px; }

  .rp-cobrar { background: #FFF3D6; border: 2px solid #F0D79A; border-radius: 12px; padding: 10px 14px; text-align: center; margin-top: 10px; }
  .rp-cobrar .c1 { font-size: 14px; font-weight: 800; color: #9b5d00; letter-spacing: .04em; text-transform: uppercase; }
  .rp-cobrar .c2 { font-size: 36px; font-weight: 800; color: #7a4a00; line-height: 1.1; }
  .rp-cobrar .c3 { font-size: 14.5px; color: #7a4a00; }
  .rp-cobrar.ok { background: #E4F3DE; border-color: #B8DDA9; }
  .rp-cobrar.ok .c1, .rp-cobrar.ok .c2, .rp-cobrar.ok .c3 { color: #2f6b1f; }
  .rp-cobrar.ok .c2 { font-size: 24px; }
  .rp-cobrar.cred { background: #E5ECFA; border-color: #B9C9EA; }
  .rp-cobrar.cred .c1, .rp-cobrar.cred .c2, .rp-cobrar.cred .c3 { color: #1c4a9a; }
  .rp-cobrar.cred .c2 { font-size: 24px; }
  [data-tema="oscuro"] .rp-cobrar { background: #3d3217; border-color: #6b5420; }
  [data-tema="oscuro"] .rp-cobrar .c1, [data-tema="oscuro"] .rp-cobrar .c2, [data-tema="oscuro"] .rp-cobrar .c3 { color: #ffd98a; }
  [data-tema="oscuro"] .rp-cobrar.ok { background: #1f3a19; border-color: #2f5a25; }
  [data-tema="oscuro"] .rp-cobrar.ok .c1, [data-tema="oscuro"] .rp-cobrar.ok .c2, [data-tema="oscuro"] .rp-cobrar.ok .c3 { color: #a8dd96; }
  [data-tema="oscuro"] .rp-cobrar.cred { background: #1f2d4d; border-color: #35508a; }
  [data-tema="oscuro"] .rp-cobrar.cred .c1, [data-tema="oscuro"] .rp-cobrar.cred .c2, [data-tema="oscuro"] .rp-cobrar.cred .c3 { color: #a8c1f2; }

  .rp-nota { border-radius: 10px; padding: 9px 12px; font-size: 15px; line-height: 1.35; margin-top: 8px; background: #FFF3D6; color: #7a4a00; display: flex; gap: 8px; }
  [data-tema="oscuro"] .rp-nota { background: #3d3217; color: #ffd98a; }
  .rp-nota.azul { background: #E5ECFA; color: #1c4a9a; }
  [data-tema="oscuro"] .rp-nota.azul { background: #1f2d4d; color: #a8c1f2; }

  .rp-tarj { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 6px 14px; margin-bottom: 10px; }
  .rp-lin { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 16px; }
  .rp-lin:last-child { border: 0; }
  .rp-lin small { color: var(--muted); display: block; font-size: 13px; }
  .rp-lin b { white-space: nowrap; }

  .rp-detalle-cab { display: flex; align-items: center; gap: 10px; }
  .rp-atras { background: transparent; border: 1px solid #50545c; color: #fff; border-radius: 10px; min-height: 40px; padding: 0 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .rp-pie { flex: 0 0 auto; background: var(--surface); border-top: 1px solid var(--border); padding: 8px 14px calc(env(safe-area-inset-bottom, 0px) + 12px); }
  .rp-pie > .rp-btn:first-child { margin-top: 0; }

  .rp-barra { flex: 0 0 auto; display: flex; justify-content: space-around; border-top: 1px solid var(--border); background: var(--surface); padding: 6px 0 calc(env(safe-area-inset-bottom, 0px) + 8px); }
  .rp-barra button { background: none; border: 0; font-size: 13px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 80px; padding: 4px 8px; cursor: pointer; font-family: inherit; }
  .rp-barra button span { font-size: 22px; line-height: 1.1; }
  .rp-barra button.on { color: var(--primary-dark); }

  /* Ventana de abajo (entregar / no entregado) */
  .rp-velo { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 900; display: flex; align-items: flex-end; justify-content: center; }
  .rp-hoja { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
  .rp-hoja h3 { font-size: 20px; margin-bottom: 4px; }
  .rp-hoja .rp-peq { color: var(--muted); font-size: 14.5px; margin-bottom: 10px; }
  .rp-metodos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .rp-metodo { border: 2px solid var(--border); background: var(--surface); color: var(--text); border-radius: 12px; min-height: 64px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .rp-metodo span { font-size: 24px; }
  .rp-metodo.on { border-color: var(--primary); background: rgba(95,174,70,.12); }
  .rp-motivos { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .rp-motivo { text-align: left; border: 2px solid var(--border); background: var(--surface); color: var(--text); border-radius: 12px; min-height: 50px; padding: 0 14px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .rp-motivo.on { border-color: var(--danger); background: rgba(198,40,40,.08); }
  .rp-prueba { border: 1px dashed var(--border); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
  .rp-prueba .tit { font-weight: 700; font-size: 15.5px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .rp-prueba img.vista { display: block; max-width: 100%; max-height: 180px; border-radius: 8px; margin-top: 8px; }
  .rp-prueba canvas { width: 100%; height: 150px; border: 1px solid var(--border); border-radius: 8px; background: #fff; margin-top: 8px; touch-action: none; display: block; }
  .rp-oblig { font-size: 12px; font-weight: 800; color: var(--danger); text-transform: uppercase; }
  .rp-chico { background: transparent; border: 0; color: var(--primary-dark); font-weight: 700; font-size: 15px; cursor: pointer; padding: 6px 4px; font-family: inherit; }
  .rp-corte-total { margin-top: 4px; }
  .boton-tema-flotante { display: none !important; } /* el cambio de tema está en la pestaña "Yo" */
  @media (min-width: 600px) { body { border-inline: 1px solid var(--border); } }
</style>
</head>
<body>
  <div class="rp-cab" id="cab"></div>
  <div class="rp-aviso" id="aviso"></div>
  <div class="rp-cuerpo" id="cuerpo"><div class="rp-vacio"><b>🛵</b>Cargando tus entregas…</div></div>
  <div class="rp-pie" id="pie" style="display:none"></div>
  <nav class="rp-barra" id="barra">
    <button data-v="entregas" class="on" onclick="REP.ir('entregas')"><span>🛵</span>Entregas</button>
    <button data-v="corte" onclick="REP.ir('corte')"><span>💵</span>Mi corte</button>
    <button data-v="yo" onclick="REP.ir('yo')"><span>👤</span>Yo</button>
  </nav>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui-components.js"></script>
<script src="js/granel.js"></script>
<script src="js/ubicacion.js"></script>
<script src="js/repartidor.js"></script>
<script src="js/registrar-sw.js"></script>
</body>
</html>
