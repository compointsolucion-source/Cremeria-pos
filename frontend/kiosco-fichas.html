<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico">
<meta name="theme-color" content="#5FAE46">
<title>Saca tu Turno - Compoint Punto</title>
<script src="js/vendor/socket.io.min.js"></script>
<script src="js/vendor/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #5FAE46, #4C9439);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    user-select: none;
  }
  .titulo { font-size: 32px; font-weight: 700; margin-bottom: 40px; }
  .boton-ficha {
    width: 80vw;
    max-width: 500px;
    height: 45vh;
    max-height: 400px;
    border-radius: 30px;
    border: none;
    background: white;
    color: #4C9439;
    font-size: 48px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    transition: transform 0.1s;
  }
  .boton-ficha:active { transform: scale(0.96); }
  .subtexto { margin-top: 30px; font-size: 20px; opacity: 0.85; }

  .pantalla-resultado {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .numero-grande { font-size: 180px; font-weight: 800; line-height: 1; }
  .mensaje-espera { font-size: 28px; margin-top: 20px; }

  .salir-discreto {
    position: fixed; bottom: 12px; left: 12px; opacity: 0.45;
    background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.4); border-radius: 20px;
    color: white; font-size: 13px; cursor: pointer; padding: 8px 14px; user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  .salir-discreto.presionando { opacity: 1; background: rgba(0,0,0,.6); }
  #menuPersonal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:50; align-items:center; justify-content:center; }
  #menuPersonal .caja { background:#fff; color:#222; border-radius:14px; padding:24px; width:min(360px,90vw); text-align:center; }
  #menuPersonal button { display:block; width:100%; margin-top:10px; padding:14px; font-size:16px; border:none; border-radius:8px; cursor:pointer; }
  #menuPersonal .b1 { background:#2e7d32; color:#fff; }
  #menuPersonal .b2 { background:#c62828; color:#fff; }
  #menuPersonal .b3 { background:#e0e0e0; color:#222; }
</style>
</head>
<body>
  <div id="pantallaInicial">
    <div class="titulo">Bienvenido</div>
    <button class="boton-ficha" onclick="sacarFicha()">🎫<br>TOCA AQUÍ<br>PARA SACAR<br>TU TURNO</button>
    <div class="subtexto" id="contadorEsperandoKiosco"></div>
  </div>

  <div class="pantalla-resultado" id="pantallaResultado">
    <div class="titulo">Tu turno es el</div>
    <div class="numero-grande" id="numeroFichaGrande"></div>
    <div class="mensaje-espera">Espere a ser llamado — gracias por su paciencia</div>
  </div>

  <button class="salir-discreto" id="btnPersonal">⚙ Personal · mantén presionado</button>

  <div id="menuPersonal">
    <div class="caja">
      <h3>Menú del personal</h3>
      <button class="b1" onclick="volverAlSistema()">← Volver al sistema</button>
      <button class="b2" onclick="cerrarSesion()">Cerrar sesión</button>
      <button class="b3" onclick="cerrarMenuPersonal()">Seguir en el kiosco</button>
    </div>
  </div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui-components.js"></script>
<script src="js/impresora-termica.js"></script>
<script>
requiereLogin();
const usuario = getUsuario();

const socket = io(API_URL.replace('/api', ''));
socket.emit('unirse_sucursal', usuario.sucursal_id);
socket.on('nueva_ficha', actualizarContadorKiosco);
socket.on('ficha_llamada', actualizarContadorKiosco);

let configuracionKiosco = null;
async function cargarConfiguracionKiosco() {
  try {
    configuracionKiosco = await apiFetch('/configuracion');
  } catch (err) {
    configuracionKiosco = { ancho_ticket: '80mm' };
  }
}

async function actualizarContadorKiosco() {
  try {
    const data = await apiFetch('/fichas/pendientes-count');
    document.getElementById('contadorEsperandoKiosco').textContent =
      data.total > 0 ? `${data.total} persona(s) esperando antes que tú` : '';
  } catch (err) {
    console.error(err);
  }
}

async function sacarFicha() {
  try {
    const ficha = await apiFetch('/fichas', { method: 'POST' });
    mostrarNumeroFicha(ficha.numero);

    const anchoTicket = obtenerAnchoTicketDispositivo(configuracionKiosco);
    const modoImpresion = localStorage.getItem('modo_impresion') || 'directo';
    try {
      if (modoImpresion === 'sistema') {
        imprimirFichaConDialogoDelSistema(ficha.numero, anchoTicket);
      } else {
        await imprimirFicha(ficha.numero, anchoTicket);
      }
    } catch (err) {
      console.error('No se pudo imprimir la ficha automáticamente:', err.message);
    }

    setTimeout(volverAInicio, 6000);
  } catch (err) {
    mostrarToast('No se pudo generar tu turno, por favor pide ayuda al personal.', 'error');
  }
}

function mostrarNumeroFicha(numero) {
  document.getElementById('pantallaInicial').style.display = 'none';
  document.getElementById('pantallaResultado').style.display = 'flex';
  document.getElementById('numeroFichaGrande').textContent = String(numero).padStart(3, '0');
}

function volverAInicio() {
  document.getElementById('pantallaResultado').style.display = 'none';
  document.getElementById('pantallaInicial').style.display = 'block';
  actualizarContadorKiosco();
}

function abrirMenuPersonal() { document.getElementById('menuPersonal').style.display = 'flex'; }
function cerrarMenuPersonal() { document.getElementById('menuPersonal').style.display = 'none'; }
function volverAlSistema() {
  const u = (typeof getUsuario === 'function' && getUsuario()) || {};
  if (u.rol === 'jefe_general') location.href = 'admin/sucursales.html';
  else if (u.rol === 'mostrador') location.href = 'mostrador.html';
  else location.href = 'admin/dashboard.html';
}
// Mantener presionado 2 segundos (evita que un cliente salga sin querer)
(function () {
  const b = document.getElementById('btnPersonal'); let t = null;
  const ini = (e) => { e.preventDefault(); b.classList.add('presionando'); t = setTimeout(() => { b.classList.remove('presionando'); abrirMenuPersonal(); }, 2000); };
  const fin = () => { clearTimeout(t); b.classList.remove('presionando'); };
  b.addEventListener('pointerdown', ini);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, fin));
  b.addEventListener('contextmenu', e => e.preventDefault());
})();
// Atajo de teclado para el personal: Ctrl+Alt+S
document.addEventListener('keydown', e => { if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 's') abrirMenuPersonal(); });

cargarConfiguracionKiosco();
actualizarContadorKiosco();
setInterval(actualizarContadorKiosco, 15000);
</script>
</body>
</html>
