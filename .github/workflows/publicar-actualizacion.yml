name: Publicar actualización (Windows)

on:
  push:
    branches: [estable]
  workflow_dispatch:

concurrency:
  group: publicar-actualizacion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: escritorio/package-lock.json

      - name: Instalar dependencias
        working-directory: escritorio
        run: npm ci

      - name: Probar la lógica del escritorio (informativo)
        working-directory: escritorio
        continue-on-error: true
        run: npm test

      # La versión es UNA sola para todo: la de backend/package.json (la misma que muestra el sistema en la nube).
      # Para publicar una versión nueva, primero se sube ese número (ej. 1.2.0 → 1.2.1).
      - name: Poner el número de versión
        working-directory: escritorio
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('../backend/package.json').version")
          if gh release view "v$V" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::La versión $V ya está publicada. Sube el número en backend/package.json antes de publicar."
            exit 1
          fi
          npm version "$V" --no-git-tag-version

      - name: Construir y publicar en GitHub Releases
        working-directory: escritorio
        run: node scripts/construir.js
        env:
          CLIENTE_URL: ''
          CLIENTE_NOMBRE: 'Compoint Punto'
          PUBLICAR_ACTUALIZACION: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
