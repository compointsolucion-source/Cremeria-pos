<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Compoint Pedidos</title>
<style>
@font-face{font-family:"Ar";src:url(archivo-wdth.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
:root{--tinta:#1B1D1C;--gris:#5E6461;--gris2:#7F8582;--raya:#E4E6E3;--fondo:#F3F4F2;--verde:#1D6A3A;--cartulina:#FFE81A;--rojo:#B3261E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-font-smoothing:antialiased}
html,body{margin:0;background:#fff;color:var(--tinta);font:16px/1.4 Ar,system-ui,sans-serif;font-stretch:100%;min-height:100%}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
.oculto{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
main{padding:max(10px,env(safe-area-inset-top)) 0 calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;min-height:100vh}
.ini{min-height:calc(100vh - 20px);display:flex;flex-direction:column;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.a-top{padding:6px 22px 0;display:flex;align-items:center;justify-content:space-between}
.a-top img{height:56px}
.a-top span{font-size:13px;color:var(--gris)}
.a-tit{margin:24px 22px 0;font-size:27px;line-height:1.08;font-weight:750;letter-spacing:-.3px;text-wrap:balance}
.a-sub{margin:8px 22px 0;color:var(--gris);font-size:15.5px;text-wrap:pretty}
.visor{margin:20px 22px 0;flex:1;min-height:230px;max-height:330px;border-radius:22px;background:#151716;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;width:calc(100% - 44px);transition:transform .15s ease-out}
.visor:active{transform:scale(.99)}
.visor:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 110%,rgba(255,232,26,.10),transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 42px)}
.marco{position:relative;width:150px;height:150px}
.marco i{position:absolute;width:36px;height:36px;border:4px solid #fff}
.marco i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:14px}
.marco i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:14px}
.marco i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:14px}
.marco i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:14px}
.marco svg{position:absolute;inset:40px;width:70px;height:70px;opacity:.5;stroke-width:1.4}
.visor .leyenda{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-weight:650;font-size:15.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:14px;font-weight:700;font-size:17px;width:100%;transition:transform .12s ease-out}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--tinta);color:#fff}
.btn.s{background:var(--fondo)}
.esc{margin:14px 22px 0;width:calc(100% - 44px)}
.o{display:flex;align-items:center;gap:12px;margin:22px 22px 10px;color:var(--gris2);font-size:13.5px}
.o:before,.o:after{content:"";flex:1;height:1px;background:var(--raya)}
.codigo{margin:0 22px;display:flex;gap:8px}
.codigo input{flex:1;min-width:0;height:54px;border:1.5px solid #B9BFBB;border-radius:14px;padding:0 16px;font-size:17px;background:#fff;font-variant-numeric:tabular-nums}
.codigo input:focus{border-color:var(--tinta);outline:0}
.codigo button{width:96px;border-radius:14px;background:var(--fondo);font-weight:700;font-size:16px}
.error{color:var(--rojo);font-weight:600;font-size:14.5px;margin:8px 22px 0;min-height:20px}
.a-pie{margin:auto 22px 0;padding-top:20px;font-size:13px;color:var(--gris2);text-align:center;text-wrap:balance}
.b-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 0 22px}
.b-head h1{font-size:28px;margin:0;font-weight:760;letter-spacing:-.3px}
.redondo{width:48px;height:48px;border-radius:50%;background:var(--fondo);display:grid;place-items:center}
.encamino{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:calc(100% - 32px);margin:16px 16px 4px;border-radius:16px;background:var(--tinta);color:#fff;padding:14px 16px 16px;text-align:left}
.encamino small{color:#C9CDCB;font-size:13px;grid-column:1/-1}
.encamino b{font-size:19px;font-weight:720}
.encamino .hora{align-self:end;font-size:13.5px;color:#C9CDCB}
.pista{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
.pista i{height:5px;border-radius:3px;background:#3E4341}
.pista i.ok{background:var(--cartulina)}
.seccion{font-size:14px;color:var(--gris);margin:22px 22px 2px;font-weight:600}
.fila-t{display:flex;align-items:center;gap:14px;padding:13px 22px;border-bottom:1px solid var(--raya);width:100%;text-align:left;background:#fff}
button.fila-t:active{background:var(--fondo)}
.letra{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:24px;font-stretch:70%;flex:none;position:relative;overflow:hidden}
.letra img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.fila-t .n{flex:1;min-width:0}
.fila-t .n b{display:block;font-size:17px;font-weight:680;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila-t .n span{font-size:14px;color:var(--gris)}
.punto{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2F9E55;margin-right:6px;vertical-align:1px}
.punto.c{background:#C9CDCB}
.chev{color:#A5ABA8}
.agregar-b{margin:8px 22px 0;display:flex;align-items:center;gap:10px;color:var(--verde);font-weight:700;font-size:16px;min-height:48px}
.vacio{color:var(--gris);text-align:center;padding:40px 24px}
h1.tit{font-size:28px;margin:6px 22px 8px;font-weight:760;letter-spacing:-.3px}
.estado-p{font-weight:650}
.estado-p.ok{color:#1F7A3A}.estado-p.mal{color:var(--rojo)}
.campo{margin:0 22px 14px}
.campo label{display:block;font-weight:650;font-size:14.5px;margin-bottom:6px}
.campo input{width:100%;height:52px;border:1.5px solid #B9BFBB;border-radius:12px;padding:0 14px;font-size:16px;background:#fff}
.campo input:focus{border-color:var(--tinta);outline:0}
.ayuda{margin:0 22px 18px;color:var(--gris);font-size:14.5px;text-wrap:pretty}
.quitar-t{color:var(--rojo);font-weight:600;font-size:14.5px;min-height:44px;padding:0 4px}
.nav{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--raya);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;padding:6px 0 max(10px,env(safe-area-inset-bottom));z-index:5}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;color:var(--gris2);gap:4px;font-weight:600;min-height:54px}
.nav button[aria-current=page]{color:var(--tinta)}
.nav button[aria-current=page]:before{content:"";position:absolute;top:-6px;width:36px;height:3px;border-radius:0 0 3px 3px;background:var(--tinta)}
.velo{position:fixed;inset:0;background:rgba(20,22,24,.5);z-index:10;display:flex;align-items:flex-end;animation:aparece .18s ease-out}
.hoja{background:#fff;width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 20px max(22px,env(safe-area-inset-bottom));animation:sube .22s ease-out}
@keyframes aparece{from{opacity:0}}
@keyframes sube{from{transform:translateY(24px);opacity:.6}}
.hoja h2{font-size:22px;margin:0 0 6px}
.encontrada{display:flex;gap:12px;align-items:center;margin:4px 0 18px}
.encontrada span.e{font-size:14.5px}
.grid2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.cargando{color:var(--gris);padding:6px 0 14px}
/* Red de tiendas (se ve solo cuando el directorio de Compoint dice que ya se prendió) */
.nav.cuatro{grid-template-columns:repeat(4,1fr)}
.perm{min-height:calc(100vh - 20px);display:flex;flex-direction:column;padding:24px 22px max(24px,env(safe-area-inset-bottom))}
.perm .ilus{height:min(300px,38vh);border-radius:22px;background:#151716;position:relative;overflow:hidden}
.perm .ilus svg{position:absolute;inset:0;width:100%;height:100%}
.perm h2{font-size:28px;line-height:1.1;margin:26px 0 8px;letter-spacing:-.3px;font-weight:760;text-wrap:balance}
.perm p{color:var(--gris);font-size:16px;margin:0;text-wrap:pretty}
.perm .acc{margin-top:auto;padding-top:22px;display:grid;gap:10px}
.perm .nota{font-size:13px;color:var(--gris2);text-align:center;margin-top:4px}
.perm .saltar{min-height:44px;color:var(--gris);font-weight:650}
.mapa{margin:14px 16px 0;height:200px;border-radius:16px;position:relative;overflow:hidden;background:#EEF0EA}
.mapa svg{position:absolute;inset:0;width:100%;height:100%}
.mapa .zona{position:absolute;right:10px;bottom:10px;background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:650;box-shadow:0 1px 4px rgba(0,0,0,.12);max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapa .cambiar{position:absolute;left:10px;bottom:10px;background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12);min-height:32px}
.dist{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:650;padding:2px 8px;border-radius:6px;background:var(--fondo);color:#3c413e}
.chip.d{background:#E3F1E7;color:#1F5E33}
.seccion.con-acc{display:flex;justify-content:space-between;align-items:baseline}
.seccion.con-acc button{color:var(--verde);font-weight:700;font-size:14px;min-height:36px}
.pocas{margin:14px 16px 0;padding:14px 16px;border-radius:14px;background:var(--fondo);font-size:14.5px;color:#3c413e}
.pocas b{display:block;color:var(--tinta);font-size:15.5px;margin-bottom:2px}
.buscar-g{margin:12px 16px 0;height:54px;border-radius:14px;border:1.5px solid var(--tinta);display:flex;align-items:center;gap:10px;padding:0 14px}
.buscar-g input{flex:1;min-width:0;border:0;outline:0;font-size:17px;background:none}
.filtro{display:flex;gap:8px;margin:12px 16px 0;overflow-x:auto}
.filtro button{font-size:14px;font-weight:650;padding:7px 12px;border-radius:999px;background:var(--fondo);white-space:nowrap;min-height:36px}
.filtro button[aria-pressed=true]{background:var(--tinta);color:#fff}
.res{padding:14px 22px;border-bottom:1px solid var(--raya);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.res .t{font-size:16.5px;font-weight:680}
.res .ti{font-size:14px;color:var(--gris);display:flex;align-items:center;gap:6px}
.res .mini{width:18px;height:18px;border-radius:5px;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;font-stretch:75%;flex:none}
.res .pr{font-size:19px;font-weight:780;font-stretch:80%;font-variant-numeric:tabular-nums;text-align:right}
.res .pr small{display:block;font-size:12.5px;font-weight:600;color:var(--gris);font-stretch:100%}
.res .acc{grid-column:1/-1;display:flex;gap:8px;margin-top:8px}
.res .acc button{font-size:14px;font-weight:700;padding:8px 12px;border-radius:10px;background:var(--fondo);min-height:40px}
.res .acc button.p{background:var(--tinta);color:#fff}
.mejor{display:inline-block;background:var(--cartulina);font-size:12px;font-weight:750;padding:1px 7px;border-radius:5px;margin-left:6px;vertical-align:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="nav oculto" id="nav" aria-label="Secciones">
  <button type="button" data-vista="tiendas"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>Tiendas</button>
  <button type="button" data-vista="buscar" class="oculto" id="navBuscar"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>Buscar</button>
  <button type="button" data-vista="pedidos"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18l-2.5-1.6L12 21l-2.5-1.6L7 21z"/><path d="M10 8h4M10 12h4"/></svg>Pedidos</button>
  <button type="button" data-vista="datos"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-3.6 3.8-5.4 7-5.4s5.8 1.8 7 5.4"/></svg>Mis datos</button>
</nav>
<div id="capa"></div>
<script>
'use strict';
(function () {
  const app = document.getElementById('app');
  const capa = document.getElementById('capa');
  const nav = document.getElementById('nav');
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const leer = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin espacio */ } };
  const hora = (t) => new Date(t).toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' }).replace(/\s?([ap])\.?\s?m\.?/i, (x, a) => ' ' + a.toLowerCase() + 'm');
  const ESCANER = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>';
  const CHEV = '<svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  const COLORES = ['#1D6A3A', '#A33E6E', '#7A4E22', '#2F5D8C', '#6A44B8', '#A6481B', '#0E6E6D'];
  const FINALES = ['entregado', 'cancelado', 'no_entregado'];
  const PASO = {
    recibido: ['Esperando que la tienda lo acepte', 1], surtiendo: ['Están surtiendo tu pedido', 2], listo: ['Tu pedido está listo', 2],
    en_camino: ['Va en camino', 3], entregado: ['Entregado', 4], cancelado: ['Cancelado', 0], no_entregado: ['No se pudo entregar', 0]
  };

  let tiendas = leer('tiendas', []);        // [{h, s, c, negocio, logo, color, usada}]
  let pedidos = leer('pedidos', []);        // [{h, s, c, k, numero, negocio, paso, fecha, repartidor, salio}]
  const datos = leer('datos', { nombre: '', telefono: '' });
  const estados = {};
  let vista = 'tiendas';
  let errorCodigo = '';

  const claveT = (t) => t.h + '|' + (t.s || '');
  const guardarTodo = () => { guardar('tiendas', tiendas); guardar('pedidos', pedidos); guardar('datos', datos); };
  const inicial = (n) => (String(n || '?').trim()[0] || '?').toUpperCase();

  // Solo tiendas de Compoint (cp1007.compoint.com.mx …). Un QR de otro sitio no se abre.
  const HOST_OK = /^[a-z0-9-]+\.compoint\.com\.mx$/i;
  function leerCodigo(texto) {
    const t = String(texto || '').trim();
    if (/^https?:\/\//i.test(t)) {
      try {
        const u = new URL(t);
        if (u.protocol !== 'https:' || !HOST_OK.test(u.hostname) || !/\/tienda\.html$/.test(u.pathname)) return null;
        return { h: u.hostname.toLowerCase(), s: u.searchParams.get('s') || '', c: u.searchParams.get('c') || '' };
      } catch (e) { return null; }
    }
    const m = t.match(/^(?:cp)?\s*(\d{3,6})(?:\s*[-\/ ]\s*(\d{1,4}))?$/i);
    if (m) return { h: 'cp' + m[1] + '.compoint.com.mx', s: m[2] || '', c: '' };
    return null;
  }
  function urlTienda(t, extra, busca) {
    const q = new URLSearchParams();
    if (t.s) q.set('s', t.s);
    if (t.c) q.set('c', t.c);
    if (extra) Object.keys(extra).forEach((k) => q.set(k, extra[k]));
    // Nombre y teléfono van después del # (no llegan al servidor): solo para llenar el pedido más rápido.
    const h = new URLSearchParams();
    if (datos.nombre) h.set('app_n', datos.nombre);
    if (datos.telefono) h.set('app_t', datos.telefono);
    if (busca) h.set('app_q', busca);               // viene de «Buscar»: la tienda abre ya filtrada
    return `https://${t.h}/tienda.html${q.toString() ? '?' + q : ''}${h.toString() ? '#' + h : ''}`;
  }
  async function api(t, ruta) {
    const ctl = new AbortController();
    const reloj = setTimeout(() => ctl.abort(), 12000);
    try {
      const r = await fetch(`https://${t.h}/api/tienda/publico${ruta}`, { signal: ctl.signal, headers: { Accept: 'application/json' } });
      let d = null; try { d = await r.json(); } catch (e) { /* sin cuerpo */ }
      if (!r.ok) { const err = new Error((d && d.error) || 'No se pudo abrir la tienda.'); err.status = r.status; throw err; }
      return d;
    } catch (e) {
      if (e.status) throw e;
      throw new Error('No hay conexión. Revisa tu internet.');
    } finally { clearTimeout(reloj); }
  }
  const qsInfo = (t) => '/info?s=' + encodeURIComponent(t.s || '') + (t.c ? '&c=' + encodeURIComponent(t.c) : '');

  // tienda.html (dentro de la app) regresa aquí con #volver={...}: la tienda y sus pedidos.
  function recibirRegreso() {
    const m = location.hash.match(/volver=([^&]+)/);
    if (!m) return;
    history.replaceState(null, '', location.pathname);
    let d; try { d = JSON.parse(decodeURIComponent(m[1])); } catch (e) { return; }
    if (!d || !HOST_OK.test(String(d.h || ''))) return;
    const t = { h: String(d.h).toLowerCase(), s: String(d.s || '').replace(/\D/g, '').slice(0, 6), c: String(d.c || '').slice(0, 64), negocio: String(d.n || '').slice(0, 120) };
    agregarTienda(t);
    (Array.isArray(d.p) ? d.p : []).slice(0, 10).forEach((p) => {
      if (!/^[A-Za-z0-9_-]{16,64}$/.test(String(p.k || ''))) return;
      if (!pedidos.some((x) => x.k === p.k)) pedidos.unshift({ h: t.h, s: t.s, c: t.c, k: p.k, numero: String(p.n || '').slice(0, 20), negocio: t.negocio, paso: 'recibido', fecha: Number(p.t) || Date.now() });
    });
    pedidos.sort((a, b) => b.fecha - a.fecha);
    pedidos = pedidos.slice(0, 30);
    guardarTodo();
  }
  function agregarTienda(t, info) {
    const i = tiendas.findIndex((x) => claveT(x) === claveT(t));
    const base = i >= 0 ? tiendas[i] : { color: COLORES[tiendas.length % COLORES.length] };
    const nueva = Object.assign({}, base, t, { negocio: (info && info.negocio) || t.negocio || base.negocio || 'Tienda', logo: (info && info.logo_url) || base.logo || '', usada: Date.now() });
    if (!t.c && base.c) nueva.c = base.c;          // no perder su enlace de fiado
    if (i >= 0) tiendas.splice(i, 1);
    tiendas.unshift(nueva);
    tiendas = tiendas.slice(0, 20);
    guardarTodo();
  }
  const letra = (t, nombre) => `<span class="letra" style="background:${esc(t.color || COLORES[0])}" aria-hidden="true">${esc(inicial(nombre))}${t.logo ? `<img src="${esc(t.logo)}" alt="" onerror="this.remove()">` : ''}</span>`;

  // ------------------------------------------------ red de tiendas (se prende sola desde compoint.com.mx)
  // Mientras el directorio diga «activa: false» la app se ve igual que siempre. Cuando Compoint pase de
  // 100 negocios que pagan, el directorio contesta «activa: true» y aparecen «Cerca de ti» y «Buscar».
  // La ubicación del cliente solo se manda al directorio de Compoint (redondeada, ~100 m) y nunca a las tiendas.
  const RED = 'https://www.compoint.com.mx/punto/red.php';
  const red = leer('red', { activa: false });
  let ubic = leer('ubic', null);                    // {lat, lng, etq}
  let cerca = null;                                 // respuesta de ?accion=cerca
  let verTodasCerca = false;
  const busq = { q: '', filtro: 'todas', res: null, cargando: false, error: '' };
  async function apiRed(params) {
    const ctl = new AbortController();
    const reloj = setTimeout(() => ctl.abort(), 12000);
    try {
      const r = await fetch(RED + '?' + new URLSearchParams(params), { signal: ctl.signal, headers: { Accept: 'application/json' } });
      if (!r.ok) throw new Error('red');
      return await r.json();
    } finally { clearTimeout(reloj); }
  }
  async function revisarRed() {
    try {
      const d = await apiRed({ accion: 'estado' });
      const antes = red.activa;
      red.activa = !!(d && d.activa);
      guardar('red', red);
      if (red.activa !== antes && !capa.innerHTML) pintar();
    } catch (e) { /* sin internet: se queda como estaba */ }
  }
  const redondo = (x) => Math.round(x * 1000) / 1000;
  async function cargarCerca() {
    if (!red.activa || !ubic) return;
    try {
      cerca = await apiRed({ accion: 'cerca', lat: ubic.lat, lng: ubic.lng });
      if (cerca && cerca.activa === false) { red.activa = false; guardar('red', red); }
    } catch (e) { cerca = cerca || { error: true }; }
    if (!capa.innerHTML && (vista === 'tiendas' || vista === 'buscar')) pintar();
  }
  function ponerUbicacion(lat, lng, etq) {
    ubic = { lat: redondo(lat), lng: redondo(lng), etq: String(etq || '').slice(0, 80) };
    guardar('ubic', ubic);
    cerca = null; busq.res = null;
    cerrarHoja(); vista = vista === 'buscar' ? 'buscar' : 'tiendas'; pintar();
    cargarCerca();
  }
  function usarUbicacion() {
    if (!navigator.geolocation) { hojaColonia('Tu celular no deja usar la ubicación. Escribe tu colonia.'); return; }
    capa.innerHTML = '<div class="velo"><div class="hoja" role="dialog" aria-modal="true" aria-label="Buscando tu ubicación"><h2>Buscando dónde estás…</h2><p class="cargando">Un momento.</p></div></div>';
    navigator.geolocation.getCurrentPosition(
      (p) => ponerUbicacion(p.coords.latitude, p.coords.longitude, 'Cerca de ti'),
      () => { cerrarHoja(); hojaColonia('No pudimos saber dónde estás. Escribe tu colonia.'); },
      { enableHighAccuracy: false, timeout: 15000, maximumAge: 10 * 60 * 1000 });
  }
  function hojaColonia(error) {
    capa.innerHTML = `<div class="velo" data-cerrar="1"><div class="hoja" role="dialog" aria-modal="true" aria-labelledby="hcol"><h2 id="hcol">¿En qué colonia estás?</h2>
      <p style="margin:0 0 10px;color:var(--gris);font-size:15px">Escribe tu colonia y tu ciudad.</p>
      <form class="codigo" id="formCol" style="margin:0"><input id="colonia" autocomplete="off" maxlength="80" placeholder="Ej. Centro, Guadalajara" aria-label="Colonia y ciudad"><button type="submit">Buscar</button></form>
      <div class="error" role="alert" style="margin:8px 0 0">${esc(error || '')}</div></div></div>`;
    const i = document.getElementById('colonia'); i.focus();
    document.getElementById('formCol').onsubmit = async (e) => {
      e.preventDefault();
      const txt = i.value.trim();
      if (txt.length < 3) return;
      try {
        const r = await fetch('https://nominatim.openstreetmap.org/search?' + new URLSearchParams({ format: 'jsonv2', countrycodes: 'mx', limit: '1', 'accept-language': 'es', q: txt }), { headers: { Accept: 'application/json' } });
        const d = await r.json();
        if (!Array.isArray(d) || !d.length) { hojaColonia('No encontramos esa colonia. Escribe también la ciudad.'); return; }
        ponerUbicacion(Number(d[0].lat), Number(d[0].lon), txt);
      } catch (err) { hojaColonia('No hay conexión. Revisa tu internet.'); }
    };
  }
  const h12 = (h) => { const [a, b] = String(h || '').split(':').map(Number); if (!Number.isFinite(a)) return ''; const x = a % 12 || 12; return `${x}${b ? ':' + String(b).padStart(2, '0') : ''} ${a >= 12 ? 'pm' : 'am'}`; };
  const km = (x) => (x < 1 ? Math.round(x * 1000 / 50) * 50 + ' m' : x.toFixed(1).replace('.0', '') + ' km');
  const colorDe = (t, i) => t.color || COLORES[i % COLORES.length];

  function pintarPermiso() {
    nav.classList.add('oculto');
    const pin = (x, y, c, l) => `<rect x="${x}" y="${y}" width="32" height="32" rx="9" fill="${c}" stroke="#fff" stroke-width="2.5"/><text x="${x + 16}" y="${y + 21}">${l}</text>`;
    app.innerHTML = `<div class="perm"><div class="ilus"><svg viewBox="0 0 338 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g stroke="rgba(255,255,255,.08)" stroke-width="10" fill="none"><path d="M-10 90H350M-10 210H350M90-10V310M240-10V310"/></g>
        <g stroke="rgba(255,255,255,.05)" stroke-width="5"><path d="M-10 150H350M165-10V310M30-10L330 310"/></g>
        <circle cx="169" cy="152" r="70" fill="rgba(47,111,224,.16)"/><circle cx="169" cy="152" r="11" fill="#2F6FE0" stroke="#fff" stroke-width="4"/>
        <g font-family="Ar,sans-serif" font-weight="800" font-size="15" text-anchor="middle" fill="#fff">${pin(70, 60, '#1D6A3A', 'A')}${pin(232, 88, '#A33E6E', 'F')}${pin(196, 214, '#7A4E22', 'P')}${pin(58, 196, '#2F5D8C', 'C')}</g></svg></div>
      <h2>Ve las tiendas que tienes cerca</h2>
      <p>Te mostramos las tiendas de tu colonia que llevan a domicilio o donde puedes pasar a recoger.</p>
      <div class="acc"><button type="button" class="btn p" data-red="ubicacion">Usar mi ubicación</button>
        <button type="button" class="btn s" data-red="colonia">Escribir mi colonia</button>
        <button type="button" class="saltar" data-red="omitir">Ahora no, tengo el QR de mi tienda</button>
        <div class="nota">Tu ubicación no se le comparte a ninguna tienda.</div></div></div>`;
  }

  // Mapa sencillo: tú al centro, las tiendas alrededor a su distancia real. Se acerca solo según qué tan
  // lejos está la tienda más lejana (para que los puntos no se encimen cuando todas están a pocas cuadras).
  function mapaCerca(lista) {
    const W = 358, H = 200, R = 84;
    const cx = W / 2, cy = H / 2;
    const k = Math.cos(ubic.lat * Math.PI / 180);
    const muestra = lista.slice(0, 12);
    const lejos = Math.max(0.3, ...muestra.map((t) => t.km || 0)) * 1.1;
    const escala = (kmX) => (kmX / lejos) * R;
    const pins = muestra.map((t, i) => {
      const x = cx + Math.max(-1.9, Math.min(1.9, escala((t.lng - ubic.lng) * 111 * k) / R)) * R;
      const y = cy - Math.max(-1.05, Math.min(1.05, escala((t.lat - ubic.lat) * 111) / R)) * R;
      return `<g><line x1="${x}" y1="${y}" x2="${x}" y2="${y + 8}" stroke="#1B1D1C" stroke-width="2"/><rect x="${x - 15}" y="${y - 30}" width="30" height="30" rx="9" fill="${esc(colorDe(t, i))}" stroke="#fff" stroke-width="2.5"/><text x="${x}" y="${y - 10}">${esc(inicial(t.negocio))}</text></g>`;
    }).join('');
    return `<div class="mapa"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa de tiendas cerca de ti">
      <g fill="none" stroke="#D5DAD2" stroke-dasharray="4 5"><circle cx="${cx}" cy="${cy}" r="${R / 2}"/><circle cx="${cx}" cy="${cy}" r="${R}"/></g>
      <text x="${cx + R + 4}" y="${cy - 4}" font-size="11" fill="#7F8582" font-family="Ar,sans-serif">${esc(km(lejos))}</text>
      <circle cx="${cx}" cy="${cy}" r="18" fill="rgba(47,111,224,.18)"/><circle cx="${cx}" cy="${cy}" r="8" fill="#2F6FE0" stroke="#fff" stroke-width="3"/>
      <g font-family="Ar,sans-serif" font-weight="800" font-size="14" text-anchor="middle" fill="#fff">${pins}</g></svg>
      <button type="button" class="cambiar" data-red="cambiar">Cambiar</button><div class="zona">${esc(ubic.etq || 'Cerca de ti')}</div></div>`;
  }
  function filaCerca(t, i) {
    const estado = t.abierta ? `<i class="punto"></i>Abierta${t.tiempo ? ' · ' + esc(t.tiempo) : ''}` : `<i class="punto c"></i>Cerrada${t.hora ? ' · abre ' + esc(h12(t.hora)) : ''}`;
    const chips = `${t.domicilio ? '<span class="chip d">A domicilio</span>' : ''}${t.recoger ? '<span class="chip">Pasar a recoger</span>' : ''}`;
    return `<button type="button" class="fila-t" data-cerca="${i}">${letra({ color: colorDe(t, i) }, t.negocio)}<span class="n"><b>${esc(t.negocio)}</b><span>${estado}</span><span class="chips">${chips}</span></span><span class="dist">${km(t.km)}</span></button>`;
  }
  function bloqueCerca() {
    if (!red.activa) return '';
    if (!ubic) return `<div class="pocas"><b>Tiendas cerca de ti</b>Te mostramos las tiendas de tu colonia. <button type="button" class="agregar-b" style="margin:6px 0 0;min-height:40px" data-red="permiso">Ver tiendas cerca</button></div>`;
    if (!cerca) return `<div class="seccion">Cerca de ti</div><p class="cargando" style="padding:6px 22px">Buscando tiendas…</p>`;
    if (cerca.error) return `<div class="pocas"><b>Sin conexión</b>No pudimos ver las tiendas cerca. Revisa tu internet.</div>`;
    if (cerca.pocas || !cerca.tiendas || !cerca.tiendas.length) {
      return `<div class="pocas"><b>Todavía hay pocas tiendas cerca de ${esc(ubic.etq && ubic.etq !== 'Cerca de ti' ? ubic.etq : 'ti')}</b>Pronto habrá más. Mientras, escanea el QR de tu tienda. <button type="button" class="agregar-b" style="margin:6px 0 0;min-height:40px" data-red="cambiar">Cambiar mi colonia</button></div>`;
    }
    const lista = verTodasCerca ? cerca.tiendas : cerca.tiendas.slice(0, 5);
    return `${mapaCerca(cerca.tiendas)}<div class="seccion con-acc">Cerca de ti${cerca.tiendas.length > 5 ? `<button type="button" data-red="todas">${verTodasCerca ? 'Ver menos' : 'Ver todas (' + cerca.tiendas.length + ')'}</button>` : ''}</div>
      <div>${lista.map(filaCerca).join('')}</div>`;
  }

  function pintarBuscar() {
    const res = busq.res && busq.res.productos ? busq.res.productos.filter((p) => busq.filtro === 'todas' || (busq.filtro === 'domicilio' ? p.tienda.domicilio : p.tienda.abierta)) : [];
    const tiendasDistintas = new Set(res.map((p) => p.tienda.h + '|' + p.tienda.s)).size;
    let cuerpo = '';
    if (!ubic) cuerpo = `<div class="pocas"><b>¿Dónde estás?</b>Para buscar en las tiendas cerca necesitamos tu colonia. <button type="button" class="agregar-b" style="margin:6px 0 0;min-height:40px" data-red="permiso">Poner mi ubicación</button></div>`;
    else if (busq.cargando) cuerpo = '<p class="cargando" style="padding:14px 22px">Buscando…</p>';
    else if (busq.error) cuerpo = `<div class="pocas"><b>Sin conexión</b>${esc(busq.error)}</div>`;
    else if (busq.res && busq.res.pocas) cuerpo = '<div class="pocas"><b>Todavía hay pocas tiendas cerca</b>Pronto habrá más. Mientras, escanea el QR de tu tienda.</div>';
    else if (busq.res && !res.length) cuerpo = `<div class="pocas"><b>No lo encontramos cerca</b>Solo salen tiendas a menos de 3 km que tienen el producto. Prueba con otra palabra.</div>`;
    else if (busq.res) {
      cuerpo = `<div class="seccion">${tiendasDistintas === 1 ? '1 tienda cerca lo tiene' : tiendasDistintas + ' tiendas cerca lo tienen'}</div>` + res.map((p, i) => {
        const t = p.tienda;
        return `<div class="res"><div><div class="t">${esc(p.nombre)}${i === 0 && tiendasDistintas > 1 ? '<span class="mejor">Más barata</span>' : ''}</div>
          <div class="ti"><span class="mini" style="background:${esc(t.color || COLORES[0])}">${esc(inicial(t.negocio))}</span>${esc(t.negocio)} · ${km(t.km)}${t.abierta ? '' : ' · Cerrada'}</div></div>
          <div class="pr num">$${Number(p.precio).toLocaleString('es-MX', { maximumFractionDigits: 2 })}<small>${p.por_peso ? 'el kilo' : 'c/u'}</small></div>
          <div class="acc"><button type="button" class="p" data-res="${i}" data-modo="pedir">Pedir aquí</button><button type="button" data-res="${i}" data-modo="ver">Ver tienda</button></div></div>`;
      }).join('');
    }
    app.innerHTML = `<div class="b-head"><h1>Buscar</h1></div>
      <form class="buscar-g" id="formBusq" role="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="busq" type="search" enterkeyhint="search" maxlength="60" placeholder="¿Qué buscas? Ej. leche" aria-label="Buscar producto en las tiendas cerca" value="${esc(busq.q)}"></form>
      <div class="filtro" role="group" aria-label="Filtrar">${[['todas', 'Todas'], ['domicilio', 'A domicilio'], ['abiertas', 'Abiertas ahora']].map(([k, n]) => `<button type="button" data-filtro="${k}" aria-pressed="${busq.filtro === k}">${n}</button>`).join('')}</div>
      ${cuerpo}`;
    busq.lista = res;
    document.getElementById('formBusq').onsubmit = (e) => { e.preventDefault(); hacerBusqueda(document.getElementById('busq').value); };
  }
  async function hacerBusqueda(q) {
    busq.q = String(q || '').trim().slice(0, 60);
    if (busq.q.length < 2 || !ubic) { pintar(); return; }
    busq.cargando = true; busq.error = ''; pintar();
    try { busq.res = await apiRed({ accion: 'buscar', q: busq.q, lat: ubic.lat, lng: ubic.lng }); }
    catch (e) { busq.res = null; busq.error = 'No pudimos buscar. Revisa tu internet.'; }
    busq.cargando = false;
    if (vista === 'buscar') pintar();
  }
  function abrirDeLaRed(t, busca) {
    const nueva = { h: t.h, s: String(t.s || ''), c: '', negocio: t.negocio, color: t.color || undefined };
    agregarTienda(nueva);
    location.href = urlTienda(nueva, null, busca);
  }

  // ------------------------------------------------ pantallas
  function pintar() {
    const omitio = leer('red_omitido', false);
    if (red.activa && !ubic && !omitio && (vista === 'tiendas' || vista === 'buscar') && !tiendas.length) return pintarPermiso();
    if (!tiendas.length && vista === 'tiendas' && !(red.activa && ubic)) return pintarInicio();
    nav.classList.remove('oculto');
    nav.classList.toggle('cuatro', !!red.activa);
    document.getElementById('navBuscar').classList.toggle('oculto', !red.activa);
    if (vista === 'buscar' && !red.activa) vista = 'tiendas';
    nav.querySelectorAll('button').forEach((b) => b.setAttribute('aria-current', b.dataset.vista === vista ? 'page' : 'false'));
    if (vista === 'pedidos') return pintarPedidos();
    if (vista === 'datos') return pintarDatos();
    if (vista === 'buscar') return pintarBuscar();
    return pintarTiendas();
  }

  function pintarInicio() {
    nav.classList.add('oculto');
    app.innerHTML = `<div class="ini"><div class="a-top"><img src="logo.png" alt="Compoint"><span>Pedidos</span></div>
      <h1 class="a-tit">Tu tienda de la colonia, a domicilio</h1>
      <p class="a-sub">Escanea el QR que tienen en el mostrador. Pides desde aquí y pagas cuando te llega.</p>
      <button type="button" class="visor" data-acc="escanear" aria-label="Abrir la cámara para escanear el QR"><span class="marco"><i></i><i></i><i></i><i></i>${ESCANER}</span><span class="leyenda">Toca para abrir la cámara</span></button>
      <button type="button" class="btn p esc" data-acc="escanear">${ESCANER}Escanear QR</button>

      <div class="error" role="alert">${esc(errorCodigo)}</div>
      ${red.activa ? '<button type="button" class="btn s esc" data-red="permiso">Ver tiendas cerca de mí</button>' : ''}
      <div class="a-pie">Funciona con las tiendas que usan Compoint Punto</div></div>`;
    document.getElementById('formCodigo').onsubmit = (e) => { e.preventDefault(); buscar(document.getElementById('codigo').value); };
  }

  function tarjetaActiva() {
    const p = pedidos.find((x) => !FINALES.includes(x.paso) && Date.now() - x.fecha < 2 * 86400000);
    if (!p) return '';
    const [txt, n] = PASO[p.paso] || PASO.recibido;
    const titulo = p.paso === 'en_camino' && p.repartidor ? `Va en camino con ${p.repartidor}` : txt;
    return `<button type="button" class="encamino" data-pedido="${esc(p.k)}"><small>${esc(p.negocio)} · Pedido ${esc(p.numero)}</small><b>${esc(titulo)}</b><span class="hora num">${p.paso === 'en_camino' && p.salio ? 'Salió ' + esc(hora(p.salio)) : 'Ver ›'}</span>
      <span class="pista" aria-hidden="true">${[1, 2, 3, 4].map((k) => `<i class="${k <= n ? 'ok' : ''}"></i>`).join('')}</span></button>`;
  }

  function filaTienda(t) {
    const e = estados[claveT(t)];
    let estado = 'Revisando…';
    if (e && e.error) estado = `<i class="punto c"></i>${esc(e.error)}`;
    else if (e) {
      const ab = e.horario.abierto;
      const detalle = ab ? (e.tiempo_entrega || '') : e.horario.texto.replace(/^Cerrado\.\s*/, '');
      estado = `<i class="punto ${ab ? '' : 'c'}"></i>${ab ? esc(e.horario.texto.replace(/^Abierto/, 'Abierta')) : 'Cerrada'}${detalle ? ' · ' + esc(detalle) : ''}`;
    }
    const nombre = (e && e.negocio) || t.negocio;
    return `<button type="button" class="fila-t" data-tienda="${esc(claveT(t))}">${letra(t, nombre)}<span class="n"><b>${esc(nombre)}</b><span>${estado}</span></span>${CHEV}</button>`;
  }

  function pintarTiendas() {
    app.innerHTML = `<div class="b-head"><h1>${red.activa ? 'Tiendas' : 'Mis tiendas'}</h1><button type="button" class="redondo" data-acc="escanear" aria-label="Escanear QR de otra tienda">${ESCANER}</button></div>
      ${tarjetaActiva()}
      ${bloqueCerca()}
      ${tiendas.length ? `<div class="seccion">${red.activa ? 'Mis tiendas' : pedidos.length ? 'Pide otra vez' : 'Tus tiendas'}</div>
      <div>${tiendas.map(filaTienda).join('')}</div>` : ''}
      <button type="button" class="agregar-b" data-acc="escanear"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Agregar otra tienda</button>`;
  }

  function pintarPedidos() {
    app.innerHTML = `<h1 class="tit">Pedidos</h1>${pedidos.length ? pedidos.map((p) => {
      const [txt] = PASO[p.paso] || PASO.recibido;
      const ok = p.paso === 'entregado';
      const mal = p.paso === 'cancelado' || p.paso === 'no_entregado';
      const t = tiendas.find((x) => x.h === p.h && String(x.s || '') === String(p.s || '')) || { color: '#9AA19C' };
      return `<button type="button" class="fila-t" data-pedido="${esc(p.k)}">${letra(t, p.negocio)}<span class="n"><b>${esc(p.negocio)}</b><span class="num">${esc(p.numero)} · ${esc(new Date(p.fecha).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }))} · <span class="estado-p ${ok ? 'ok' : mal ? 'mal' : ''}">${esc(txt)}</span></span></span>${CHEV}</button>`;
    }).join('') : '<p class="vacio">Aquí verás tus pedidos cuando hagas el primero.</p>'}`;
  }

  function pintarDatos() {
    app.innerHTML = `<h1 class="tit">Mis datos</h1><p class="ayuda">Los usamos para llenar tu pedido más rápido. Se quedan solo en tu celular.</p>
      <form id="formDatos"><div class="campo"><label for="dNombre">Tu nombre</label><input id="dNombre" autocomplete="name" maxlength="150" value="${esc(datos.nombre)}"></div>
      <div class="campo"><label for="dTel">Tu WhatsApp</label><input id="dTel" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="10 números" value="${esc(datos.telefono)}"></div>
      <div class="campo"><button type="submit" class="btn p">Guardar</button></div></form>
      ${tiendas.length ? `<div class="seccion">Tiendas guardadas</div>${tiendas.map((t) => `<div class="fila-t">${letra(t, t.negocio)}<span class="n"><b>${esc(t.negocio)}</b><span class="num">Código ${esc(t.h.split('.')[0].replace(/^cp/i, ''))}${t.s && t.s !== '1' ? '-' + esc(t.s) : ''}</span></span><button type="button" class="quitar-t" data-quitar="${esc(claveT(t))}">Quitar</button></div>`).join('')}` : ''}
      <p class="ayuda" style="margin-top:26px;text-align:center">Compoint Pedidos · Compoint, punto de soluciones · Guadalajara, Jal.</p>`;
    document.getElementById('formDatos').onsubmit = (e) => {
      e.preventDefault();
      datos.nombre = document.getElementById('dNombre').value.trim().slice(0, 150);
      datos.telefono = document.getElementById('dTel').value.trim().slice(0, 20);
      guardarTodo(); vista = 'tiendas'; pintar();
    };
  }

  // ------------------------------------------------ buscar una tienda (QR o código)
  function cerrarHoja() { capa.innerHTML = ''; }
  function hojaCodigo(error) {
    if (!tiendas.length) { errorCodigo = error || ''; cerrarHoja(); pintarInicio(); const i = document.getElementById('codigo'); if (i) i.focus(); return; }
    capa.innerHTML = `<div class="velo" data-cerrar="1"><div class="hoja" role="dialog" aria-modal="true" aria-labelledby="hc"><h2 id="hc">Código de la tienda</h2>
      <p style="margin:0 0 10px;color:var(--gris);font-size:15px">Viene abajo del QR que tiene tu tienda.</p>
      <form class="codigo" id="formHoja" style="margin:0"><input id="codigoH" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Ej. 1007" aria-label="Código de la tienda"><button type="submit">Buscar</button></form>
      <div class="error" role="alert" style="margin:8px 0 0">${esc(error || '')}</div></div></div>`;
    const i = document.getElementById('codigoH'); i.focus();
    document.getElementById('formHoja').onsubmit = (e) => { e.preventDefault(); buscar(i.value); };
  }
  async function buscar(texto) {
    const t = leerCodigo(texto);
    if (!t) { hojaCodigo('Ese código no es de una tienda Compoint. Revísalo.'); return; }
    errorCodigo = '';
    capa.innerHTML = '<div class="velo"><div class="hoja" role="dialog" aria-modal="true" aria-label="Buscando tienda"><h2>Buscando tu tienda…</h2><p class="cargando">Un momento.</p></div></div>';
    try {
      const info = await api(t, qsInfo(t));
      if (!t.s) t.s = String(info.sucursal_id);
      estados[claveT(t)] = info;
      const ab = info.horario.abierto;
      const muestra = { color: COLORES[tiendas.length % COLORES.length], logo: info.logo_url };
      capa.innerHTML = `<div class="velo" data-cerrar="1"><div class="hoja" role="dialog" aria-modal="true" aria-labelledby="he">
        <div class="encontrada">${letra(muestra, info.negocio)}<div><h2 id="he" style="margin:0">${esc(info.negocio)}</h2><span class="e"><i class="punto ${ab ? '' : 'c'}"></i>${esc(info.horario.texto)}</span>${info.cuenta ? `<div style="font-size:14px;color:var(--gris)">Puedes pedir a tu cuenta, ${esc(info.cuenta.nombre)}</div>` : ''}</div></div>
        <div class="grid2"><button type="button" class="btn s" data-acc="cerrar">Cancelar</button><button type="button" class="btn p" id="entrar">Entrar a la tienda</button></div></div></div>`;
      document.getElementById('entrar').onclick = () => { agregarTienda(t, info); cerrarHoja(); location.href = urlTienda(t); };
    } catch (e) {
      cerrarHoja();
      hojaCodigo(e.status === 404 ? 'Esa tienda todavía no recibe pedidos por internet.' : e.message);
    }
  }

  async function escanear() {
    const C = window.Capacitor;
    const BS = C && C.isNativePlatform && C.isNativePlatform() ? (C.Plugins.BarcodeScanner || C.registerPlugin('BarcodeScanner')) : null;
    if (!BS) { hojaCodigo(); return; }
    try {
      const { available } = await BS.isGoogleBarcodeScannerModuleAvailable();
      if (!available) {
        BS.installGoogleBarcodeScannerModule().catch(() => {});
        hojaCodigo('Estamos preparando el lector de QR. Intenta en unos segundos o escribe el código.');
        return;
      }
      const r = await BS.scan({ formats: ['QR_CODE'] });
      const valor = r && r.barcodes && r.barcodes[0] && (r.barcodes[0].rawValue || r.barcodes[0].displayValue);
      if (valor) buscar(valor);
    } catch (e) {
      if (!/cancel/i.test(String(e && e.message))) hojaCodigo('No se pudo abrir la cámara. Escribe el código de la tienda.');
    }
  }

  // ------------------------------------------------ datos en vivo
  async function refrescar() {
    await Promise.all(tiendas.slice(0, 10).map(async (t) => {
      try { estados[claveT(t)] = await api(t, qsInfo(t)); }
      catch (e) { estados[claveT(t)] = { error: e.status === 404 ? 'Ya no recibe pedidos' : 'Sin conexión' }; }
    }));
    await Promise.all(pedidos.filter((p) => !FINALES.includes(p.paso)).slice(0, 5).map(async (p) => {
      try {
        const d = await api(p, '/seguimiento/' + encodeURIComponent(p.k));
        p.paso = d.paso; p.numero = d.numero || p.numero; p.negocio = d.negocio || p.negocio;
        p.repartidor = d.repartidor ? d.repartidor.nombre : '';
        p.salio = d.horas && d.horas.salio ? d.horas.salio : '';
      } catch (e) { if (e.status === 404) p.paso = 'cancelado'; }
    }));
    guardarTodo();
    if (!capa.innerHTML && vista !== 'datos' && tiendas.length) pintar();
  }

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-acc],[data-tienda],[data-pedido],[data-vista],[data-quitar],[data-cerrar],[data-red],[data-cerca],[data-res],[data-filtro]');
    if (!el) return;
    if (el.dataset.red) {
      const r = el.dataset.red;
      if (r === 'ubicacion') usarUbicacion();
      else if (r === 'colonia' || r === 'cambiar') hojaColonia();
      else if (r === 'omitir') { guardar('red_omitido', true); vista = 'tiendas'; pintar(); }
      else if (r === 'permiso') { guardar('red_omitido', false); if (!ubic) { vista = vista === 'buscar' ? 'buscar' : 'tiendas'; pintarPermiso(); } else pintar(); }
      else if (r === 'todas') { verTodasCerca = !verTodasCerca; pintar(); }
      return;
    }
    if (el.dataset.cerca !== undefined) { const t = cerca && cerca.tiendas && cerca.tiendas[Number(el.dataset.cerca)]; if (t) abrirDeLaRed({ ...t, color: colorDe(t, Number(el.dataset.cerca)) }); return; }
    if (el.dataset.res !== undefined) { const p = busq.lista && busq.lista[Number(el.dataset.res)]; if (p) abrirDeLaRed(p.tienda, el.dataset.modo === 'pedir' ? p.nombre : ''); return; }
    if (el.dataset.filtro) { busq.filtro = el.dataset.filtro; pintar(); return; }
    if (el.dataset.cerrar !== undefined && !el.dataset.acc) { if (ev.target === el) cerrarHoja(); return; }
    if (el.dataset.vista) { vista = el.dataset.vista; pintar(); window.scrollTo(0, 0); return; }
    if (el.dataset.tienda) { const t = tiendas.find((x) => claveT(x) === el.dataset.tienda); if (t) { agregarTienda(t); location.href = urlTienda(t); } return; }
    if (el.dataset.pedido) { const p = pedidos.find((x) => x.k === el.dataset.pedido); if (p) location.href = urlTienda({ h: p.h, s: p.s, c: p.c }, { p: p.k }); return; }
    if (el.dataset.quitar) { tiendas = tiendas.filter((x) => claveT(x) !== el.dataset.quitar); guardarTodo(); pintar(); return; }
    const a = el.dataset.acc;
    if (a === 'escanear') escanear();
    else if (a === 'cerrar') cerrarHoja();
  });

  recibirRegreso();
  pintar();
  refrescar();
  revisarRed().then(() => { if (ubic) cargarCerca(); });
  setInterval(() => { if (!document.hidden) refrescar(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refrescar(); });
})();
</script>
</body>
</html>
