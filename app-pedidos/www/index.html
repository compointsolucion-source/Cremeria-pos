<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Compoint Pedidos</title>
<style>
@font-face{font-family:B;src:url(bricolage-grotesque-latin-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:B;src:url(bricolage-grotesque-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:A;src:url(archivo-latin.woff2) format("woff2");font-weight:100 900}
:root{--carbon:#2F3236;--gis:#62686D;--nodo:#5FBF6A;--nodo2:#2E8B3E;--papel:#F4F6F3;--linea:#E2E5E1;--rojo:#B42318}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--carbon);font:16px/1.4 A,system-ui,sans-serif;min-height:100%}
h1,h2{font-family:B}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--nodo);outline-offset:2px}
.oculto{display:none!important}
main{padding:max(10px,env(safe-area-inset-top)) 0 calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;min-height:100vh}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border-radius:16px;font-weight:700;font-size:17px;width:100%}
.btn.p{background:var(--carbon);color:#fff}
.btn.s{background:#fff;border:1.5px solid var(--linea)}
.ini{padding:0 24px;display:flex;flex-direction:column;min-height:calc(100vh - 20px);position:relative;overflow:hidden}
.ini .logo{width:150px;margin:22px 0 0}
.ini h1{font-size:34px;line-height:1.03;margin:34px 0 12px;letter-spacing:-.7px;font-weight:800}
.ini p{color:var(--gis);margin:0;font-size:16.5px}
.red{position:absolute;right:-90px;top:400px;width:300px;opacity:.06;pointer-events:none}
.pasos3{margin:30px 0 0;padding:0;list-style:none;display:grid;gap:16px}
.pasos3 li{display:grid;grid-template-columns:36px 1fr;gap:12px;font-size:15.5px}
.pasos3 i{width:36px;height:36px;border-radius:50%;background:var(--papel);display:grid;place-items:center;font-style:normal;font-weight:800;font-family:B;color:var(--nodo2)}
.pie-ini{margin-top:auto;padding:24px 0 max(26px,env(safe-area-inset-bottom));display:grid;gap:10px}
.top{padding:6px 20px 0;display:flex;justify-content:space-between;align-items:center}
.top img{height:38px}
.redondo{width:48px;height:48px;border-radius:50%;background:var(--papel);display:grid;place-items:center}
h1.saludo{font-size:30px;margin:16px 20px 2px;letter-spacing:-.5px}
.sub{margin:0 20px;color:var(--gis);font-size:15px}
.activo{display:block;width:calc(100% - 32px);text-align:left;margin:16px 16px 0;background:var(--carbon);color:#fff;border-radius:18px;padding:14px 16px}
.activo small{opacity:.78;font-size:13.5px}
.activo b{display:block;font:800 19px B;margin:2px 0 8px}
.barrita{height:8px;background:rgba(255,255,255,.18);border-radius:5px;overflow:hidden}
.barrita i{display:block;height:100%;background:var(--nodo)}
.activo .fila{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;opacity:.92}
.lista{margin:14px 16px 0;display:grid;gap:10px}
.tienda{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--linea);border-radius:18px;padding:12px;width:100%;text-align:left}
.tienda .n{flex:1;min-width:0}
.tienda .n b{display:block;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tienda .n span{font-size:13.5px;color:var(--gis)}
.ab{color:#1F7A3A!important;font-weight:700}.ce{color:var(--rojo)!important;font-weight:700}
.av{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:800 20px B;color:#fff;flex:none;overflow:hidden;position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.pedir{background:var(--carbon);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;flex:none}
.pedir.off{background:var(--papel);color:var(--gis)}
.agregar{margin:12px 16px 0;border:1.5px dashed #BFC5C0;border-radius:18px;min-height:64px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;width:calc(100% - 32px)}
.vacio{color:var(--gis);text-align:center;padding:40px 24px}
h1.tit{font-size:28px;margin:12px 20px 12px}
.campo{margin:0 20px 14px}
.campo label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.campo input{width:100%;height:54px;border:1.5px solid #AEB6B0;border-radius:14px;padding:0 14px;font-size:17px;background:#fff}
.campo input:focus{border-color:var(--carbon);outline:0}
.ayuda{margin:0 20px 18px;color:var(--gis);font-size:14.5px}
.quitar-t{color:var(--rojo);font-weight:600;font-size:14.5px;padding:10px;min-height:44px}
.nav{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--linea);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;padding:8px 0 max(10px,env(safe-area-inset-bottom));z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;color:var(--gis);gap:3px;font-weight:600;min-height:54px}
.nav button[aria-current=page]{color:var(--carbon)}
.nav button[aria-current=page] svg{color:var(--nodo2)}
.velo{position:fixed;inset:0;background:rgba(20,22,24,.5);z-index:10;display:flex;align-items:flex-end}
.hoja{background:#fff;width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 20px max(22px,env(safe-area-inset-bottom))}
.hoja h2{font-size:22px;margin:0 0 6px}
.encontrada{display:flex;gap:12px;align-items:center;margin:8px 0 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.codigo-input{width:100%;height:62px;border:1.5px solid #AEB6B0;border-radius:14px;padding:0 16px;font:800 26px B;letter-spacing:2px;text-align:center;margin:10px 0 6px}
.error{color:var(--rojo);font-weight:600;font-size:15px;min-height:22px;margin:4px 0 8px}
.cargando{color:var(--gis);padding:6px 0 14px}
</style>
</head>
<body>
<main id="app"></main>
<nav class="nav oculto" id="nav" aria-label="Secciones">
  <button type="button" data-vista="tiendas"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Mis tiendas</button>
  <button type="button" data-vista="pedidos"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6"/></svg>Mis pedidos</button>
  <button type="button" data-vista="datos"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Mis datos</button>
</nav>
<div id="capa"></div>
<script>
'use strict';
(function () {
  const app = document.getElementById('app');
  const capa = document.getElementById('capa');
  const nav = document.getElementById('nav');
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const leer = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin espacio */ } };
  const ICONO_QR = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>';
  const COLORES = ['#1F6B35', '#C2477E', '#8A5A2B', '#2F5D8C', '#7B4BD8', '#B5541C', '#0E7C7B'];
  const FINALES = ['entregado', 'cancelado', 'no_entregado'];
  const PASO = {
    recibido: ['Recibimos tu pedido', 18], surtiendo: ['Están surtiendo tu pedido', 45], listo: ['Tu pedido está listo', 60],
    en_camino: ['Tu pedido va en camino', 80], entregado: ['Entregado', 100], cancelado: ['Cancelado', 0], no_entregado: ['No se pudo entregar', 0]
  };

  let tiendas = leer('tiendas', []);        // [{h, s, c, negocio, logo, color, usada}]
  let pedidos = leer('pedidos', []);        // [{h, s, c, k, numero, negocio, paso, fecha, repartidor}]
  const datos = leer('datos', { nombre: '', telefono: '' });
  const estados = {};                       // tienda -> info en vivo
  let vista = 'tiendas';

  const claveT = (t) => t.h + '|' + (t.s || '');
  const guardarTodo = () => { guardar('tiendas', tiendas); guardar('pedidos', pedidos); guardar('datos', datos); };
  const iniciales = (n) => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((x) => x[0]).join('').toUpperCase();

  // Solo tiendas de Compoint (cp1007.compoint.com.mx …). Un QR de otro sitio no se abre.
  const HOST_OK = /^[a-z0-9-]+\.compoint\.com\.mx$/i;
  function leerCodigo(texto) {
    const t = String(texto || '').trim();
    if (/^https?:\/\//i.test(t)) {
      try {
        const u = new URL(t);
        if (u.protocol !== 'https:' || !HOST_OK.test(u.hostname) || !/\/tienda\.html$/.test(u.pathname)) return null;
        return { h: u.hostname.toLowerCase(), s: u.searchParams.get('s') || '', c: u.searchParams.get('c') || '' };
      } catch (e) { return null; }
    }
    const m = t.match(/^(?:cp)?\s*(\d{3,6})(?:\s*[-\/ ]\s*(\d{1,4}))?$/i);
    if (m) return { h: 'cp' + m[1] + '.compoint.com.mx', s: m[2] || '', c: '' };
    return null;
  }
  function urlTienda(t, extra) {
    const q = new URLSearchParams();
    if (t.s) q.set('s', t.s);
    if (t.c) q.set('c', t.c);
    if (extra) Object.keys(extra).forEach((k) => q.set(k, extra[k]));
    // Nombre y teléfono van después del # (no llegan al servidor): solo para llenar el pedido más rápido.
    const h = new URLSearchParams();
    if (datos.nombre) h.set('app_n', datos.nombre);
    if (datos.telefono) h.set('app_t', datos.telefono);
    return `https://${t.h}/tienda.html${q.toString() ? '?' + q : ''}${h.toString() ? '#' + h : ''}`;
  }
  async function api(t, ruta) {
    const ctl = new AbortController();
    const reloj = setTimeout(() => ctl.abort(), 12000);
    try {
      const r = await fetch(`https://${t.h}/api/tienda/publico${ruta}`, { signal: ctl.signal, headers: { Accept: 'application/json' } });
      let d = null; try { d = await r.json(); } catch (e) { /* sin cuerpo */ }
      if (!r.ok) { const err = new Error((d && d.error) || 'No se pudo abrir la tienda.'); err.status = r.status; throw err; }
      return d;
    } catch (e) {
      if (e.status) throw e;
      throw new Error('No hay conexión con la tienda. Revisa tu internet.');
    } finally { clearTimeout(reloj); }
  }
  const qsInfo = (t) => '/info?s=' + encodeURIComponent(t.s || '') + (t.c ? '&c=' + encodeURIComponent(t.c) : '');

  // tienda.html (dentro de la app) regresa aquí con #volver={...}: la tienda y sus pedidos.
  function recibirRegreso() {
    const m = location.hash.match(/volver=([^&]+)/);
    if (!m) return;
    history.replaceState(null, '', location.pathname);
    let d; try { d = JSON.parse(decodeURIComponent(m[1])); } catch (e) { return; }
    if (!d || !HOST_OK.test(String(d.h || ''))) return;
    const t = { h: String(d.h).toLowerCase(), s: String(d.s || '').replace(/\D/g, '').slice(0, 6), c: String(d.c || '').slice(0, 64), negocio: String(d.n || '').slice(0, 120) };
    agregarTienda(t);
    (Array.isArray(d.p) ? d.p : []).slice(0, 10).forEach((p) => {
      if (!/^[A-Za-z0-9_-]{16,64}$/.test(String(p.k || ''))) return;
      if (!pedidos.some((x) => x.k === p.k)) pedidos.unshift({ h: t.h, s: t.s, c: t.c, k: p.k, numero: String(p.n || '').slice(0, 20), negocio: t.negocio, paso: 'recibido', fecha: Number(p.t) || Date.now() });
    });
    pedidos.sort((a, b) => b.fecha - a.fecha);
    pedidos = pedidos.slice(0, 30);
    guardarTodo();
  }
  function agregarTienda(t, info) {
    const i = tiendas.findIndex((x) => claveT(x) === claveT(t));
    const base = i >= 0 ? tiendas[i] : { color: COLORES[tiendas.length % COLORES.length] };
    const nueva = Object.assign({}, base, t, { negocio: (info && info.negocio) || t.negocio || base.negocio || 'Tienda', logo: (info && info.logo_url) || base.logo || '', usada: Date.now() });
    if (!t.c && base.c) nueva.c = base.c;          // no perder su enlace de fiado
    if (i >= 0) tiendas.splice(i, 1);
    tiendas.unshift(nueva);
    tiendas = tiendas.slice(0, 20);
    guardarTodo();
  }

  // ------------------------------------------------ pantallas
  function pintar() {
    if (!tiendas.length && vista === 'tiendas') return pintarInicio();
    nav.classList.remove('oculto');
    nav.querySelectorAll('button').forEach((b) => b.setAttribute('aria-current', b.dataset.vista === vista ? 'page' : 'false'));
    if (vista === 'pedidos') return pintarPedidos();
    if (vista === 'datos') return pintarDatos();
    return pintarTiendas();
  }

  function pintarInicio() {
    nav.classList.add('oculto');
    app.innerHTML = `<div class="ini"><img class="red" src="logo.png" alt=""><img class="logo" src="logo.png" alt="Compoint">
      <h1>Pide a domicilio a las tiendas de tu colonia</h1>
      <p>Con tu tienda de siempre, a sus precios, y pagas cuando te llega.</p>
      <ol class="pasos3"><li><i>1</i><span><b>Escanea el QR</b> que está en el mostrador de tu tienda</span></li>
        <li><i>2</i><span><b>Elige tus productos</b> y dinos a dónde te los llevamos</span></li>
        <li><i>3</i><span><b>Ve tu pedido en vivo</b> hasta que llegue a tu puerta</span></li></ol>
      <div class="pie-ini"><button type="button" class="btn p" data-acc="escanear">${ICONO_QR}Escanear QR de la tienda</button>
        <button type="button" class="btn s" data-acc="codigo">Escribir el código de la tienda</button></div></div>`;
  }

  function tarjetaActiva() {
    const p = pedidos.find((x) => !FINALES.includes(x.paso) && Date.now() - x.fecha < 2 * 86400000);
    if (!p) return '';
    const [txt, pct] = PASO[p.paso] || PASO.recibido;
    return `<button type="button" class="activo" data-pedido="${esc(p.k)}"><small>Pedido ${esc(p.numero)} · ${esc(p.negocio)}</small><b>${esc(txt)}</b>
      <div class="barrita"><i style="width:${pct}%"></i></div><div class="fila"><span>${p.repartidor && p.paso === 'en_camino' ? 'Sale ' + esc(p.repartidor) + ' con tu pedido' : 'Toca para ver el avance'}</span><span>Ver ›</span></div></button>`;
  }

  function filaTienda(t) {
    const e = estados[claveT(t)];
    let estado = '<span>Revisando…</span>';
    let abierto = true;
    if (e && e.error) { estado = `<span class="ce">${esc(e.error)}</span>`; abierto = false; }
    else if (e) {
      abierto = e.horario.abierto;
      const detalle = abierto ? (e.tiempo_entrega ? 'Llega en ' + e.tiempo_entrega : (e.giro || '')) : e.horario.texto.replace(/^Cerrado\.\s*/, '');
      estado = `<span class="${abierto ? 'ab' : 'ce'}">${abierto ? 'Abierto' : 'Cerrado'}</span>${detalle ? ' · ' + esc(detalle) : ''}`;
    }
    const nombre = (e && e.negocio) || t.negocio;
    return `<button type="button" class="tienda" data-tienda="${esc(claveT(t))}"><span class="av" style="background:${esc(t.color || COLORES[0])}">${esc(iniciales(nombre))}${t.logo ? `<img src="${esc(t.logo)}" alt="" onerror="this.remove()">` : ''}</span>
      <span class="n"><b>${esc(nombre)}</b><span>${estado}</span></span><span class="pedir ${abierto ? '' : 'off'}">${abierto ? 'Pedir' : 'Ver'}</span></button>`;
  }

  function pintarTiendas() {
    const nombre = String(datos.nombre || '').trim().split(/\s+/)[0];
    app.innerHTML = `<div class="top"><img src="logo.png" alt="Compoint"><button type="button" class="redondo" data-acc="escanear" aria-label="Escanear QR de una tienda">${ICONO_QR}</button></div>
      <h1 class="saludo">${nombre ? 'Hola, ' + esc(nombre) : 'Hola'}</h1><p class="sub">¿A qué tienda le pides hoy?</p>
      ${tarjetaActiva()}
      <div class="lista">${tiendas.map(filaTienda).join('')}</div>
      <button type="button" class="agregar" data-acc="escanear">＋ Agregar otra tienda</button>`;
  }

  function pintarPedidos() {
    app.innerHTML = `<h1 class="tit">Mis pedidos</h1>${pedidos.length ? `<div class="lista">${pedidos.map((p) => {
      const [txt] = PASO[p.paso] || PASO.recibido;
      const fin = FINALES.includes(p.paso);
      const ok = p.paso === 'entregado';
      return `<button type="button" class="tienda" data-pedido="${esc(p.k)}"><span class="av" style="background:${ok ? '#2E8B3E' : fin ? '#9AA19C' : 'var(--carbon)'}">${ok ? '✓' : fin ? '✕' : '…'}</span>
        <span class="n"><b>${esc(p.negocio)}</b><span>${esc(p.numero)} · ${esc(new Date(p.fecha).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }))} · <span class="${ok ? 'ab' : fin ? 'ce' : ''}">${esc(txt)}</span></span></span><span class="pedir off">Ver</span></button>`;
    }).join('')}</div>` : '<p class="vacio">Aquí verás tus pedidos cuando hagas el primero.</p>'}`;
  }

  function pintarDatos() {
    app.innerHTML = `<h1 class="tit">Mis datos</h1><p class="ayuda">Los usamos para llenar tu pedido más rápido. Se quedan solo en tu celular.</p>
      <div class="campo"><label for="dNombre">Tu nombre</label><input id="dNombre" autocomplete="name" maxlength="150" value="${esc(datos.nombre)}"></div>
      <div class="campo"><label for="dTel">Tu WhatsApp</label><input id="dTel" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="10 números" value="${esc(datos.telefono)}"></div>
      <div class="campo"><button type="button" class="btn p" data-acc="guardarDatos">Guardar</button></div>
      ${tiendas.length ? `<h1 class="tit" style="font-size:21px;margin-top:28px">Mis tiendas guardadas</h1><div class="lista">${tiendas.map((t) => `<div class="tienda"><span class="n"><b>${esc(t.negocio)}</b><span>Código ${esc(t.h.split('.')[0].replace(/^cp/i, ''))}${t.s ? '-' + esc(t.s) : ''}</span></span><button type="button" class="quitar-t" data-quitar="${esc(claveT(t))}">Quitar</button></div>`).join('')}</div>` : ''}
      <p class="ayuda" style="margin-top:28px">Compoint Pedidos · Compoint, punto de soluciones · Guadalajara, Jal.</p>`;
  }

  // ------------------------------------------------ hojas: escribir código / tienda encontrada
  function cerrarHoja() { capa.innerHTML = ''; }
  function hojaCodigo(error) {
    capa.innerHTML = `<div class="velo" data-cerrar="1"><div class="hoja" role="dialog" aria-modal="true" aria-labelledby="hc"><h2 id="hc">Código de la tienda</h2>
      <p style="margin:0;color:var(--gis);font-size:15px">Viene abajo del QR que tiene tu tienda. Ej. 1007</p>
      <input class="codigo-input" id="codigo" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="Código de la tienda">
      <div class="error" role="alert">${esc(error || '')}</div>
      <div class="grid2"><button type="button" class="btn s" data-acc="cerrar">Cancelar</button><button type="button" class="btn p" data-acc="buscarCodigo">Buscar</button></div></div></div>`;
    const i = document.getElementById('codigo'); i.focus();
    i.addEventListener('keydown', (e) => { if (e.key === 'Enter') buscar(i.value); });
  }
  async function buscar(texto) {
    const t = leerCodigo(texto);
    if (!t) { hojaCodigo('Ese código no es de una tienda Compoint. Revísalo y vuelve a intentar.'); return; }
    capa.innerHTML = '<div class="velo"><div class="hoja" role="dialog" aria-modal="true" aria-label="Buscando tienda"><h2>Buscando tu tienda…</h2><p class="cargando">Un momento.</p></div></div>';
    try {
      const info = await api(t, qsInfo(t));
      if (!t.s) t.s = String(info.sucursal_id);
      estados[claveT(t)] = info;
      capa.innerHTML = `<div class="velo" data-cerrar="1"><div class="hoja" role="dialog" aria-modal="true" aria-labelledby="he">
        <div class="encontrada"><span class="av" style="background:${COLORES[tiendas.length % COLORES.length]}">${esc(iniciales(info.negocio))}${info.logo_url ? `<img src="${esc(info.logo_url)}" alt="" onerror="this.remove()">` : ''}</span>
          <div><h2 id="he" style="margin:0">${esc(info.negocio)}</h2><span class="${info.horario.abierto ? 'ab' : 'ce'}" style="font-size:14.5px">● ${esc(info.horario.texto)}</span>${info.cuenta ? `<div style="font-size:14px;color:var(--gis)">Puedes pedir a tu cuenta, ${esc(info.cuenta.nombre)}</div>` : ''}</div></div>
        <div class="grid2"><button type="button" class="btn s" data-acc="cerrar">Cancelar</button><button type="button" class="btn p" id="entrar">Entrar</button></div></div></div>`;
      document.getElementById('entrar').onclick = () => { agregarTienda(t, info); cerrarHoja(); location.href = urlTienda(t); };
    } catch (e) {
      hojaCodigo(e.status === 404 ? 'Esa tienda todavía no recibe pedidos por internet.' : e.message);
    }
  }

  async function escanear() {
    const C = window.Capacitor;
    const BS = C && C.isNativePlatform && C.isNativePlatform() ? (C.Plugins.BarcodeScanner || C.registerPlugin('BarcodeScanner')) : null;
    if (!BS) { hojaCodigo(); return; }
    try {
      const { available } = await BS.isGoogleBarcodeScannerModuleAvailable();
      if (!available) {
        BS.installGoogleBarcodeScannerModule().catch(() => {});
        hojaCodigo('Estamos preparando el lector de QR. Intenta en unos segundos o escribe el código.');
        return;
      }
      const r = await BS.scan({ formats: ['QR_CODE'] });
      const valor = r && r.barcodes && r.barcodes[0] && (r.barcodes[0].rawValue || r.barcodes[0].displayValue);
      if (valor) buscar(valor);
    } catch (e) {
      if (!/cancel/i.test(String(e && e.message))) hojaCodigo('No se pudo abrir la cámara. Escribe el código de la tienda.');
    }
  }

  // ------------------------------------------------ datos en vivo
  async function refrescar() {
    await Promise.all(tiendas.slice(0, 10).map(async (t) => {
      try { estados[claveT(t)] = await api(t, qsInfo(t)); }
      catch (e) { estados[claveT(t)] = { error: e.status === 404 ? 'Ya no recibe pedidos' : 'Sin conexión' }; }
    }));
    await Promise.all(pedidos.filter((p) => !FINALES.includes(p.paso)).slice(0, 5).map(async (p) => {
      try {
        const d = await api(p, '/seguimiento/' + encodeURIComponent(p.k));
        p.paso = d.paso; p.numero = d.numero || p.numero; p.negocio = d.negocio || p.negocio;
        p.repartidor = d.repartidor ? d.repartidor.nombre : '';
      } catch (e) { if (e.status === 404) p.paso = 'cancelado'; }
    }));
    guardarTodo();
    if (!capa.innerHTML && vista !== 'datos') pintar();
  }

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-acc],[data-tienda],[data-pedido],[data-vista],[data-quitar],[data-cerrar]');
    if (!el) return;
    if (el.dataset.cerrar !== undefined && !el.dataset.acc) { if (ev.target === el) cerrarHoja(); return; }
    if (el.dataset.vista) { vista = el.dataset.vista; pintar(); window.scrollTo(0, 0); return; }
    if (el.dataset.tienda) { const t = tiendas.find((x) => claveT(x) === el.dataset.tienda); if (t) { agregarTienda(t); location.href = urlTienda(t); } return; }
    if (el.dataset.pedido) { const p = pedidos.find((x) => x.k === el.dataset.pedido); if (p) location.href = urlTienda({ h: p.h, s: p.s, c: p.c }, { p: p.k }); return; }
    if (el.dataset.quitar) { tiendas = tiendas.filter((x) => claveT(x) !== el.dataset.quitar); guardarTodo(); pintar(); return; }
    const a = el.dataset.acc;
    if (a === 'escanear') escanear();
    else if (a === 'codigo') hojaCodigo();
    else if (a === 'cerrar') cerrarHoja();
    else if (a === 'buscarCodigo') buscar(document.getElementById('codigo').value);
    else if (a === 'guardarDatos') {
      datos.nombre = document.getElementById('dNombre').value.trim().slice(0, 150);
      datos.telefono = document.getElementById('dTel').value.trim().slice(0, 20);
      guardarTodo(); vista = 'tiendas'; pintar();
    }
  });

  recibirRegreso();
  pintar();
  refrescar();
  setInterval(() => { if (!document.hidden) refrescar(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refrescar(); });
})();
</script>
</body>
</html>
