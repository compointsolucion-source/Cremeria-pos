<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Configurar Compoint Punto</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="estilos-asistente.css"></head>
<body>
<div class="app">
  <aside class="lado">
    <img class="lg" src="logo-claro.png" alt="Compoint, punto de soluciones">
    <div class="pasos" id="pasosLado"></div>
    <div class="v">Compoint Punto<br>Versión <span id="ver">1.0.0</span></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// c = configuración actual; uso = 'caja' | 'servidor'; vinoDeUso = si se mostró la pantalla de uso
const S = { c: {}, pant: 'uso', uso: 'caja', vinoDeUso: false, rutas: null };

function pintarLado() {
  const nombres = S.vinoDeUso ? ['Uso', 'Conexión'] : ['Conexión'];
  const n = S.vinoDeUso && S.pant === 'conexion' ? 2 : 1;
  $('#pasosLado').innerHTML = nombres.map((t, i) => {
    const k = i + 1;
    return '<div class="' + (k === n ? 'on' : (k < n ? 'hecho' : '')) + '"><i>' + (k < n ? '✓' : k) + '</i>' + t + '</div>';
  }).join('');
}

function dibujar() { pintarLado(); (S.pant === 'uso' ? pantallaUso : pantallaConexion)(); $('#main').scrollTop = 0; }

/* ------------------------------------------------------------ ¿Cómo se usará esta computadora? */
function pantallaUso() {
  const srv = S.uso === 'servidor';
  $('#main').innerHTML =
    '<h1>¿Cómo se usará esta computadora?</h1>' +
    '<p class="s">Solo se pregunta una vez. Podrás cambiarlo después desde el icono junto al reloj.</p>' +
    '<div class="opc">' +
      '<button class="op' + (!srv ? ' sel' : '') + '" data-uso="caja"><span class="rd"></span><span class="ic">🖥️</span><div><h3>Caja o equipo normal</h3><p>Se conecta al sistema del negocio (en internet o en la red del local).</p></div></button>' +
      '<button class="op' + (srv ? ' sel' : '') + '" data-uso="servidor"><span class="rd"></span><span class="ic">🗄️</span><div><h3>Servidor del negocio</h3><p>Guarda toda la información, sigue vendiendo sin internet y hace respaldos. Las demás cajas se conectan a esta.</p></div></button>' +
    '</div>' +
    (srv ? '<div class="aviso azul">La información del negocio se guardará en <b>' + esc(S.rutas ? S.rutas.datos : 'C:\\CompointPunto\\datos') + '</b> y los respaldos en <b>' + esc(S.rutas ? S.rutas.respaldos : 'C:\\CompointPunto\\Respaldos') + '</b>.</div>' : '') +
    '<div class="pie"><small>Si no estás seguro, elige «Caja» y pregunta a Compoint.</small><div class="der"><button class="pri" id="sig">' + (srv ? 'Preparar el servidor' : 'Siguiente') + '</button></div></div>';
  document.querySelectorAll('[data-uso]').forEach((b) => { b.onclick = () => { S.uso = b.dataset.uso; pantallaUso(); }; });
  $('#sig').onclick = () => {
    if (S.uso === 'servidor') { $('#sig').disabled = true; $('#sig').textContent = 'Abriendo…'; compointServidor.elegirModoServidor(); }
    else { S.pant = 'conexion'; dibujar(); }
  };
}

/* ------------------------------------------------------------ Conexión al sistema del negocio */
function pantallaConexion() {
  const c = S.c;
  $('#main').innerHTML =
    '<h1>Conectar con el sistema del negocio</h1>' +
    '<p class="s">Escribe la dirección del sistema de este negocio (te la da Compoint). Solo se hace una vez en este equipo.</p>' +
    (window.compointServidor ? '<div class="aviso azul">Esta opción <b>solo abre tu sistema de internet</b> en una ventana: la información se queda en la nube. Si quieres tenerla en esta computadora (y vender aunque se vaya el internet), ' + (S.vinoDeUso ? 'vuelve atrás y elige <b>«Servidor del negocio»</b>' : 'convierte esta computadora en servidor con el enlace de abajo') + ' → <b>«Ya tengo mi sistema en la nube»</b>.</div>' : '') +
    '<div class="camp"><label>Dirección del sistema</label><input id="url" placeholder="https://minegocio.onrender.com  (o la del servidor: http://192.168.1.10:3000)" autofocus></div>' +
    '<div class="fila-busca"><button class="sec" id="buscar" type="button">Buscar servidor en la red</button><span id="busq"></span></div>' +
    '<div id="hallados" style="display:grid;gap:6px"></div>' +
    '<div class="camp"><label>Nombre del negocio (opcional)</label><input id="nombre" placeholder="Mi negocio"></div>' +
    '<details class="que"><summary>Entrar automáticamente con un usuario (opcional)</summary><div class="cuerpo">' +
      '<div class="f2"><div class="camp"><label>Usuario</label><input id="usuario" autocomplete="off"></div><div class="camp"><label>Contraseña</label><input id="password" type="password" autocomplete="off"></div></div>' +
      '<div class="nota">Solo para equipos de una sola persona. La contraseña se guarda cifrada con tu cuenta de Windows y solo entra sola al abrir el programa; si cierras sesión, la siguiente vez la escribes tú.</div></div></details>' +
    '<div class="err" id="err"></div>' +
    (c.configurado && window.compointServidor ? '<button class="enlace" id="esServidor" type="button">Quiero la información en esta computadora: convertirla en el servidor del negocio (y traer mi información de la nube)…</button>' : '') +
    '<div class="pie"><small>Los datos se guardan solo en este equipo.</small><div class="der">' +
      (S.vinoDeUso ? '<button class="sec" id="atras">Atrás</button>' : '') +
      (c.configurado ? '<button class="sec" id="cancelar">Cancelar</button>' : '') +
      '<button class="pri" id="ok">Guardar y abrir</button></div></div>';

  if (c.url) $('#url').value = c.url;
  if (c.nombre && c.nombre !== 'Compoint Punto') $('#nombre').value = c.nombre;
  if (c.usuario) $('#usuario').value = c.usuario;
  if ($('#atras')) $('#atras').onclick = () => { S.pant = 'uso'; dibujar(); };
  if ($('#cancelar')) $('#cancelar').onclick = () => compoint.cerrar();
  if ($('#esServidor')) $('#esServidor').onclick = () => compointServidor.elegirModoServidor();

  $('#ok').onclick = async () => {
    let url = $('#url').value.trim();
    if (url && !/^https?:\/\//i.test(url)) {
      // Nombre de equipo o IP (sin punto de dominio, o numérica, o con puerto) = servidor local: http y puerto 3000
      const local = /^(\d{1,3}\.){3}\d{1,3}(:\d+)?(\/.*)?$/.test(url) || /^[^./:]+(:\d+)?(\/.*)?$/.test(url);
      if (local) { const m = url.match(/^([^/:]+)(:\d+)?(\/.*)?$/); url = 'http://' + m[1] + (m[2] || ':3000') + (m[3] || '/login.html'); }
      else url = 'https://' + url;
    }
    if (!url) { $('#err').textContent = 'Escribe la dirección del sistema'; return; }
    const r = await compoint.guardarConfig({ url, nombre: $('#nombre').value.trim(), usuario: $('#usuario').value.trim(), password: $('#password').value });
    if (r && r.error) $('#err').textContent = r.error;
  };

  $('#buscar').onclick = async () => {
    const b = $('#buscar'), s = $('#busq'), h = $('#hallados');
    b.disabled = true; h.innerHTML = ''; s.textContent = 'Buscando en la red…';
    const r = await compoint.buscarServidores();
    b.disabled = false;
    if (!r.length) { s.textContent = 'No se encontró ninguno. Revisa que el servidor esté encendido y el Firewall permita el acceso.'; return; }
    s.textContent = r.length + ' encontrado(s):';
    r.forEach((x) => {
      const d = document.createElement('button'); d.type = 'button'; d.className = 'hallado';
      d.textContent = (x.equipo ? x.equipo + '  —  ' : '') + x.url;
      d.onclick = () => { $('#url').value = x.url + '/login.html'; };
      h.appendChild(d);
    });
  };
  $('#url').focus();
}

document.addEventListener('keyup', (e) => { if (e.key === 'Enter' && S.pant === 'conexion' && document.activeElement && document.activeElement.tagName === 'INPUT') $('#ok').click(); });

(async () => {
  S.c = await compoint.leerConfig();
  if (S.c.version) $('#ver').textContent = S.c.version;
  try { S.rutas = await compointServidor.rutasPrevistas(); } catch (e) { S.rutas = null; }
  // Primera vez (sin dirección guardada): se pregunta si esta computadora es caja o servidor.
  S.vinoDeUso = !S.c.configurado && !!window.compointServidor;
  S.pant = S.vinoDeUso ? 'uso' : 'conexion';
  dibujar();
})();
</script>
</body></html>
